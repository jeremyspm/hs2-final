<script>window.REP_DATA = {"version":1,"cases":[{"id":"c2","title":"Exam case 2 · The aftereffects of lymph node removal","scope":"Say what the lymphatic system does (three jobs), how cancer reaches the axillary nodes and why they are checked, and why removing them swells the arm (lymphoedema — the drainage route is gone).","tip":"Short written answers of 2–3 marks each; her formative test turns the metastasis question into drop-downs.","held":[],"map":["Blood capillaries leave fluid in tissues. Lymph vessels return the excess to the blood.","Nodes filter lymph and bring immune cells together. Cancer cells may travel by this route.","Removing axillary nodes can interrupt drainage from the arm, causing lymphoedema."]},{"id":"c3","title":"Exam case 3 · Asthma","scope":"Name dyspnoea; say what narrows the airway in an attack and what that does to resistance and ventilation; how a reliever and a preventer work; the lungs’ defences and the muco-ciliary escalator (and what smoking does to it); the baroreflex that brings blood pressure back down afterwards; and her four lung micrographs — trachea, bronchus, bronchiole, alveoli — by lining, cartilage and smooth muscle.","tip":"Eight written questions from 1 to 4 marks; the baroreflex one is the longest. Her exam helpline adds “CASE STUDY LUNG HISTOLOGY FOR EXAM” under this case: expect her four micrographs, perhaps unlabelled.","held":[],"map":["Asthma narrows the airway through muscle contraction, swelling and mucus. Narrower airways resist airflow.","Cilia and mucus normally clear debris; smoking damages this clearance.","The case also asks about lung micrographs and the baroreceptor response to raised blood pressure."]},{"id":"c4","title":"Exam case 4 · Panic attacks","scope":"Bullet the steps of inhalation and exhalation, name the forced-breathing muscles, list what makes ventilation easier or harder, and run the bicarbonate buffer both ways: hyperventilation → CO2 down → pH up (respiratory alkalosis), and how breathing corrects a metabolic change — then fill her two acid–base tables (metabolic, respiratory) and say what they share.","tip":"Eleven written questions; the buffer equation is asked outright, and her two starred acid–base tables are one cell per line in her 2024 deck (slides 15–16). Her hook under them: CO2 and H+ are linked — whatever happens to one, happens to the other.","held":[],"map":["Muscles change chest volume. Volume changes pressure; air moves down the pressure gradient.","Ventilation removes CO₂. CO₂ and H⁺ move together; pH moves the opposite way.","A breathing problem can cause a pH change. A metabolic pH change can instead make breathing compensate."]},{"id":"c6","title":"Exam case 6 · Diabetes","scope":"Where insulin is made (beta cells, islets of Langerhans), the hormones that oppose it and where each comes from, the GLUT4 story at the cell, and insulin’s job in liver, muscle and fat — plus the yellow, unstarred part: what glucagon does, her day graph of glucose and insulin (basal vs bolus, never zero, lowest overnight), and what pancreatic fatigue leads to.","tip":"Six starred short written answers (1–4 marks); her formative test asks the liver / muscle / fat roles as drop-downs. Five more are unstarred but inside this yellow case, with her day graph: she says those can be asked too, depending on marks.","held":[],"map":["Insulin is the signal to take up and store glucose after a meal. Glucagon helps release glucose between meals.","The pancreas senses glucose. Insulin acts through receptors; GLUT4 insertion lets muscle and fat cells take up more glucose.","Use those relationships to explain the daily graph, fasting and diabetes."]},{"id":"c8","title":"Exam case 8 · Joints and arthritis","scope":"Name and give the function of every lettered joint structure, describe rheumatoid arthritis, name osteoarthritis and set the two side by side, and explain where cortisol comes from, what it does in stress, and why it helps Shannon — plus the yellow, unstarred part: why synovial joints matter, which type the hip, knee, shoulder and elbow are, what bursitis is, and what to tell Shannon.","tip":"A label-and-function table on her joint figure, then short written answers; her formative test asks the joint letters as drop-downs. Her 30 May 2024 session: “the diagrams in the case studies will be in the exam. I’m promising you” — this joint is “definitely in”, perhaps numbered 1, 2, 3 instead of lettered.","held":[],"map":["A synovial joint combines smooth cartilage, lubrication, a capsule and supporting ligaments.","Osteoarthritis involves degenerative joint changes. Rheumatoid arthritis is autoimmune inflammation.","Cortisol links the stress-response questions to suppression of inflammation in the arthritis questions."]},{"id":"c9","title":"Exam case 9 · Neurotransmitters and the brain","scope":"Define a neurotransmitter, say where dopamine is made, give calcium’s role, walk the steps of synaptic transmission from the action potential to re-uptake, and label every letter of her synapse figure — plus the unstarred levodopa question (the blood-brain barrier).","tip":"Short written answers; the step sequence is the long one, and her formative test asks the synapse figure as drop-downs. Her 2024 sessions: “you will get this specific drawing in the exam” (label it: pre/post by vesicles/receptors, Ca2+ and reuptake channels, exocytosis, diffusion); “you will probably be asked to place [the steps] in the right order”; and depth — “a superficial answer will just say neurotransmitters diffuse… you must give all seven steps”.","held":[],"map":["An electrical signal reaches the presynaptic terminal. Calcium entry triggers chemical transmitter release.","The transmitter crosses a gap and binds receptors on the next cell. The signal must then be cleared.","Match each step to the synapse picture, and connect dopamine loss to Parkinson’s treatment."]},{"id":"c10","title":"Exam case 10 · Stroke and the brain","scope":"Put a name and a function on every lettered area of her cerebrum figure, and say what damage there would change — plus the guided “where is it” answers for the cerebellum, pons, medulla and corpus callosum.","tip":"Her figure with letters; her formative test asks the areas as drop-downs and the four brain-part locations as fill-in-the-gaps. Her 31 May 2024 session (1:09:29–1:13:51): “you’ll get the same diagram in the exam, even ABCs on the same places”. Her hooks: the central sulcus divides the frontal lobe (in front, MOTOR) from the parietal lobe (behind, SENSORY); Broca’s area is motor (“the motor mouth”, producing speech), Wernicke’s is sensory (understanding it); G, vision, is in the occipital lobe. And “make a note of it”: two types of stroke — ischaemic (the majority, a blood clot, a lack of blood supply) and haemorrhagic (a burst vessel or aneurysm, the most serious).","held":[],"map":["A brain region has a job. Damage can impair that job.","Motor cortex sits in front of the central sulcus; somatosensory cortex sits behind it.","Learn the locations on her image, then retrieve the functions and the effects of damage."]},{"id":"c13","title":"Exam case 13 · Fertility","scope":"Explain the ovulation predictor kit (the LH surge), what happens at ovulation step by step, the fertile days on her graph, why the hormones rise and fall, and what pregnancy does to the graph, how progesterone contraception works, and her contraception table (how each method prevents pregnancy, and which one also stops STIs) — then the fertility-factor, sex-hormone and IVF questions she has not answered yet.","tip":"Her Fertility quiz turns this case into matching, true/false, a six-blank drop-down and MCQs; the exam may ask any of them written. Her 2024 session (17:28–24:13, 37:21): the cycle graph IS in the exam, but the labels may be taken away (phase, hormone and cycle names, letters instead) — know each curve by its shape: LH peaks just before ovulation, progesterone is low then peaks in the second half, and FSH goes with follicular and proliferative (“keep the F’s together”).","held":[],"map":["FSH helps follicles grow; LH triggers ovulation. Oestrogen and progesterone prepare and maintain the uterine lining.","Fertility depends on viable gametes, suitable timing and a route for them to meet.","Contraception interrupts the process. IVF helps fertilisation take place outside the body."]},{"id":"c14","title":"Exam case 14 · RG colour blindness","scope":"Rods vs cones (where, what for), RG colour blindness as faulty L and M cones, every relative’s genotype through Simon’s maternal grandfather and carrier mum, the X-linked recessive rules, and why he passes it to none of his sons but all his daughters.","tip":"Her exam revision deck asks it as MCQ (“X-linked recessive”) and fill-the-gaps (retina → photoreceptor → cone). Her 2024 session: the exam will NOT ask you to draw the pedigree, but may give the phenotypes and ask for each genotype as a fill-in (1:00:49).","held":[],"map":["Rods support dim-light vision; cones support colour and detailed vision.","For this X-linked recessive condition, a male has one X; a female has two. Track the affected allele.","Fathers give sons a Y and daughters an X. Mothers give an X to every child."]},{"id":"c15","title":"Exam case 15 · Genetic diseases","scope":"Cystic fibrosis = autosomal recessive (carriers, skips generations); Huntington’s = autosomal dominant on chromosome 4 (one copy is enough). Read both family pedigrees for every genotype and phenotype, and work out the chance each youngest member passes it on.","tip":"Pedigree charts with written genotypes, and a mode-of-inheritance table; her Module 3 help board names Huntington’s in these words.","held":[],"map":["First identify recessive or dominant inheritance. Then decide which genotype makes a person shaded.","CF: two recessive alleles are required. An unaffected person may still be a carrier.","Huntington’s: one dominant allele is enough in these pedigree exercises. Use family relationships to fill uncertain genotypes."]}],"questions":[{"id":"q6732f41a5b","quiz":"case-c2","sys":"lymph","mod":"cases","cmod":"m1","type":"essay","pts":3,"q":"What are the major functions of the lymphatic system, which the lymph is a part of?","imgs":[],"qh":"<p>What are the major functions of the lymphatic system, which the lymph is a part of?<\/p>","qt":"What are the major functions of the lymphatic system, which the lymph is a part of?","saq":{"steps":["Digestive: lacteals in the gut, into which dietary fat is absorbed to be taken for processing.","Immunological: the immune response — thymus (T cells mature), bone marrow (B cells mature, making antibodies), lymph nodes (where lymphocytes and other immune cells interact to create and coordinate an immune response; areas of high immune-cell activity).","Fluid balance: the drainage points of interstitial fluid — draining away excess tissue fluid for monitoring (any antigens are easily found) and returning it to the venous system."],"src":"Her answer · 2024 case-study model-answers deck, slides 3–5"},"scenario":"Exam case 2 · The aftereffects of lymph node removal — Aleki and Vicky visit their friend, Mary who had undergone a right mastectomy for cancer a fortnight ago. Mary mentioned the cancer had spread to the lymph nodes and that some axillary lymph nodes were also removed. She complained of swelling in the right arm after the surgery. Her friend, who is good with mirimiri and massage offers to help massage her arm, which helps to bring down the swelling.","caseId":"c2","short":{"id":"c:c2:what are the major","title":"Lymphatic system: three functions","hook":"DIGEST fat, DEFEND the body, DRAIN the tissues.","groups":[{"q":"Digestive","facts":[{"t":"**Digestive**: **lacteals** in the gut absorb **dietary fat**","of":[0]}]},{"q":"Immunological","facts":[{"t":"**Immunological**: the **immune response**","of":[1]},{"t":"**thymus** (**T cells** mature), **bone marrow** (**B cells** mature)","of":[1]},{"t":"**lymph nodes**: where immune cells meet and coordinate","of":[1]}]},{"q":"Fluid balance","facts":[{"t":"**Fluid balance**: drains **excess tissue fluid**","of":[2]},{"t":"and returns it to the **venous system**","of":[2]}]}]},"note":"Think of three linked jobs: collect fat from the gut, support immune defence, and return excess tissue fluid to the bloodstream. Name the structures as well as the jobs.","source":"Her answer · 2024 case-study model-answers deck, slides 3–5","starred":true},{"id":"q3a616933df","quiz":"case-c2","sys":"lymph","mod":"cases","cmod":"m1","type":"essay","pts":2,"q":"What is the role of the axillary lymph nodes in the spread of cancer? Explain.","imgs":[],"qh":"<p>What is the role of the axillary lymph nodes in the spread of cancer? Explain.<\/p>","qt":"What is the role of the axillary lymph nodes in the spread of cancer? Explain.","saq":{"steps":["Spread of cancer is metastasis: if a cancerous cell detaches from its origin (a tumour) and gets into the lymphatic system it can potentially reach any part of the body.","We check the axillary (armpit) nodes for cancer cells: the first node to be affected, closest to the breast, is the sentinel node — cancer cells there show the cancer has spread; none there gives some confidence it is limited to the breast."],"src":"Her answer · 2024 case-study model-answers deck, slide 6"},"scenario":"Exam case 2 · The aftereffects of lymph node removal — Aleki and Vicky visit their friend, Mary who had undergone a right mastectomy for cancer a fortnight ago. Mary mentioned the cancer had spread to the lymph nodes and that some axillary lymph nodes were also removed. She complained of swelling in the right arm after the surgery. Her friend, who is good with mirimiri and massage offers to help massage her arm, which helps to bring down the swelling.","caseId":"c2","short":{"id":"c:c2:what is the role","title":"Axillary nodes and cancer spread","hook":"Cancer escapes into the lymph; the SENTINEL node is checked first.","groups":[{"q":"How cancer spreads","facts":[{"t":"Spread of cancer = **metastasis**","of":[0]},{"t":"Cancer cells in the **lymphatic system** can reach **any part of the body**","of":[0]}]},{"q":"Why the axillary nodes matter","facts":[{"t":"The **axillary** (armpit) nodes are checked for **cancer cells**","of":[1]},{"t":"The first, closest to the breast, is the **sentinel node**","of":[1]},{"t":"Cancer there = it has **spread**; none = likely still in the breast","of":[1]}]}]},"note":"Breast lymph drains towards axillary nodes. Cancer cells can follow that drainage route, so examining nodes helps show whether cancer has spread. The sentinel node is the first draining node assessed.","source":"Her answer · 2024 case-study model-answers deck, slide 6","starred":true},{"id":"q9aee7ae3e9","quiz":"case-c2","sys":"lymph","mod":"cases","cmod":"m1","type":"essay","pts":2,"q":"Why did Mary develop swelling in the right arm after mastectomy? You will need to think about fluid dynamics, and what causes fluid to move into or still in the interstitial spaces (tissue space).","imgs":[],"qh":"<p>Why did Mary develop swelling in the right arm after mastectomy? You will need to think about fluid dynamics, and what causes fluid to move into or still in the interstitial spaces (tissue space).<\/p>","qt":"Why did Mary develop swelling in the right arm after mastectomy? You will need to think about fluid dynamics, and what causes fluid to move into or still in the interstitial spaces (tissue space).","saq":{"steps":["When the lymph nodes are removed, the fluid that normally drains from the arm through those nodes is blocked.","With nowhere for the remaining tissue fluid to go (normally it drains through the lymphatic vessels and returns to the venous system at the subclavian vein), the lymphatic vessels fill until they cannot drain the tissue fluid from the tissue — lymphoedema."],"src":"Her answer · 2024 case-study model-answers deck, slide 7"},"scenario":"Exam case 2 · The aftereffects of lymph node removal — Aleki and Vicky visit their friend, Mary who had undergone a right mastectomy for cancer a fortnight ago. Mary mentioned the cancer had spread to the lymph nodes and that some axillary lymph nodes were also removed. She complained of swelling in the right arm after the surgery. Her friend, who is good with mirimiri and massage offers to help massage her arm, which helps to bring down the swelling.","caseId":"c2","short":{"id":"c:c2:why did mary develop","title":"Mary's swollen arm","hook":"Nodes out → drain BLOCKED → fluid stays → LYMPHOEDEMA.","groups":[{"q":"Why the arm swells","facts":[{"t":"Removing the **lymph nodes**: the arm's drainage is **blocked**","of":[0]},{"t":"Normally tissue fluid drains back at the **subclavian vein**","of":[1]},{"t":"Now the **lymphatic vessels** fill and cannot drain the tissue","of":[1]},{"t":"The swelling is **lymphoedema**","of":[1]}]}]},"note":"Fluid continues to leave blood capillaries after surgery. If lymph drainage is damaged, that fluid cannot leave the arm adequately. The imbalance between inflow and drainage produces swelling.","source":"Her answer · 2024 case-study model-answers deck, slide 7","starred":true},{"id":"qfa09d306fc","quiz":"case-c3","sys":"resp","mod":"cases","cmod":"m1","type":"essay","pts":1,"q":"What term is used to describe difficulty breathing?","imgs":[],"qh":"<p>What term is used to describe difficulty breathing?<\/p>","qt":"What term is used to describe difficulty breathing?","saq":{"steps":["Dyspnoea — dys (bad, not good) + pnoea (breathing). Compare eupnoea (normal), tachypnoea (fast), apnoea (none), hyperventilation (hard and fast, changing blood CO₂)."],"src":"Her answer · 2024 case-study model-answers deck, slide 17"},"scenario":"Exam case 3 · Asthma — Ane has had severe asthma since they were young. During a particularly bad asthma attack, Ane is experiencing difficulty breathing, particularly on the out-breath. Ane’s asthma is often triggered by small particles of pollen that manage to make their way into their lungs despite the protective features designed to keep them out. Ane makes sure to have their Salbutamol inhaler, which helps to relieve the symptoms of their asthma attack.","caseId":"c3","short":{"id":"c:c3:what term is used","title":"Difficulty breathing: the term","hook":"DYS = bad, PNOEA = breathing.","groups":[{"q":"The term","facts":[{"t":"**Dyspnoea**: **dys** (bad) + **pnoea** (breathing)","of":[0]}]}]},"note":"Dyspnoea names the symptom of difficult or uncomfortable breathing. The word does not itself identify the cause.","source":"Her answer · 2024 case-study model-answers deck, slide 17","starred":true},{"id":"qa113555c77","quiz":"case-c3","sys":"resp","mod":"cases","cmod":"m1","type":"essay","pts":3,"q":"What is happening in Ane’s lungs to make breathing difficult?","imgs":[],"qh":"<p>What is happening in Ane’s lungs to make breathing difficult?<\/p>","qt":"What is happening in Ane’s lungs to make breathing difficult?","saq":{"steps":["Bronchoconstriction: the airway becomes constricted — the smooth muscle around it has contracted.","Inflammation: the wall of the airway is thick with swelling.","Increased mucus secretion as well — less room for air."],"src":"Her answer · 2024 case-study model-answers deck, slide 18"},"scenario":"Exam case 3 · Asthma — Ane has had severe asthma since they were young. During a particularly bad asthma attack, Ane is experiencing difficulty breathing, particularly on the out-breath. Ane’s asthma is often triggered by small particles of pollen that manage to make their way into their lungs despite the protective features designed to keep them out. Ane makes sure to have their Salbutamol inhaler, which helps to relieve the symptoms of their asthma attack.","caseId":"c3","short":{"id":"c:c3:what is happening in","title":"What asthma does to the airways","hook":"SQUEEZE, SWELL, SLIME.","groups":[{"q":"Three things narrow the airway","facts":[{"t":"**Bronchoconstriction**: the airway **smooth muscle** has **contracted**","of":[0]},{"t":"**Inflammation**: the airway wall is thick with **swelling**","of":[1]},{"t":"More **mucus** secretion: less room for air","of":[2]}]}]},"note":"Picture the airway opening getting smaller from three directions: muscle squeezes it, its wall swells, and mucus occupies the remaining space. All three reduce the space available for airflow.","source":"Her answer · 2024 case-study model-answers deck, slide 18","starred":true},{"id":"qf5924de181","quiz":"case-c3","sys":"resp","mod":"cases","cmod":"m1","type":"essay","pts":2,"q":"How is Ane’s ventilation and airway resistance impacted?","imgs":[],"qh":"<p>How is Ane’s ventilation and airway resistance impacted?<\/p>","qt":"How is Ane’s ventilation and airway resistance impacted?","saq":{"steps":["Airway resistance is high → harder to breathe (a greater pressure difference is required) → dyspnoea.","Accessory respiratory muscles are recruited — extra muscles for breathing, an \"increase in the work of breathing\"."],"src":"Her answer · 2024 case-study model-answers deck, slide 18"},"scenario":"Exam case 3 · Asthma — Ane has had severe asthma since they were young. During a particularly bad asthma attack, Ane is experiencing difficulty breathing, particularly on the out-breath. Ane’s asthma is often triggered by small particles of pollen that manage to make their way into their lungs despite the protective features designed to keep them out. Ane makes sure to have their Salbutamol inhaler, which helps to relieve the symptoms of their asthma attack.","caseId":"c3","short":{"id":"c:c3:how is ane s","title":"Ane's ventilation and resistance","hook":"Narrow pipes: HIGH resistance, HARDER work, EXTRA muscles.","groups":[{"q":"Airway resistance","facts":[{"t":"**Airway resistance** is **high** → **harder to breathe**","of":[0]},{"t":"It needs a **greater pressure difference** → **dyspnoea**","of":[0]}]},{"q":"Ventilation","facts":[{"t":"**Accessory respiratory muscles** are recruited","of":[1]},{"t":"An **increase in the work of breathing**","of":[1]}]}]},"note":"A narrower airway creates greater resistance. Moving air then takes more muscular effort, and ventilation can fall. Connect the structural narrowing to the functional effect.","source":"Her answer · 2024 case-study model-answers deck, slide 18","starred":true},{"id":"q0f73a5184b","quiz":"case-c3","sys":"resp","mod":"cases","cmod":"m1","type":"essay","pts":1,"q":"How does an inhaler help when Ane is having an asthma attack?","imgs":[],"qh":"<p>How does an inhaler help when Ane is having an asthma attack?<\/p>","qt":"How does an inhaler help when Ane is having an asthma attack?","saq":{"steps":["A reliever inhaler is a BRONCHODILATOR: it forces the airway smooth muscle to relax, which lets the airway widen and relieves the symptoms so you can breathe. (A preventer is a corticosteroid — anti-inflammatory.)"],"src":"Her answer · 2024 case-study model-answers deck, slide 18"},"scenario":"Exam case 3 · Asthma — Ane has had severe asthma since they were young. During a particularly bad asthma attack, Ane is experiencing difficulty breathing, particularly on the out-breath. Ane’s asthma is often triggered by small particles of pollen that manage to make their way into their lungs despite the protective features designed to keep them out. Ane makes sure to have their Salbutamol inhaler, which helps to relieve the symptoms of their asthma attack.","caseId":"c3","short":{"id":"c:c3:how does an inhaler","title":"How the reliever inhaler helps","hook":"The reliever RELAXES the airway; the preventer calms inflammation.","groups":[{"q":"The reliever","facts":[{"t":"A reliever is a **bronchodilator**","of":[0]},{"t":"The airway **smooth muscle** is forced to **relax**, so the airway widens","of":[0]},{"t":"(A preventer is a **corticosteroid**: **anti-inflammatory**)","of":[0]}]}]},"note":"Relaxing the smooth muscle widens the airway. This reduces resistance and makes airflow easier. Connect the medication’s action to the part of asthma it relieves.","source":"Her answer · 2024 case-study model-answers deck, slide 18","starred":true},{"id":"q37e28a925c","quiz":"case-c3","sys":"resp","mod":"cases","cmod":"m1","type":"essay","pts":3,"q":"How does the body usually keep dust and small particles out of the lungs? There are several mechanisms for this!","imgs":[],"qh":"<p>How does the body usually keep dust and small particles out of the lungs? There are several mechanisms for this!<\/p>","qt":"How does the body usually keep dust and small particles out of the lungs? There are several mechanisms for this!","saq":{"steps":["Mucus and cilia — the muco-ciliary escalator.","Nasal hairs — a filter that traps particles, which end up stuck in mucus.","The carina at the bottom of the trachea stimulates the cough reflex; the epiglottis keeps large objects out of the trachea (not effective against small particles)."],"src":"Her answer · 2024 case-study model-answers deck, slide 19"},"scenario":"Exam case 3 · Asthma — Ane has had severe asthma since they were young. During a particularly bad asthma attack, Ane is experiencing difficulty breathing, particularly on the out-breath. Ane’s asthma is often triggered by small particles of pollen that manage to make their way into their lungs despite the protective features designed to keep them out. Ane makes sure to have their Salbutamol inhaler, which helps to relieve the symptoms of their asthma attack.","caseId":"c3","short":{"id":"c:c3:how does the body","title":"Keeping dust out of the lungs","hook":"STICK and SWEEP, FILTER, COUGH.","groups":[{"q":"The defences","facts":[{"t":"**Mucus and cilia**: the **muco-ciliary escalator**","of":[0]},{"t":"**Nasal hairs** filter; particles stick in **mucus**","of":[1]},{"t":"The **carina** triggers the **cough reflex**","of":[2]},{"t":"The **epiglottis** keeps large objects out of the **trachea**","of":[2]}]}]},"note":"Different defences act at different levels: trap particles, move them out, expel them, or engulf them. Learn the named structures with the jobs in the answer below.","source":"Her answer · 2024 case-study model-answers deck, slide 19","starred":true},{"id":"q4d2b76c870","quiz":"case-c3","sys":"resp","mod":"cases","cmod":"m1","type":"essay","pts":2,"q":"The muco-cillary escalator is one of the mechanism. How does the muco-cillary escalator work?","imgs":[],"qh":"<p>The muco-cillary escalator is one of the mechanism. How does the muco-cillary escalator work?<\/p>","qt":"The muco-cillary escalator is one of the mechanism. How does the muco-cillary escalator work?","saq":{"steps":["Cilia — small hair-like structures lining the respiratory epithelium — beat to sweep mucus up and out of the airways.","Mucus is sticky: particles and dust get stuck in it and are trapped, then carried up on the cilia."],"src":"Her answer · 2024 case-study model-answers deck, slide 20"},"scenario":"Exam case 3 · Asthma — Ane has had severe asthma since they were young. During a particularly bad asthma attack, Ane is experiencing difficulty breathing, particularly on the out-breath. Ane’s asthma is often triggered by small particles of pollen that manage to make their way into their lungs despite the protective features designed to keep them out. Ane makes sure to have their Salbutamol inhaler, which helps to relieve the symptoms of their asthma attack.","caseId":"c3","short":{"id":"c:c3:the muco cillary escalator","title":"The muco-ciliary escalator","hook":"Mucus STICKS it, cilia SWEEP it up and out.","groups":[{"q":"How it works","facts":[{"t":"**Cilia** line the **respiratory epithelium**","of":[0]},{"t":"They **beat to sweep mucus up and out** of the airways","of":[0]},{"t":"**Mucus** is **sticky**: dust is **trapped** in it","of":[1]}]}]},"note":"Mucus traps inhaled particles. Cilia beat to move the mucus towards the throat, where it can be swallowed or expelled. Trapping and moving are two separate jobs.","source":"Her answer · 2024 case-study model-answers deck, slide 20","starred":true},{"id":"q799f22cca4","quiz":"case-c3","sys":"resp","mod":"cases","cmod":"m1","type":"essay","pts":2,"q":"Smoking damages this escalator – how would this impact a smoker?","imgs":[],"qh":"<p>Smoking damages this escalator – how would this impact a smoker?<\/p>","qt":"Smoking damages this escalator – how would this impact a smoker?","saq":{"steps":["The cilia are damaged, so mucus cannot be moved up and out of the lungs.","A smoker’s cough develops to replace the lost function of the cilia."],"src":"Her answer · 2024 case-study model-answers deck, slide 20"},"scenario":"Exam case 3 · Asthma — Ane has had severe asthma since they were young. During a particularly bad asthma attack, Ane is experiencing difficulty breathing, particularly on the out-breath. Ane’s asthma is often triggered by small particles of pollen that manage to make their way into their lungs despite the protective features designed to keep them out. Ane makes sure to have their Salbutamol inhaler, which helps to relieve the symptoms of their asthma attack.","caseId":"c3","short":{"id":"c:c3:smoking damages this escalator","title":"What smoking does to the escalator","hook":"Cilia DAMAGED → mucus STUCK → smoker's COUGH.","groups":[{"q":"The effect","facts":[{"t":"The **cilia are damaged**","of":[0]},{"t":"so **mucus** cannot be moved **up and out**","of":[0]},{"t":"A **smoker’s cough** develops to replace them","of":[1]}]}]},"note":"If the cilia are damaged, mucus is no longer moved effectively. Debris and microbes remain, so the protective clearing mechanism works poorly.","source":"Her answer · 2024 case-study model-answers deck, slide 20","starred":true},{"id":"q239ad865d2","quiz":"case-c3","sys":"resp","mod":"cases","cmod":"m1","type":"essay","pts":4,"q":"Ane’s blood pressure was high due to their fight or flight response. What process helps to return their blood pressure back to normal after their asthma attack? (Think the full process!)","imgs":[],"qh":"<p>Ane’s blood pressure was high due to their fight or flight response. What process helps to return their blood pressure back to normal after their asthma attack? (Think the full process!)<\/p>","qt":"Ane’s blood pressure was high due to their fight or flight response. What process helps to return their blood pressure back to normal after their asthma attack? (Think the full process!)","saq":{"steps":["The carotid and aortic baroreceptors — stretch receptors in the blood vessel walls — pick up that the blood pressure is high (the walls are very stretched).","They send the message to the medulla oblongata: its cardio-acceleratory, cardio-inhibitory and vasomotor centres.","The cardio-inhibitory centre is stimulated and the cardio-acceleratory centre is inhibited (you can’t brake and accelerate at once).","The message goes via the vagus nerve: the rate and force of the heartbeat drop, so the cardiac output drops.","The vasomotor centre brings about vasodilation: more space for the blood.","Together these bring the blood pressure back down to normal."],"src":"Her answer · her 29 May 2024 case-study session (same Canvas page, the Lymph node removal · Panic · Asthma · Diabetes video), 1:26:36–1:33:00 (until 5 Oct this answer was the tool’s, from her CVS 4 page)"},"scenario":"Exam case 3 · Asthma — Ane has had severe asthma since they were young. During a particularly bad asthma attack, Ane is experiencing difficulty breathing, particularly on the out-breath. Ane’s asthma is often triggered by small particles of pollen that manage to make their way into their lungs despite the protective features designed to keep them out. Ane makes sure to have their Salbutamol inhaler, which helps to relieve the symptoms of their asthma attack.","hl":"cvs-bp-control","caseId":"c3","short":{"id":"c:c3:ane s blood pressure","title":"Bringing Ane's blood pressure down","hook":"STRETCH → MEDULLA: brake ON, accelerator OFF → vagus slows → vessels WIDEN.","groups":[{"q":"Sense it","facts":[{"t":"**Carotid** and **aortic baroreceptors** (**stretch receptors**) pick up **high** pressure","of":[0]}]},{"q":"Tell the brain","facts":[{"t":"To the **medulla oblongata**: **cardio-acceleratory**, **cardio-inhibitory**, **vasomotor** centres","of":[1]}]},{"q":"Slow the heart","facts":[{"t":"**Cardio-inhibitory** **stimulated**; **cardio-acceleratory** **inhibited**","of":[2]},{"t":"Via the **vagus nerve**: **rate** and **force** drop, **cardiac output** drops","of":[3]}]},{"q":"Widen the vessels","facts":[{"t":"**Vasomotor centre**: **vasodilation**, more **space** for the blood","of":[4]}]},{"q":"Result","facts":[{"t":"Blood pressure back down to **normal**","of":[5]}]}]},"note":"This is negative feedback. Stretch receptors detect the rise, signals reach the brainstem, and autonomic output reduces heart activity and vascular resistance. Follow sensor → control centre → effectors → pressure falls.","source":"Her answer · her 29 May 2024 case-study session (same Canvas page, the Lymph node removal · Panic · Asthma · Diabetes video), 1:26:36–1:33:00 (until 5 Oct this answer was the tool’s, from her CVS 4 page)","starred":true},{"id":"qe2dfe3e07a","quiz":"case-c4","sys":"resp","mod":"cases","cmod":"m1","type":"essay","pts":4,"q":"Breathing, or the process of pulmonary ventilation is how you move air in and out of your lungs and requires a specific series of steps. Bullet point the steps involved in Manaia’s inhalation.","imgs":[],"qh":"<p>Breathing, or the process of pulmonary ventilation is how you move air in and out of your lungs and requires a specific series of steps. Bullet point the steps involved in Manaia’s inhalation.<\/p>","qt":"Breathing, or the process of pulmonary ventilation is how you move air in and out of your lungs and requires a specific series of steps. Bullet point the steps involved in Manaia’s inhalation.","saq":{"steps":["The diaphragm contracts (lowering its dome) and the external intercostal muscles contract (moving the ribs up and out).","This enlarges the thoracic cavity and reduces the pressure in the intrapleural cavity (Boyle’s law).","The intrapulmonary cavity enlarges — volume increases — lowering the intrapulmonary pressure.","Air flows in from the atmosphere, from high pressure to low."],"src":"Her answer · 2024 case-study model-answers deck, slide 10"},"scenario":"Exam case 4 · Panic attacks — Manaia lives with an anxiety disorder, which sometimes manifests in panic attacks that impact on her breathing. Manaia describes her panic attack as a time when she breathes really really hard and fast and cannot control her breathing at all. You know that there is a link between breathing and the pH of your blood because the respiratory system is one of the buffer systems of the body. You know that during a prolonged panic attack, Manaia might be at risk of what is called respiratory alkalosis, but you’ll need to remember why this is.","hl":"resp-ventilation","caseId":"c4","short":{"id":"c:c4:breathing or the process","title":"Inhalation, step by step","hook":"CONTRACT → BIGGER → LOWER pressure → air IN.","groups":[{"q":"The steps","facts":[{"t":"The **diaphragm contracts** (its dome lowers)","of":[0]},{"t":"The **external intercostal muscles contract**: ribs up and out","of":[0]},{"t":"The **thoracic cavity** enlarges; **intrapleural** pressure falls (**Boyle’s law**)","of":[1]},{"t":"**Intrapulmonary** volume increases, so its pressure falls","of":[2]},{"t":"Air flows in, **from high pressure to low**","of":[3]}]}]},"note":"The breathing muscles enlarge the chest. The lungs expand with it, pressure inside the lungs falls below atmospheric pressure, and air flows in. Air follows pressure; muscles do not directly pull air molecules.","source":"Her answer · 2024 case-study model-answers deck, slide 10","starred":true},{"id":"q3e837d2c7e","quiz":"case-c4","sys":"resp","mod":"cases","cmod":"m1","type":"essay","pts":4,"q":"Bullet point the steps involved in Manaia’s exhalation.","imgs":[],"qh":"<p>Bullet point the steps involved in Manaia’s exhalation.<\/p>","qt":"Bullet point the steps involved in Manaia’s exhalation.","saq":{"steps":["The diaphragm relaxes (its dome rises) and the external intercostals relax (ribs move down and in).","The elastic lungs recoil passively, reducing the intrapulmonary volume.","Intrapulmonary pressure rises (Boyle’s law).","Air flows out of the lungs, from the higher intrapulmonary pressure to the lower atmospheric pressure."],"src":"Her answer · 2024 case-study model-answers deck, slide 11"},"scenario":"Exam case 4 · Panic attacks — Manaia lives with an anxiety disorder, which sometimes manifests in panic attacks that impact on her breathing. Manaia describes her panic attack as a time when she breathes really really hard and fast and cannot control her breathing at all. You know that there is a link between breathing and the pH of your blood because the respiratory system is one of the buffer systems of the body. You know that during a prolonged panic attack, Manaia might be at risk of what is called respiratory alkalosis, but you’ll need to remember why this is.","hl":"resp-ventilation","caseId":"c4","short":{"id":"c:c4:bullet point the steps","title":"Exhalation, step by step","hook":"RELAX → RECOIL → HIGHER pressure → air OUT.","groups":[{"q":"The steps","facts":[{"t":"The **diaphragm relaxes** (its dome rises)","of":[0]},{"t":"The **external intercostals relax**: ribs down and in","of":[0]},{"t":"The elastic lungs **recoil passively**","of":[1]},{"t":"**Intrapulmonary pressure rises** (**Boyle’s law**)","of":[2]},{"t":"Air flows out to the lower **atmospheric pressure**","of":[3]}]}]},"note":"During quiet expiration the muscles relax and elastic lung tissue recoils. Lung volume falls, pressure rises above atmospheric pressure, and air flows out. Forced expiration recruits additional muscles.","source":"Her answer · 2024 case-study model-answers deck, slide 11","starred":true},{"id":"q7694a8a77a","quiz":"case-c4","sys":"resp","mod":"cases","cmod":"m1","type":"essay","pts":2,"q":"Manaia feels tired after a panic attack because forced breathing requires more muscular effort. Which muscles are used in forced breathing? Be specific!","imgs":[],"qh":"<p>Manaia feels tired after a panic attack because forced breathing requires more muscular effort. Which muscles are used in forced breathing? Be specific!<\/p>","qt":"Manaia feels tired after a panic attack because forced breathing requires more muscular effort. Which muscles are used in forced breathing? Be specific!","saq":{"steps":["Breathing in: diaphragm and external intercostals contract; when forced, also the neck muscles — sternocleidomastoid and scalenes.","Breathing out: diaphragm and external intercostals relax; when forced, the abdominal muscles and the internal intercostals contract."],"src":"Her answer · 2024 case-study model-answers deck, slide 12"},"scenario":"Exam case 4 · Panic attacks — Manaia lives with an anxiety disorder, which sometimes manifests in panic attacks that impact on her breathing. Manaia describes her panic attack as a time when she breathes really really hard and fast and cannot control her breathing at all. You know that there is a link between breathing and the pH of your blood because the respiratory system is one of the buffer systems of the body. You know that during a prolonged panic attack, Manaia might be at risk of what is called respiratory alkalosis, but you’ll need to remember why this is.","hl":"resp-ventilation","caseId":"c4","short":{"id":"c:c4:manaia feels tired after","title":"The muscles of forced breathing","hook":"IN: the neck lifts. OUT: the abs and internal intercostals squeeze.","groups":[{"q":"Breathing in","facts":[{"t":"At rest: **diaphragm** and **external intercostals** contract","of":[0]},{"t":"Forced: also **sternocleidomastoid** and **scalenes** (neck)","of":[0]}]},{"q":"Breathing out","facts":[{"t":"Forced: the **abdominal muscles** and **internal intercostals** contract","of":[1]}]}]},"note":"Quiet inspiration already uses the diaphragm and external intercostals. Forced inspiration adds neck muscles; forced expiration uses abdominal muscles and internal intercostals.","source":"Her answer · 2024 case-study model-answers deck, slide 12","starred":true},{"id":"q6f24781585","quiz":"case-c4","sys":"resp","mod":"cases","cmod":"m1","type":"essay","pts":3,"q":"What are some of the factors that influence your pulmonary ventilation (make it easier or harder) and how do they do this?","imgs":[],"qh":"<p>What are some of the factors that influence your pulmonary ventilation (make it easier or harder) and how do they do this?<\/p>","qt":"What are some of the factors that influence your pulmonary ventilation (make it easier or harder) and how do they do this?","saq":{"steps":["Airway obstruction by fluid, mucus and/or swelling (COPD, asthma) narrows the airways, raising resistance to airflow and the muscular effort needed to inhale and exhale.","Lung compliance — the ease with which the lungs expand — which scar tissue reduces; thoracic-cage abnormalities (rib-cage flexibility, diaphragm problems); alveolar problems — lack of surfactant so alveoli do not expand, or fluid build-up.","Interference with the negative intrapleural pressure that couples the lungs to the thoracic wall: air in the pleural cavity (pneumothorax) leads to collapse of the lung (atelectasis)."],"src":"Her answer · 2024 case-study model-answers deck, slide 12"},"scenario":"Exam case 4 · Panic attacks — Manaia lives with an anxiety disorder, which sometimes manifests in panic attacks that impact on her breathing. Manaia describes her panic attack as a time when she breathes really really hard and fast and cannot control her breathing at all. You know that there is a link between breathing and the pH of your blood because the respiratory system is one of the buffer systems of the body. You know that during a prolonged panic attack, Manaia might be at risk of what is called respiratory alkalosis, but you’ll need to remember why this is.","hl":"resp-ventilation","caseId":"c4","short":{"id":"c:c4:what are some of","title":"What makes ventilation harder","hook":"BLOCKED airways, STIFF lungs, a LOST pleural seal.","groups":[{"q":"Blocked airways","facts":[{"t":"**Airway obstruction**: fluid, mucus, swelling (**COPD**, **asthma**)","of":[0]},{"t":"raises **resistance** and the muscular effort needed","of":[0]}]},{"q":"Stiff lungs","facts":[{"t":"Less **lung compliance**: **scar tissue**, rib cage or diaphragm problems","of":[1]},{"t":"No **surfactant**, or fluid in the **alveoli**","of":[1]}]},{"q":"The pleural seal","facts":[{"t":"Air in the pleural cavity (**pneumothorax**) collapses the lung (**atelectasis**)","of":[2]}]}]},"note":"Separate three problems: narrow airways resist flow, stiff lungs resist expansion, and loss of the pleural pressure relationship can collapse a lung. Each makes a different part of breathing fail.","source":"Her answer · 2024 case-study model-answers deck, slide 12","starred":true},{"id":"q6dab37e921","quiz":"case-c4","sys":"resp","mod":"cases","cmod":"m1","type":"essay","pts":1,"q":"What is normal blood pH?","imgs":[],"qh":"<p>What is normal blood pH?<\/p>","qt":"What is normal blood pH?","saq":{"steps":["7.35–7.45 (average 7.4). Below 7.35 = acidotic; above 7.45 = alkalotic."],"src":"Her answer · 2024 case-study model-answers deck, slide 13"},"scenario":"Exam case 4 · Panic attacks — Manaia lives with an anxiety disorder, which sometimes manifests in panic attacks that impact on her breathing. Manaia describes her panic attack as a time when she breathes really really hard and fast and cannot control her breathing at all. You know that there is a link between breathing and the pH of your blood because the respiratory system is one of the buffer systems of the body. You know that during a prolonged panic attack, Manaia might be at risk of what is called respiratory alkalosis, but you’ll need to remember why this is.","caseId":"c4","short":{"id":"c:c4:what is normal blood","title":"Normal blood pH","hook":"7.35 to 7.45: below is acid, above is alkaline.","groups":[{"q":"The range","facts":[{"t":"**7.35–7.45** (average **7.4**)","of":[0]},{"t":"Below 7.35 = **acidotic**; above 7.45 = **alkalotic**","of":[0]}]}]},"note":"The normal range is narrow: 7.35–7.45. Increasing hydrogen ions lowers pH. Decreasing hydrogen ions raises pH. Learn the two boundaries as well as the direction.","source":"Her answer · 2024 case-study model-answers deck, slide 13","starred":true},{"id":"q483ab46348","quiz":"case-c4","sys":"resp","mod":"cases","cmod":"m1","type":"essay","pts":1,"q":"Draw the chemical equation (in words or chemical formula) for the bicarbonate buffer system in the blood","imgs":[],"qh":"<p>Draw the chemical equation (in words or chemical formula) for the bicarbonate buffer system in the blood<\/p>","qt":"Draw the chemical equation (in words or chemical formula) for the bicarbonate buffer system in the blood","saq":{"steps":["CO₂ + H₂O ⇌ H₂CO₃ ⇌ H⁺ + HCO₃⁻ — carbon dioxide + water ⇌ carbonic acid ⇌ hydrogen ions + bicarbonate ions."],"src":"Her answer · 2024 case-study model-answers deck, slide 13"},"scenario":"Exam case 4 · Panic attacks — Manaia lives with an anxiety disorder, which sometimes manifests in panic attacks that impact on her breathing. Manaia describes her panic attack as a time when she breathes really really hard and fast and cannot control her breathing at all. You know that there is a link between breathing and the pH of your blood because the respiratory system is one of the buffer systems of the body. You know that during a prolonged panic attack, Manaia might be at risk of what is called respiratory alkalosis, but you’ll need to remember why this is.","hl":"resp-co2-transport","caseId":"c4","short":{"id":"c:c4:draw the chemical equation","title":"The bicarbonate buffer equation","hook":"CO₂ + water ⇌ carbonic acid ⇌ H⁺ + bicarbonate.","groups":[{"q":"The equation","facts":[{"t":"**CO₂ + H₂O ⇌ H₂CO₃ ⇌ H⁺ + HCO₃⁻**","of":[0]},{"t":"**carbon dioxide + water ⇌ carbonic acid ⇌ hydrogen ions + bicarbonate ions**","of":[0]}]}]},"note":"CO₂ and water form carbonic acid, which can dissociate into H⁺ and bicarbonate. Both reactions are reversible. This links breathing to acidity and allows the buffer to respond in either direction.","source":"Her answer · 2024 case-study model-answers deck, slide 13","starred":true},{"id":"q6673b8cccc","quiz":"case-c4","sys":"resp","mod":"cases","cmod":"m1","type":"essay","pts":3,"q":"How do changes in the respiratory rate and depth (like Manaia’s panic attack) affect the blood pH?","imgs":[],"qh":"<p>How do changes in the respiratory rate and depth (like Manaia’s panic attack) affect the blood pH?<\/p>","qt":"How do changes in the respiratory rate and depth (like Manaia’s panic attack) affect the blood pH?","saq":{"steps":["Changing the rate and depth of breathing changes the CO₂ level in the alveoli, and so the CO₂ level in the blood.","Blood CO₂ directly drives the bicarbonate buffer equation, so the same change happens to the H⁺ level — and a change in H⁺ is a change in pH.","Manaia’s hyperventilation blows off CO₂ → the buffer uses up H⁺ and bicarbonate to replace it → H⁺ falls → pH rises: respiratory alkalosis. (Hypoventilation, e.g. head trauma, does the opposite: CO₂ up, H⁺ up, pH down — respiratory acidosis.)"],"src":"Her answer · 2024 case-study model-answers deck, slides 14 and 16"},"scenario":"Exam case 4 · Panic attacks — Manaia lives with an anxiety disorder, which sometimes manifests in panic attacks that impact on her breathing. Manaia describes her panic attack as a time when she breathes really really hard and fast and cannot control her breathing at all. You know that there is a link between breathing and the pH of your blood because the respiratory system is one of the buffer systems of the body. You know that during a prolonged panic attack, Manaia might be at risk of what is called respiratory alkalosis, but you’ll need to remember why this is.","caseId":"c4","short":{"id":"c:c4:how do changes in","title":"Breathing rate and blood pH","hook":"Blow off CO₂ → H⁺ FALLS → pH RISES: alkalosis.","groups":[{"q":"The link","facts":[{"t":"Rate and depth change the **CO₂** in the **alveoli** and the **blood**","of":[0]},{"t":"**Blood CO₂** drives the **bicarbonate buffer**","of":[1]},{"t":"so **H⁺** changes with it, and so does **pH**","of":[1]}]},{"q":"Manaia","facts":[{"t":"**Hyperventilation** blows off CO₂ → **H⁺ falls** → **pH rises**","of":[2]},{"t":"This is **respiratory alkalosis**","of":[2]},{"t":"(**Hypoventilation**: CO₂ up, H⁺ up → **respiratory acidosis**)","of":[2]}]}]},"note":"Hyperventilation removes more CO₂ than the body produces. H⁺ falls and pH rises: respiratory alkalosis. Hypoventilation retains CO₂; H⁺ rises and pH falls. Name what started the disturbance.","source":"Her answer · 2024 case-study model-answers deck, slides 14 and 16","starred":true},{"id":"qa617be9cdf","quiz":"case-c4","sys":"resp","mod":"cases","cmod":"m1","type":"essay","pts":2,"q":"How does the respiratory system respond when something causes the blood pH to change? (This is back to BN1 when you talked about ketoacidosis!)","imgs":[],"qh":"<p>How does the respiratory system respond when something causes the blood pH to change? (This is back to BN1 when you talked about ketoacidosis!)<\/p>","qt":"How does the respiratory system respond when something causes the blood pH to change? (This is back to BN1 when you talked about ketoacidosis!)","saq":{"steps":["Metabolic acidosis (H⁺ up): the body responds with hyperventilation — H⁺ is converted into CO₂ and water and the extra CO₂ is breathed off, so the breathing rate increases.","Metabolic alkalosis (H⁺ down): the body responds with hypoventilation — CO₂ is kept in the body and turned into H⁺ and bicarbonate to replace the lost H⁺, so the breathing rate decreases. The same buffer system works both ways: whatever happens to CO₂ happens to H⁺."],"src":"Her answer · 2024 case-study model-answers deck, slides 14–15"},"scenario":"Exam case 4 · Panic attacks — Manaia lives with an anxiety disorder, which sometimes manifests in panic attacks that impact on her breathing. Manaia describes her panic attack as a time when she breathes really really hard and fast and cannot control her breathing at all. You know that there is a link between breathing and the pH of your blood because the respiratory system is one of the buffer systems of the body. You know that during a prolonged panic attack, Manaia might be at risk of what is called respiratory alkalosis, but you’ll need to remember why this is.","caseId":"c4","short":{"id":"c:c4:how does the respiratory","title":"How breathing corrects blood pH","hook":"Too ACID → breathe FASTER. Too ALKALINE → breathe SLOWER.","groups":[{"q":"Metabolic acidosis","facts":[{"t":"**Metabolic acidosis** (**H⁺ up**): **hyperventilation**","of":[0]},{"t":"H⁺ becomes CO₂ and water; the extra **CO₂** is **breathed off**","of":[0]}]},{"q":"Metabolic alkalosis","facts":[{"t":"**Metabolic alkalosis** (**H⁺ down**): **hypoventilation**","of":[1]},{"t":"CO₂ is **kept** and turned back into H⁺ and bicarbonate","of":[1]}]}]},"note":"Here the initial problem is metabolic. Increased ventilation removes CO₂ and helps reduce H⁺ in metabolic acidosis. Reduced ventilation retains CO₂ and helps raise H⁺ in metabolic alkalosis.","source":"Her answer · 2024 case-study model-answers deck, slides 14–15","starred":true},{"id":"qfff5e616d1","quiz":"case-c4","sys":"resp","mod":"cases","cmod":"m1","type":"essay","pts":6,"q":"Complete the table for metabolic acid/base imbalance: How has blood pH changed? How has H+ levels in the blood changed? How does the bicarbonate buffer system respond? What ultimately happens to CO2 levels in the blood? How does breathing rate change as a result?","imgs":[],"qh":"<p>Complete the table for metabolic acid/base imbalance: How has blood pH changed? How has H+ levels in the blood changed? How does the bicarbonate buffer system respond? What ultimately happens to CO2 levels in the blood? How does breathing rate change as a result?<\/p>","qt":"Complete the table for metabolic acid/base imbalance: How has blood pH changed? How has H+ levels in the blood changed? How does the bicarbonate buffer system respond? What ultimately happens to CO2 levels in the blood? How does breathing rate change as a result?","saq":{"steps":["Acidosis: H⁺ levels in the blood have increased.","The bicarbonate buffer gets rid of H⁺ by converting it into CO₂ and water, so CO₂ levels in the blood increase.","Breathing rate increases (get rid of that CO₂).","Alkalosis: H⁺ levels in the blood have decreased.","The buffer replaces the lost H⁺ by turning CO₂ and water into H⁺ and bicarbonate, so CO₂ levels in the blood decrease.","Breathing rate decreases (keep that CO₂ in your body)."],"src":"Her answer · 2024 case-study model-answers deck (Lym Panic Asth Diab), slide 15 (her filled table, one row per line pair)"},"scenario":"Exam case 4 · Panic attacks — Manaia lives with an anxiety disorder, which sometimes manifests in panic attacks that impact on her breathing. Manaia describes her panic attack as a time when she breathes really really hard and fast and cannot control her breathing at all. You know that there is a link between breathing and the pH of your blood because the respiratory system is one of the buffer systems of the body. You know that during a prolonged panic attack, Manaia might be at risk of what is called respiratory alkalosis, but you’ll need to remember why this is.","caseId":"c4","short":{"id":"c:c4:complete the table for metabolic","title":"Her table: metabolic acid/base","hook":"ACID → the buffer MAKES CO₂ → breathe FASTER. Alkaline → the reverse.","groups":[{"q":"Acidosis","facts":[{"t":"**Acidosis**: **H⁺** has **increased**","of":[0]},{"t":"Buffer **gets rid of H⁺**: **converting** it into **CO₂** and **water**","of":[1]},{"t":"so **CO₂** levels in the blood **increase**","of":[1]},{"t":"**Breathing rate increases**: get rid of that CO₂","of":[2]}]},{"q":"Alkalosis","facts":[{"t":"**Alkalosis**: **H⁺** has **decreased**","of":[3]},{"t":"Buffer **replaces** the lost H⁺: **CO₂** and **water** → H⁺ and **bicarbonate**","of":[4]},{"t":"so **CO₂** levels in the blood **decrease**","of":[4]},{"t":"**Breathing rate decreases**: **keep** that CO₂ in","of":[5]}]}]},"note":"Start with the H⁺ disturbance, then follow the buffer and the breathing response. Acidosis requires removal of H⁺; alkalosis requires replacement of H⁺. Do not swap the initial problem with its compensation.","source":"Her answer · 2024 case-study model-answers deck (Lym Panic Asth Diab), slide 15 (her filled table, one row per line pair)","starred":true},{"id":"q3d809c3215","quiz":"case-c4","sys":"resp","mod":"cases","cmod":"m1","type":"essay","pts":6,"q":"Complete the table for respiratory acid/base imbalance: How has ventilation changed? (Hyper/hypo) How has that changed CO2 levels in the blood? How does the bicarbonate buffer system respond? What ultimately happens to H+ levels in the blood? How does blood pH change as a result?","imgs":[],"qh":"<p>Complete the table for respiratory acid/base imbalance: How has ventilation changed? (Hyper/hypo) How has that changed CO2 levels in the blood? How does the bicarbonate buffer system respond? What ultimately happens to H+ levels in the blood? How does blood pH change as a result?<\/p>","qt":"Complete the table for respiratory acid/base imbalance: How has ventilation changed? (Hyper/hypo) How has that changed CO2 levels in the blood? How does the bicarbonate buffer system respond? What ultimately happens to H+ levels in the blood? How does blood pH change as a result?","saq":{"steps":["Hyperventilation (Manaia): CO₂ levels in the blood decrease.","The bicarbonate buffer tries to replace the lost CO₂ by using up H⁺ and bicarbonate ions, so H⁺ levels decrease.","Blood pH increases: alkalotic / alkalosis.","Hypoventilation (head trauma): CO₂ levels in the blood increase.","The buffer gets rid of the excess CO₂ by combining it with water and converting it into H⁺ and bicarbonate, so H⁺ levels increase.","Blood pH decreases: acidotic / acidosis."],"src":"Her answer · 2024 case-study model-answers deck (Lym Panic Asth Diab), slide 16 (her filled table, one row per line pair)"},"scenario":"Exam case 4 · Panic attacks — Manaia lives with an anxiety disorder, which sometimes manifests in panic attacks that impact on her breathing. Manaia describes her panic attack as a time when she breathes really really hard and fast and cannot control her breathing at all. You know that there is a link between breathing and the pH of your blood because the respiratory system is one of the buffer systems of the body. You know that during a prolonged panic attack, Manaia might be at risk of what is called respiratory alkalosis, but you’ll need to remember why this is.","caseId":"c4","short":{"id":"c:c4:complete the table for respiratory","title":"Her table: respiratory acid/base","hook":"Breathing sets CO₂; H⁺ FOLLOWS CO₂; pH goes the OTHER way.","groups":[{"q":"Hyperventilation (Manaia)","facts":[{"t":"**Hyperventilation** (Manaia): **CO₂** levels **decrease**","of":[0]},{"t":"Buffer tries to **replace** the lost CO₂, **using up H⁺** and **bicarbonate**","of":[1]},{"t":"so **H⁺** levels **decrease**","of":[1]},{"t":"Blood **pH increases**: **alkalosis**","of":[2]}]},{"q":"Hypoventilation (head trauma)","facts":[{"t":"**Hypoventilation** (head trauma): **CO₂** levels **increase**","of":[3]},{"t":"Buffer gets rid of excess CO₂: **combining** it with **water**","of":[4]},{"t":"→ **H⁺** and **bicarbonate**, so **H⁺** levels **increase**","of":[4]},{"t":"Blood **pH decreases**: **acidosis**","of":[5]}]}]},"note":"Start with ventilation. Too much removes CO₂; too little retains it. H⁺ follows CO₂ while pH changes in the opposite direction. Fill each table row from that relationship.","source":"Her answer · 2024 case-study model-answers deck (Lym Panic Asth Diab), slide 16 (her filled table, one row per line pair)","starred":true},{"id":"q7c2ef5ce3b","quiz":"case-c6","sys":"endo","mod":"cases","cmod":"m2","type":"essay","pts":2,"q":"Where in the body, SPECIFICALLY, is insulin made?","imgs":[],"qh":"<p>Where in the body, SPECIFICALLY, is insulin made?<\/p>","qt":"Where in the body, SPECIFICALLY, is insulin made?","saq":{"steps":["The endocrine pancreas — in the islets of Langerhans.","Beta cells in the islets make INSULIN, which decreases blood sugar levels (after a meal it stimulates the body to store excess glucose). Alpha cells make glucagon — both have A’s."],"src":"Her answer · 2024 case-study model-answers deck (Lym Panic Asth Diab), slide 24"},"scenario":"Exam case 6 · Diabetes — Larry has been recently diagnosed with Type 2 diabetes mellitus, an endocrine disorder, after what appears to be many years of uncontrolled hyperglycaemia. He must measure his blood sugar every as he works with his diabetes nurse to bring it under control, and he will also need to have insulin injections and other medications to help his blood glucose regulation. Larry is a little overwhelmed, and isn’t sure of what this insulin is for. As his nurse, you need a robust understanding of what insulin does in the body. Diabetes mellitus is a disease that involves the dysfunction of insulin and glucose regulation. There are two types, type 1 where the body fails to make insulin, and type 2 where the body is unable to respond to insulin when it is secreted.","caseId":"c6","short":{"id":"c:c6:where in the body","title":"Where insulin is made","hook":"Pancreas → islets → BETA cells make insulin (glucAgon = Alpha).","groups":[{"q":"Where","facts":[{"t":"The **endocrine pancreas**","of":[0]},{"t":"in the **islets of Langerhans**","of":[0]}]},{"q":"Which cells","facts":[{"t":"**Beta cells** make **insulin**, which **decreases blood sugar**","of":[1]},{"t":"(**Alpha cells** make **glucagon**)","of":[1]}]}]},"note":"“Pancreas” alone is incomplete. Zoom in: pancreas → pancreatic islets (islets of Langerhans) → beta cells. Contrast beta-cell insulin with alpha-cell glucagon.","source":"Her answer · 2024 case-study model-answers deck (Lym Panic Asth Diab), slide 24","starred":true},{"id":"qcb61f37c64","quiz":"case-c6","sys":"endo","mod":"cases","cmod":"m2","type":"essay","pts":3,"q":"What hormone (or hormones!) acts in opposition to insulin, and where is it/they made?","imgs":[],"qh":"<p>What hormone (or hormones!) acts in opposition to insulin, and where is it/they made?<\/p>","qt":"What hormone (or hormones!) acts in opposition to insulin, and where is it/they made?","saq":{"steps":["Glucagon — the pancreatic hormone (alpha cells) that increases blood glucose levels.","Adrenaline/epinephrine (adrenal medulla) and cortisol (adrenal cortex) — both mediate the stress response (fight or flight, long-term stress), when the body needs ready access to glucose.","Growth hormone (anterior pituitary) and thyroid hormones — associated with metabolism; changes in them can increase blood sugar."],"src":"Her answer · 2024 case-study model-answers deck (Lym Panic Asth Diab), slide 25"},"scenario":"Exam case 6 · Diabetes — Larry has been recently diagnosed with Type 2 diabetes mellitus, an endocrine disorder, after what appears to be many years of uncontrolled hyperglycaemia. He must measure his blood sugar every as he works with his diabetes nurse to bring it under control, and he will also need to have insulin injections and other medications to help his blood glucose regulation. Larry is a little overwhelmed, and isn’t sure of what this insulin is for. As his nurse, you need a robust understanding of what insulin does in the body. Diabetes mellitus is a disease that involves the dysfunction of insulin and glucose regulation. There are two types, type 1 where the body fails to make insulin, and type 2 where the body is unable to respond to insulin when it is secreted.","caseId":"c6","short":{"id":"c:c6:what hormone or hormones","title":"Hormones that raise blood sugar","hook":"GLUCAGON, the stress pair (ADRENALINE, CORTISOL), then GROWTH and THYROID.","groups":[{"q":"The hormones and where they are made","facts":[{"t":"**Glucagon**: the pancreas **alpha cells**","of":[0]},{"t":"**Adrenaline** (**adrenal medulla**) and **cortisol** (**adrenal cortex**)","of":[1]},{"t":"both mediate the **stress response**, which needs ready glucose","of":[1]},{"t":"**Growth hormone** (**anterior pituitary**) and **thyroid hormones**","of":[2]}]}]},"note":"These hormones oppose a fall in available blood glucose. Pair each hormone with its source; do not learn two unrelated lists.","source":"Her answer · 2024 case-study model-answers deck (Lym Panic Asth Diab), slide 25","starred":true},{"id":"qf5747c02f3","quiz":"case-c6","sys":"endo","mod":"cases","cmod":"m2","type":"essay","pts":4,"q":"Explain what insulin does at a cellular level (you’ll need to think about how it travels in the body, what it binds to, and what happens).","imgs":[],"qh":"<p>Explain what insulin does at a cellular level (you’ll need to think about how it travels in the body, what it binds to, and what happens).<\/p>","qt":"Explain what insulin does at a cellular level (you’ll need to think about how it travels in the body, what it binds to, and what happens).","saq":{"steps":["Insulin travels through the body in the blood.","It binds to insulin receptors on the surface of insulin-sensitive cells.","Once bound, a cascade of events inside the cell moves the GLUT4 transporter from inside the cell into the cell membrane.","In the membrane GLUT4 is a transport protein that lets glucose move into the cell, down its concentration gradient, by facilitated diffusion."],"src":"Her answer · 2024 case-study model-answers deck (Lym Panic Asth Diab), slides 28–29"},"scenario":"Exam case 6 · Diabetes — Larry has been recently diagnosed with Type 2 diabetes mellitus, an endocrine disorder, after what appears to be many years of uncontrolled hyperglycaemia. He must measure his blood sugar every as he works with his diabetes nurse to bring it under control, and he will also need to have insulin injections and other medications to help his blood glucose regulation. Larry is a little overwhelmed, and isn’t sure of what this insulin is for. As his nurse, you need a robust understanding of what insulin does in the body. Diabetes mellitus is a disease that involves the dysfunction of insulin and glucose regulation. There are two types, type 1 where the body fails to make insulin, and type 2 where the body is unable to respond to insulin when it is secreted.","caseId":"c6","short":{"id":"c:c6:explain what insulin does","title":"What insulin does at a cell","hook":"TRAVEL, BIND, MOVE GLUT4, LET GLUCOSE IN.","groups":[{"q":"The steps","facts":[{"t":"Insulin travels in the **blood**","of":[0]},{"t":"It binds to **insulin receptors** on the cell surface","of":[1]},{"t":"A cascade moves **GLUT4** into the **cell membrane**","of":[2]},{"t":"GLUT4 lets **glucose** in, down its **concentration gradient**","of":[3]},{"t":"by **facilitated diffusion**","of":[3]}]}]},"note":"Insulin binds a membrane receptor. Intracellular signalling causes GLUT4 transporters to be inserted into the membrane of muscle and fat cells. Glucose then enters by facilitated diffusion down its concentration gradient.","source":"Her answer · 2024 case-study model-answers deck (Lym Panic Asth Diab), slides 28–29","starred":true},{"id":"q59b26e3655","quiz":"case-c6","sys":"endo","mod":"cases","cmod":"m2","type":"essay","pts":1,"q":"Insulin’s role in the liver is:","imgs":[],"qh":"<p>Insulin’s role in the liver is:<\/p>","qt":"Insulin’s role in the liver is:","saq":{"steps":["To stimulate the conversion of glucose to glycogen (the storage form of glucose) via glycogenesis — enzymes join the glucose molecules together into the larger glycogen polysaccharide."],"src":"Her answer · 2024 case-study model-answers deck (Lym Panic Asth Diab), slide 31"},"scenario":"Exam case 6 · Diabetes — Larry has been recently diagnosed with Type 2 diabetes mellitus, an endocrine disorder, after what appears to be many years of uncontrolled hyperglycaemia. He must measure his blood sugar every as he works with his diabetes nurse to bring it under control, and he will also need to have insulin injections and other medications to help his blood glucose regulation. Larry is a little overwhelmed, and isn’t sure of what this insulin is for. As his nurse, you need a robust understanding of what insulin does in the body. Diabetes mellitus is a disease that involves the dysfunction of insulin and glucose regulation. There are two types, type 1 where the body fails to make insulin, and type 2 where the body is unable to respond to insulin when it is secreted.","caseId":"c6","short":{"id":"c:c6:insulin s role in the liver","title":"Insulin in the liver","hook":"Liver and muscle STORE glucose as GLYCOGEN.","groups":[{"q":"Its role","facts":[{"t":"**Glucose** → **glycogen**, by **glycogenesis**","of":[0]}]}]},"note":"Insulin promotes storage of glucose as glycogen. That removes glucose from the circulating pool and stores it for later.","source":"Her answer · 2024 case-study model-answers deck (Lym Panic Asth Diab), slide 31","starred":true},{"id":"q3f9f8bc08e","quiz":"case-c6","sys":"endo","mod":"cases","cmod":"m2","type":"essay","pts":1,"q":"Insulin’s role in the muscles is:","imgs":[],"qh":"<p>Insulin’s role in the muscles is:<\/p>","qt":"Insulin’s role in the muscles is:","saq":{"steps":["To stimulate the conversion of glucose to glycogen (the storage form of glucose) via glycogenesis."],"src":"Her answer · 2024 case-study model-answers deck (Lym Panic Asth Diab), slide 31"},"scenario":"Exam case 6 · Diabetes — Larry has been recently diagnosed with Type 2 diabetes mellitus, an endocrine disorder, after what appears to be many years of uncontrolled hyperglycaemia. He must measure his blood sugar every as he works with his diabetes nurse to bring it under control, and he will also need to have insulin injections and other medications to help his blood glucose regulation. Larry is a little overwhelmed, and isn’t sure of what this insulin is for. As his nurse, you need a robust understanding of what insulin does in the body. Diabetes mellitus is a disease that involves the dysfunction of insulin and glucose regulation. There are two types, type 1 where the body fails to make insulin, and type 2 where the body is unable to respond to insulin when it is secreted.","caseId":"c6","short":{"id":"c:c6:insulin s role in the muscles","title":"Insulin in the muscles","hook":"Same as the liver: glucose into GLYCOGEN.","groups":[{"q":"Its role","facts":[{"t":"**Glucose** → **glycogen**, by **glycogenesis**","of":[0]}]}]},"note":"Insulin helps muscle take up glucose and store it as glycogen. The glycogen is a local fuel reserve for muscle activity.","source":"Her answer · 2024 case-study model-answers deck (Lym Panic Asth Diab), slide 31","starred":true},{"id":"qcc94a0c925","quiz":"case-c6","sys":"endo","mod":"cases","cmod":"m2","type":"essay","pts":1,"q":"Insulin’s role in the fat tissue is:","imgs":[],"qh":"<p>Insulin’s role in the fat tissue is:<\/p>","qt":"Insulin’s role in the fat tissue is:","saq":{"steps":["To stimulate the conversion of glucose to fats (the most efficient storage form — more energy in a smaller space) via lipogenesis."],"src":"Her answer · 2024 case-study model-answers deck (Lym Panic Asth Diab), slide 31"},"scenario":"Exam case 6 · Diabetes — Larry has been recently diagnosed with Type 2 diabetes mellitus, an endocrine disorder, after what appears to be many years of uncontrolled hyperglycaemia. He must measure his blood sugar every as he works with his diabetes nurse to bring it under control, and he will also need to have insulin injections and other medications to help his blood glucose regulation. Larry is a little overwhelmed, and isn’t sure of what this insulin is for. As his nurse, you need a robust understanding of what insulin does in the body. Diabetes mellitus is a disease that involves the dysfunction of insulin and glucose regulation. There are two types, type 1 where the body fails to make insulin, and type 2 where the body is unable to respond to insulin when it is secreted.","caseId":"c6","short":{"id":"c:c6:insulin s role in the fat","title":"Insulin in fat tissue","hook":"Fat tissue turns glucose into FAT: LIPOgenesis.","groups":[{"q":"Its role","facts":[{"t":"**Glucose** → **fats**, by **lipogenesis**","of":[0]},{"t":"the most **efficient storage form**","of":[0]}]}]},"note":"Insulin promotes glucose uptake and fat storage. Connect the supply of fuel to storing surplus energy.","source":"Her answer · 2024 case-study model-answers deck (Lym Panic Asth Diab), slide 31","starred":true},{"id":"q3873615069","quiz":"case-c8","sys":"ms","mod":"cases","cmod":"m2","type":"essay","pts":9,"q":"Arthritis is a condition that affects the joints of the body. What are the structures of the joint? Use the diagram and name the lettered structures, with the function of each.","imgs":["wb26-joint.png"],"qh":"<p>Arthritis is a condition that affects the joints of the body. What are the structures of the joint? Use the diagram and name the lettered structures, with the function of each.<\/p>","qt":"Arthritis is a condition that affects the joints of the body. What are the structures of the joint? Use the diagram and name the lettered structures, with the function of each.","saq":{"steps":["A (top left) — muscle: contracts and acts on the bones, making the angle between them smaller or larger.","A (top right and bottom) — enthesis: where the ligaments attach.","B — synovial fluid: lubricates the joint.","C — bursa: reduces friction (a lubricated, fluid-filled sac between bone and soft tissue).","D — joint capsule: holds the bones together.","E — tendon: joins muscle to bone.","F — bone: acts as a lever and articulates at joints.","G — hyaline cartilage: reduces friction and absorbs shock.","H — ligament: holds bones together."],"src":"Her answer · 2024 case-study model-answers deck (joints, inflammation), slide 3 — her answer letters the muscle I; this workbook figure letters it A (top left), so the answer follows the workbook"},"scenario":"Exam case 8 · Joints and arthritis — Shannon is a 30-year-old woman that has had a series of issues with her joints. She has had bursitis in her hip in the past, and is now has presented mainly with pain in her knee and hip joints, as well as her hands. After consultation, she has recently been diagnosed with rheumatoid arthritis. She is concerned, as she feels she is too young to have arthritis, even though she is fairly active and has been an athlete most of her life. Part of the treatment plan that manage the joint includes the use of prednisone. Prednisone is a synthetic corticosteroid, similar to cortisol. Cortisol is part of the body’s long term stress response.","caseId":"c8","short":{"id":"c:c8:arthritis is a condition","title":"The joint, A to H","hook":"Muscle, enthesis, fluid, bursa, capsule, tendon, bone, cartilage, ligament.","groups":[{"q":"Each letter: structure and function","facts":[{"t":"A: **muscle**, **contracts** to move the bones","of":[0]},{"t":"A (the other two): **enthesis**, where the **ligaments attach**","of":[1]},{"t":"B: **synovial fluid**, **lubricates** the joint","of":[2]},{"t":"C: **bursa**, **reduces friction**","of":[3]},{"t":"D: **joint capsule**, **holds the bones together**","of":[4]},{"t":"E: **tendon**, **joins muscle to bone**","of":[5]},{"t":"F: **bone**, a **lever** that **articulates** at joints","of":[6]},{"t":"G: **hyaline cartilage**, **reduces friction** and **absorbs shock**","of":[7]},{"t":"H: **ligament**, **holds bones together**","of":[8]}]}]},"note":"Use the lettered picture. Cartilage reduces friction, synovial fluid lubricates, the membrane produces fluid, and the capsule and ligaments support the joint. Learn each structure with its function.","source":"Her answer · 2024 case-study model-answers deck (joints, inflammation), slide 3 — her answer letters the muscle I; this workbook figure letters it A (top left), so the answer follows the workbook","starred":true},{"id":"q14e46cfb34","quiz":"case-c8","sys":"ms","mod":"cases","cmod":"m2","type":"essay","pts":4,"q":"What occurs in rheumatoid arthritis?","imgs":[],"qh":"<p>What occurs in rheumatoid arthritis?<\/p>","qt":"What occurs in rheumatoid arthritis?","saq":{"steps":["It is autoimmune: the immune system attacks the joints.","Onset is relatively rapid, over weeks to months, and it may begin at any time in life.","Joints are painful, swollen and stiff — often small and large joints on BOTH sides of the body (both hands, wrists, elbows, balls of the feet); morning stiffness lasts longer than 1 hour.","Whole-body (systemic) symptoms: frequent fatigue and a general feeling of being ill."],"src":"Her answer · 2024 case-study model-answers deck (joints, inflammation), slide 10 (her rheumatoid vs osteoarthritis table)"},"scenario":"Exam case 8 · Joints and arthritis — Shannon is a 30-year-old woman that has had a series of issues with her joints. She has had bursitis in her hip in the past, and is now has presented mainly with pain in her knee and hip joints, as well as her hands. After consultation, she has recently been diagnosed with rheumatoid arthritis. She is concerned, as she feels she is too young to have arthritis, even though she is fairly active and has been an athlete most of her life. Part of the treatment plan that manage the joint includes the use of prednisone. Prednisone is a synthetic corticosteroid, similar to cortisol. Cortisol is part of the body’s long term stress response.","caseId":"c8","short":{"id":"c:c8:what occurs in rheumatoid","title":"Rheumatoid arthritis","hook":"AUTOIMMUNE, FAST, BOTH SIDES, WHOLE BODY.","groups":[{"q":"What occurs","facts":[{"t":"**Autoimmune**: the **immune system attacks the joints**","of":[0]},{"t":"Onset is **relatively rapid**, over **weeks to months**, at any age","of":[1]},{"t":"Joints **painful, swollen and stiff**, on **both sides** of the body","of":[2]},{"t":"**Morning stiffness** longer than **1 hour**","of":[2]},{"t":"**Whole-body** symptoms: **fatigue**, feeling ill","of":[3]}]}]},"note":"An autoimmune inflammatory process targets the joint, particularly its synovium. Continued inflammation damages joint structures. Connect the immune cause, inflammation and resulting pain or loss of function.","source":"Her answer · 2024 case-study model-answers deck (joints, inflammation), slide 10 (her rheumatoid vs osteoarthritis table)","starred":true},{"id":"q05841f0fb9","quiz":"case-c8","sys":"ms","mod":"cases","cmod":"m2","type":"essay","pts":1,"q":"What is the other type of arthritis called?","imgs":[],"qh":"<p>What is the other type of arthritis called?<\/p>","qt":"What is the other type of arthritis called?","saq":{"steps":["Osteoarthritis."],"src":"Her answer · 2024 case-study model-answers deck (joints, inflammation), slide 10"},"scenario":"Exam case 8 · Joints and arthritis — Shannon is a 30-year-old woman that has had a series of issues with her joints. She has had bursitis in her hip in the past, and is now has presented mainly with pain in her knee and hip joints, as well as her hands. After consultation, she has recently been diagnosed with rheumatoid arthritis. She is concerned, as she feels she is too young to have arthritis, even though she is fairly active and has been an athlete most of her life. Part of the treatment plan that manage the joint includes the use of prednisone. Prednisone is a synthetic corticosteroid, similar to cortisol. Cortisol is part of the body’s long term stress response.","caseId":"c8","short":{"id":"c:c8:what is the other","title":"The other arthritis","hook":"OSTEO-arthritis: the wear-and-tear one.","groups":[{"q":"Its name","facts":[{"t":"**Osteoarthritis**","of":[0]}]}]},"note":"Osteoarthritis is the degenerative joint condition contrasted with rheumatoid arthritis. Keep the degenerative and autoimmune causes distinct.","source":"Her answer · 2024 case-study model-answers deck (joints, inflammation), slide 10","starred":true},{"id":"qf845b6ee38","quiz":"case-c8","sys":"ms","mod":"cases","cmod":"m2","type":"essay","pts":4,"q":"What is the difference between the above and rheumatoid arthritis?","imgs":[],"qh":"<p>What is the difference between the above and rheumatoid arthritis?<\/p>","qt":"What is the difference between the above and rheumatoid arthritis?","saq":{"steps":["Cause: rheumatoid is autoimmune; osteoarthritis is wear and tear.","Onset: rheumatoid may begin any time in life and comes on over weeks to months; osteoarthritis usually begins later in life, slowly over years.","Joints: rheumatoid — painful, swollen, stiff, symmetrical, small and large joints, morning stiffness over 1 hour; osteoarthritis — ache and tenderness with little or no swelling, usually one set of joints (fingers, thumbs, hips, knees, spine), morning stiffness under 1 hour.","Rheumatoid has whole-body symptoms (fatigue, feeling ill); osteoarthritis does not."],"src":"Her answer · 2024 case-study model-answers deck (joints, inflammation), slide 10"},"scenario":"Exam case 8 · Joints and arthritis — Shannon is a 30-year-old woman that has had a series of issues with her joints. She has had bursitis in her hip in the past, and is now has presented mainly with pain in her knee and hip joints, as well as her hands. After consultation, she has recently been diagnosed with rheumatoid arthritis. She is concerned, as she feels she is too young to have arthritis, even though she is fairly active and has been an athlete most of her life. Part of the treatment plan that manage the joint includes the use of prednisone. Prednisone is a synthetic corticosteroid, similar to cortisol. Cortisol is part of th
