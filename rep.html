e body’s long term stress response.","caseId":"c8","short":{"id":"c:c8:what is the difference","title":"Osteoarthritis vs rheumatoid","hook":"Cause, onset, joints, whole body: rheumatoid is immune, fast, both sides, systemic.","groups":[{"q":"Cause","facts":[{"t":"Rheumatoid: **autoimmune**; osteo: **wear and tear**","of":[0]}]},{"q":"Onset","facts":[{"t":"Rheumatoid: any age, **weeks to months**; osteo: **later in life**, **over years**","of":[1]}]},{"q":"Joints","facts":[{"t":"Rheumatoid: **swollen**, **symmetrical**, stiffness **over 1 hour**","of":[2]},{"t":"Osteo: **ache**, little swelling, **one set of joints**, **under 1 hour**","of":[2]}]},{"q":"Whole body","facts":[{"t":"Rheumatoid has **whole body symptoms**; osteo does not","of":[3]}]}]},"note":"Compare the same feature on both sides: cause, onset, joint distribution and whole-body effects. A paired contrast is easier to retrieve than two separate descriptions.","source":"Her answer · 2024 case-study model-answers deck (joints, inflammation), slide 10","starred":true},{"id":"q8a654cb90d","quiz":"case-c8","sys":"ms","mod":"cases","cmod":"m2","type":"essay","pts":2,"q":"Where is cortisol produced and secreted from the body?","imgs":[],"qh":"<p>Where is cortisol produced and secreted from the body?<\/p>","qt":"Where is cortisol produced and secreted from the body?","saq":{"steps":["In the adrenal glands — paired, pyramid-shaped organs on top of the kidneys.","In the adrenal CORTEX (the outer, glandular part): cortisol is its major glucocorticoid; its release is stimulated by ACTH from the anterior pituitary."],"src":"Her answer · 2024 case-study model-answers deck (joints, inflammation), slides 5–6"},"scenario":"Exam case 8 · Joints and arthritis — Shannon is a 30-year-old woman that has had a series of issues with her joints. She has had bursitis in her hip in the past, and is now has presented mainly with pain in her knee and hip joints, as well as her hands. After consultation, she has recently been diagnosed with rheumatoid arthritis. She is concerned, as she feels she is too young to have arthritis, even though she is fairly active and has been an athlete most of her life. Part of the treatment plan that manage the joint includes the use of prednisone. Prednisone is a synthetic corticosteroid, similar to cortisol. Cortisol is part of the body’s long term stress response.","caseId":"c8","short":{"id":"c:c8:where is cortisol produced","title":"Where cortisol comes from","hook":"Adrenal CORTEX, on the kidney, told by ACTH.","groups":[{"q":"Where","facts":[{"t":"The **adrenal glands**, on top of the **kidneys**","of":[0]},{"t":"in the **adrenal cortex** (the outer part)","of":[1]}]},{"q":"What releases it","facts":[{"t":"**ACTH** from the **anterior pituitary**","of":[1]}]}]},"note":"Follow the hormonal chain: hypothalamus → anterior pituitary → adrenal cortex. ACTH stimulates the cortex to release cortisol; do not confuse the cortex with the adrenaline-producing medulla.","source":"Her answer · 2024 case-study model-answers deck (joints, inflammation), slides 5–6","starred":true},{"id":"q0fbf219f0f","quiz":"case-c8","sys":"ms","mod":"cases","cmod":"m2","type":"essay","pts":4,"q":"What are the functions of cortisol and how is this related to the stress response?","imgs":[],"qh":"<p>What are the functions of cortisol and how is this related to the stress response?<\/p>","qt":"What are the functions of cortisol and how is this related to the stress response?","saq":{"steps":["Increases blood glucose — forms glucose from non-carbohydrate sources (gluconeogenesis) — and increases blood fatty acids and amino acids.","Prepares the body to resist chronic (long-term) stress by keeping blood sugar levels relatively constant and maintaining blood volume.","Maintaining blood volume maintains tissue perfusion, so oxygen and nutrients are available to deal with the stress.","Reduces inflammation (less swelling, redness and pain) and suppresses the immune system."],"src":"Her answer · 2024 case-study model-answers deck (joints, inflammation), slides 6 and 11"},"scenario":"Exam case 8 · Joints and arthritis — Shannon is a 30-year-old woman that has had a series of issues with her joints. She has had bursitis in her hip in the past, and is now has presented mainly with pain in her knee and hip joints, as well as her hands. After consultation, she has recently been diagnosed with rheumatoid arthritis. She is concerned, as she feels she is too young to have arthritis, even though she is fairly active and has been an athlete most of her life. Part of the treatment plan that manage the joint includes the use of prednisone. Prednisone is a synthetic corticosteroid, similar to cortisol. Cortisol is part of the body’s long term stress response.","caseId":"c8","short":{"id":"c:c8:what are the functions","title":"Cortisol and the stress response","hook":"More SUGAR, steady BLOOD VOLUME, LESS inflammation.","groups":[{"q":"What it does","facts":[{"t":"**Increases blood glucose** by **gluconeogenesis**","of":[0]},{"t":"and raises blood **fatty acids** and **amino acids**","of":[0]},{"t":"Reduces **inflammation** and **suppresses the immune system**","of":[3]}]},{"q":"How that helps with stress","facts":[{"t":"Helps resist **chronic** (long-term) **stress**: steady **blood sugar**","of":[1]},{"t":"Keeps up **blood volume**, so **tissue perfusion** continues","of":[2]}]}]},"note":"Cortisol helps make fuel available during stress by changing metabolism. It also suppresses inflammatory and immune responses. Connect each named action to why fuel becomes available.","source":"Her answer · 2024 case-study model-answers deck (joints, inflammation), slides 6 and 11","starred":true},{"id":"qcd2b5c7c3f","quiz":"case-c8","sys":"ms","mod":"cases","cmod":"m2","type":"essay","pts":2,"q":"How is cortisol going to aid in Shannon’s rheumatoid arthritis?","imgs":[],"qh":"<p>How is cortisol going to aid in Shannon’s rheumatoid arthritis?<\/p>","qt":"How is cortisol going to aid in Shannon’s rheumatoid arthritis?","saq":{"steps":["It reduces inflammation: less swelling, redness and pain in her joints.","It suppresses the immune system: rheumatoid arthritis is an autoimmune condition, an overactive immune system."],"src":"Her answer · 2024 case-study model-answers deck (joints, inflammation), slide 11"},"scenario":"Exam case 8 · Joints and arthritis — Shannon is a 30-year-old woman that has had a series of issues with her joints. She has had bursitis in her hip in the past, and is now has presented mainly with pain in her knee and hip joints, as well as her hands. After consultation, she has recently been diagnosed with rheumatoid arthritis. She is concerned, as she feels she is too young to have arthritis, even though she is fairly active and has been an athlete most of her life. Part of the treatment plan that manage the joint includes the use of prednisone. Prednisone is a synthetic corticosteroid, similar to cortisol. Cortisol is part of the body’s long term stress response.","caseId":"c8","short":{"id":"c:c8:how is cortisol going","title":"Cortisol for Shannon's arthritis","hook":"Calms the SWELLING, calms the IMMUNE attack.","groups":[{"q":"How it helps","facts":[{"t":"**Reduces inflammation**: less **swelling**, **redness** and **pain**","of":[0]},{"t":"**Suppresses the immune system**: RA is **autoimmune**","of":[1]}]}]},"note":"Suppressing inflammatory activity reduces the inflammatory component of the arthritis. This explains the benefit without implying that the underlying disease is cured.","source":"Her answer · 2024 case-study model-answers deck (joints, inflammation), slide 11","starred":true},{"id":"q9950502a7a","quiz":"case-c9","sys":"ns","mod":"cases","cmod":"m2","type":"essay","pts":2,"q":"What is a neurotransmitter? Where is the neurotransmitter Dopamine normally made in the central nervous system?","imgs":[],"qh":"<p>What is a neurotransmitter? Where is the neurotransmitter Dopamine normally made in the central nervous system?<\/p>","qt":"What is a neurotransmitter? Where is the neurotransmitter Dopamine normally made in the central nervous system?","saq":{"steps":["A neurotransmitter is a chemical substance released at the presynaptic endings of a chemical synapse, which then acts on the receptor region of the postsynaptic neuron.","Dopamine is made in the substantia nigra of the midbrain (brain stem)."],"src":"Her words · her 2026 NS1 deck, slide 13 (chemical synapses) and her LEARNING PAGE NS2 (brain stem)"},"scenario":"Exam case 9 · Neurotransmitters and the brain — Mr Paraone has been admitted to hospital after a fall and has reported they are having issues with mobility and tremors. Mr Paraone is later diagnosed with Parkinson’s disease. This is a brain disease where cells that normally make Dopamine, a neurotransmitter, start to die. One of the treatments to help control their symptoms is called Levodopa, which travels through the blood and into the brain to help to boost the brain’s Dopamine levels, so the neurons can continue to communicate properly via their synapses.","caseId":"c9","short":{"id":"c:c9:what is a neurotransmitter","title":"Neurotransmitters and dopamine","hook":"A chemical across the synapse; dopamine from the SUBSTANTIA NIGRA.","groups":[{"q":"What a neurotransmitter is","facts":[{"t":"A **chemical** released at the **presynaptic** endings of a **chemical synapse**","of":[0]},{"t":"It acts on the **receptor** region of the **postsynaptic neuron**","of":[0]}]},{"q":"Where dopamine is made","facts":[{"t":"**Dopamine**: the **substantia nigra** of the **midbrain**","of":[1]}]}]},"note":"A neurotransmitter carries a chemical signal between cells at a synapse. For this case, link dopamine to the substantia nigra and movement control.","source":"Her words · her 2026 NS1 deck, slide 13 (chemical synapses) and her LEARNING PAGE NS2 (brain stem)","starred":true},{"id":"q48b9b61889","quiz":"case-c9","sys":"ns","mod":"cases","cmod":"m2","type":"essay","pts":2,"q":"Explain the role of Calcium ions (Ca2+) in synaptic transmission.","imgs":[],"qh":"<p>Explain the role of Calcium ions (Ca2+) in synaptic transmission.<\/p>","qt":"Explain the role of Calcium ions (Ca2+) in synaptic transmission.","saq":{"steps":["When the action potential (electrical nerve impulse) reaches the axon terminal of the presynaptic neuron, Ca2+ channels open and Ca2+ enters the presynaptic neuron.","The Ca2+ helps the neurotransmitter vesicles open, releasing the neurotransmitter into the synaptic cleft by exocytosis."],"src":"Her answer · 2024 NS case-study answers deck, slide 4"},"scenario":"Exam case 9 · Neurotransmitters and the brain — Mr Paraone has been admitted to hospital after a fall and has reported they are having issues with mobility and tremors. Mr Paraone is later diagnosed with Parkinson’s disease. This is a brain disease where cells that normally make Dopamine, a neurotransmitter, start to die. One of the treatments to help control their symptoms is called Levodopa, which travels through the blood and into the brain to help to boost the brain’s Dopamine levels, so the neurons can continue to communicate properly via their synapses.","caseId":"c9","short":{"id":"c:c9:explain the role of","title":"Calcium at the synapse","hook":"Impulse ARRIVES → Ca²⁺ IN → vesicles RELEASE.","groups":[{"q":"Calcium's role","facts":[{"t":"The **action potential** reaches the **axon terminal**","of":[0]},{"t":"**Ca2+ channels open**; Ca2+ enters the **presynaptic neuron**","of":[0]},{"t":"Ca2+ opens the **vesicles**: neurotransmitter out by **exocytosis**","of":[1]}]}]},"note":"The arriving action potential opens calcium channels. Calcium enters the terminal and triggers vesicle fusion and transmitter release. Calcium is the link between the electrical arrival and chemical release.","source":"Her answer · 2024 NS case-study answers deck, slide 4","starred":true},{"id":"qee46bc01d7","quiz":"case-c9","sys":"ns","mod":"cases","cmod":"m2","type":"essay","pts":6,"q":"Explain the process of synaptic transmission that allows neurotransmitters to be released. Use the diagram to help you in your explanation.","imgs":["wb26-synapse.png"],"qh":"<p>Explain the process of synaptic transmission that allows neurotransmitters to be released. Use the diagram to help you in your explanation.<\/p>","qt":"Explain the process of synaptic transmission that allows neurotransmitters to be released. Use the diagram to help you in your explanation.","saq":{"steps":["The action potential (electrical impulse) reaches the axon terminal of the presynaptic neuron and stimulates the entry of Ca2+ (Ca2+ channels open) into the presynaptic neuron.","Ca2+ helps the neurotransmitter vesicles open, releasing the neurotransmitter into the synaptic cleft by exocytosis.","The neurotransmitter diffuses across the synaptic cleft.","The neurotransmitter binds to receptors on the postsynaptic neuron.","The postsynaptic membrane’s permeability changes, causing either an excitatory or an inhibitory effect.","Re-uptake or enzymatic destruction of the neurotransmitter."],"src":"Her answer · 2024 NS case-study answers deck, slides 3–5"},"scenario":"Exam case 9 · Neurotransmitters and the brain — Mr Paraone has been admitted to hospital after a fall and has reported they are having issues with mobility and tremors. Mr Paraone is later diagnosed with Parkinson’s disease. This is a brain disease where cells that normally make Dopamine, a neurotransmitter, start to die. One of the treatments to help control their symptoms is called Levodopa, which travels through the blood and into the brain to help to boost the brain’s Dopamine levels, so the neurons can continue to communicate properly via their synapses.","caseId":"c9","short":{"id":"c:c9:explain the process of","title":"Synaptic transmission","hook":"ARRIVE, CALCIUM, RELEASE, CROSS, BIND, RESPOND, CLEAR.","groups":[{"q":"The steps","facts":[{"t":"The **action potential** reaches the **axon terminal**","of":[0]},{"t":"**Ca2+** enters the **presynaptic neuron**","of":[0]},{"t":"Vesicles release it into the **synaptic cleft** (**exocytosis**)","of":[1]},{"t":"It **diffuses across the synaptic cleft**","of":[2]},{"t":"It **binds to receptors** on the **postsynaptic neuron**","of":[3]},{"t":"**Permeability** changes: **excitatory** or **inhibitory**","of":[4]},{"t":"Then **re-uptake** or **enzymatic destruction**","of":[5]}]}]},"note":"Follow one signal: electrical arrival → calcium entry → release → diffusion → receptor binding → postsynaptic effect → clearance. Use the picture to locate each event.","source":"Her answer · 2024 NS case-study answers deck, slides 3–5","starred":true},{"id":"q6c0b707735","quiz":"case-c9","sys":"ns","mod":"cases","cmod":"m2","type":"essay","pts":2,"q":"When neurotransmitters bind to a receptor, what happens?","imgs":[],"qh":"<p>When neurotransmitters bind to a receptor, what happens?<\/p>","qt":"When neurotransmitters bind to a receptor, what happens?","saq":{"steps":["The postsynaptic membrane’s permeability changes,","causing either an excitatory or an inhibitory effect — the postsynaptic neuron is stimulated or inhibited."],"src":"Her answer · 2024 NS case-study answers deck, slides 3–4"},"scenario":"Exam case 9 · Neurotransmitters and the brain — Mr Paraone has been admitted to hospital after a fall and has reported they are having issues with mobility and tremors. Mr Paraone is later diagnosed with Parkinson’s disease. This is a brain disease where cells that normally make Dopamine, a neurotransmitter, start to die. One of the treatments to help control their symptoms is called Levodopa, which travels through the blood and into the brain to help to boost the brain’s Dopamine levels, so the neurons can continue to communicate properly via their synapses.","caseId":"c9","short":{"id":"c:c9:when neurotransmitters bind to","title":"When a neurotransmitter binds","hook":"The gate changes: EXCITE or INHIBIT.","groups":[{"q":"What happens","facts":[{"t":"The **postsynaptic membrane’s permeability changes**","of":[0]},{"t":"**Excitatory** or **inhibitory**: **stimulated or inhibited**","of":[1]}]}]},"note":"Receptor binding changes the postsynaptic response, including membrane permeability. The effect can be excitatory or inhibitory; neurotransmission does not always trigger another action potential.","source":"Her answer · 2024 NS case-study answers deck, slides 3–4","starred":true},{"id":"qa1f7429862","quiz":"case-c9","sys":"ns","mod":"cases","cmod":"m2","type":"essay","pts":1,"q":"After the neurotransmitter has been released, what happens to that chemical signal?","imgs":[],"qh":"<p>After the neurotransmitter has been released, what happens to that chemical signal?<\/p>","qt":"After the neurotransmitter has been released, what happens to that chemical signal?","saq":{"steps":["It is removed: re-uptake into the presynaptic neuron, or enzymatic destruction of the neurotransmitter."],"src":"Her answer · 2024 NS case-study answers deck, slides 3–4"},"scenario":"Exam case 9 · Neurotransmitters and the brain — Mr Paraone has been admitted to hospital after a fall and has reported they are having issues with mobility and tremors. Mr Paraone is later diagnosed with Parkinson’s disease. This is a brain disease where cells that normally make Dopamine, a neurotransmitter, start to die. One of the treatments to help control their symptoms is called Levodopa, which travels through the blood and into the brain to help to boost the brain’s Dopamine levels, so the neurons can continue to communicate properly via their synapses.","caseId":"c9","short":{"id":"c:c9:after the neurotransmitter has","title":"Clearing the signal","hook":"Take it BACK or BREAK it down.","groups":[{"q":"What happens to it","facts":[{"t":"**Re-uptake** into the **presynaptic neuron**","of":[0]},{"t":"or **enzymatic destruction**","of":[0]}]}]},"note":"If transmitter remained in the cleft, its signal could continue. Reuptake and enzymatic breakdown remove it, allowing the synapse to reset.","source":"Her answer · 2024 NS case-study answers deck, slides 3–4","starred":true},{"id":"qc53c0c09ed","quiz":"case-c9","sys":"ns","mod":"cases","cmod":"m2","type":"essay","pts":9,"q":"Label her synapse figure, A to G, and name the two transport processes it shows.","imgs":["wb26-synapse.png"],"qh":"<p>Label her synapse figure, A to G, and name the two transport processes it shows.<\/p>","qt":"Label her synapse figure, A to G, and name the two transport processes it shows.","saq":{"steps":["A — calcium channel: where calcium (Ca2+) can enter the cell.","B — vesicle: contains the neurotransmitters.","C — neurotransmitter molecules (every dot is one).","D — reuptake channel: the neurotransmitter goes back to be used again.","E — receptors (on the postsynaptic membrane).","F — presynaptic neuron: you can tell by the vesicles.","G — postsynaptic neuron: you can tell by the receptors.","Exocytosis: the vesicle fuses with the membrane and releases the neurotransmitter.","Diffusion: the neurotransmitters cross the synaptic cleft (from high to low concentration)."],"src":"Her answer · her 31 May 2024 morning case-study session (same Canvas page, the Neurotransmitters & Stroke video), 45:19–48:46; her joints session (38:27) says the same: “they’re going to ask you to pinpoint presynaptic neuron, label it…”. The question wording is the tool’s; every label is hers"},"scenario":"Exam case 9 · Neurotransmitters and the brain — Mr Paraone has been admitted to hospital after a fall and has reported they are having issues with mobility and tremors. Mr Paraone is later diagnosed with Parkinson’s disease. This is a brain disease where cells that normally make Dopamine, a neurotransmitter, start to die. One of the treatments to help control their symptoms is called Levodopa, which travels through the blood and into the brain to help to boost the brain’s Dopamine levels, so the neurons can continue to communicate properly via their synapses.","caseId":"c9","short":{"id":"c:c9:label her synapse figure","title":"Label the synapse, A to G","hook":"VESICLES mean pre (F); RECEPTORS mean post (G).","groups":[{"q":"The letters","facts":[{"t":"**A**: **calcium channel**","of":[0]},{"t":"**B**: **vesicle**","of":[1]},{"t":"**C**: **neurotransmitter** molecules","of":[2]},{"t":"**D**: **reuptake** channel","of":[3]},{"t":"**E**: **receptors**","of":[4]},{"t":"**F**: **presynaptic** neuron (the **vesicles**)","of":[5]},{"t":"**G**: **postsynaptic** neuron (the **receptors**)","of":[6]}]},{"q":"The processes","facts":[{"t":"**Exocytosis**: the **vesicle fuses**, releasing the neurotransmitter","of":[7]},{"t":"**Diffusion** across the **synaptic cleft**","of":[8]}]}]},"note":"Find the vesicles to identify the sending side and receptors to identify the receiving side. Then locate the calcium channel, released molecules and reuptake channel on the actual figure.","source":"Her answer · her 31 May 2024 morning case-study session (same Canvas page, the Neurotransmitters & Stroke video), 45:19–48:46; her joints session (38:27) says the same: “they’re going to ask you to pinpoint presynaptic neuron, label it…”. The question wording is the tool’s; every label is hers","starred":true},{"id":"qdef14f2387","quiz":"case-c10","sys":"ns","mod":"cases","cmod":"m2","type":"essay","pts":7,"q":"Review the functional regions of the cerebrum using this image: name the functional area at each letter, A to G.","imgs":["wb26-cerebrum.png"],"qh":"<p>Review the functional regions of the cerebrum using this image: name the functional area at each letter, A to G.<\/p>","qt":"Review the functional regions of the cerebrum using this image: name the functional area at each letter, A to G.","saq":{"steps":["A — prefrontal cortex.","B — Broca’s area.","C — the (pre)motor area, precentral gyrus.","D — the somatosensory area, postcentral gyrus.","E — the auditory area.","F — Wernicke’s area.","G — the occipital (visual) area."],"src":"Her answer · 2024 NS case-study answers deck, slide 10 (her key: 1=F, 2=B, 3=D, 4=G, 5=C, 6=E, 8=A)"},"scenario":"Exam case 10 · Stroke and the brain — You are working in a stroke rehabilitation unit, and are often interacting with individuals that are recovering from stroke, cerebrovascular accident, when parts of the brain are damaged during periods of ischaemia. Different areas of the brain control different tasks, so the symptoms a person shows, or the functions they have lost will be reflective of the part of their brain that has been damaged by the ischaemia. You are working with a range of people with differing functions, and you’re thinking about what parts of the brains must be involved.","caseId":"c10","short":{"id":"c:c10:review the functional regions","title":"Cerebrum areas, A to G","hook":"A to G: PLAN, SPEAK, MOVE, FEEL, HEAR, UNDERSTAND, SEE.","groups":[{"q":"Each letter","facts":[{"t":"A: **prefrontal cortex**","of":[0]},{"t":"B: **Broca’s area**","of":[1]},{"t":"C: **motor area**, **precentral gyrus**","of":[2]},{"t":"D: **somatosensory area**, **postcentral gyrus**","of":[3]},{"t":"E: **auditory area**","of":[4]},{"t":"F: **Wernicke’s area**","of":[5]},{"t":"G: **occipital** (**visual**) area","of":[6]}]}]},"note":"Anchor the central sulcus first: motor in front, sensory behind. Broca’s produces language; Wernicke’s supports comprehension. Then place planning, hearing and vision on the image.","source":"Her answer · 2024 NS case-study answers deck, slide 10 (her key: 1=F, 2=B, 3=D, 4=G, 5=C, 6=E, 8=A)","starred":true},{"id":"qee46310ded","quiz":"case-c10","sys":"ns","mod":"cases","cmod":"m2","type":"essay","pts":7,"q":"For each region, brainstorm the possible changes to function or behaviour that would result from damage to that region.","imgs":["wb26-cerebrum.png"],"qh":"<p>For each region, brainstorm the possible changes to function or behaviour that would result from damage to that region.<\/p>","qt":"For each region, brainstorm the possible changes to function or behaviour that would result from damage to that region.","saq":{"steps":["A, prefrontal cortex (problem-solving, judgement, inhibiting inappropriate behaviour, keeping the mind on goals) → poor judgement, inappropriate behaviour, loss of focus.","B, Broca’s area (talking, writing, producing speech that can be understood) → difficulty producing speech and writing.","C, motor area (muscle movements are “instructed” from here, each muscle group mapped) → loss of voluntary movement of the mapped parts.","D, somatosensory area (every part of the body is represented; general senses such as touch arrive here) → loss of touch and other general sensation.","E, auditory area (hearing, regions attuned to different frequencies) → hearing affected.","F, Wernicke’s area (understanding spoken and written language) → cannot understand language.","G, occipital area (the visual processing system, primary visual cortex) → vision affected."],"src":"Her answer · 2024 NS case-study answers deck, slide 10 gives what each area DOES; each line’s “damage →” half is the tool’s reading of that function"},"scenario":"Exam case 10 · Stroke and the brain — You are working in a stroke rehabilitation unit, and are often interacting with individuals that are recovering from stroke, cerebrovascular accident, when parts of the brain are damaged during periods of ischaemia. Different areas of the brain control different tasks, so the symptoms a person shows, or the functions they have lost will be reflective of the part of their brain that has been damaged by the ischaemia. You are working with a range of people with differing functions, and you’re thinking about what parts of the brains must be involved.","caseId":"c10","short":{"id":"c:c10:for each region brainstorm","title":"What damage to each area does","hook":"Lose what it does: judgement, speech, movement, touch, hearing, understanding, sight.","groups":[{"q":"Each area, damaged","facts":[{"t":"A prefrontal: **poor judgement**, **inappropriate behaviour**, **loss of focus**","of":[0]},{"t":"B Broca’s: **difficulty producing speech** and writing","of":[1]},{"t":"C motor: **loss of voluntary movement**","of":[2]},{"t":"D somatosensory: **loss of touch** and general sensation","of":[3]},{"t":"E auditory: **hearing affected**","of":[4]},{"t":"F Wernicke’s: **cannot understand language**","of":[5]},{"t":"G occipital: **vision affected**","of":[6]}]}]},"note":"Retrieve the normal function first, then describe what loss of that function would look like. This is one map used in two directions.","source":"Her answer · 2024 NS case-study answers deck, slide 10 gives what each area DOES; each line’s “damage →” half is the tool’s reading of that function","starred":true},{"id":"qb04815257c","quiz":"case-c13","sys":"repro","mod":"cases","cmod":"m3","type":"essay","pts":1,"q":"What is an ovulation predictor kit? What does it show?","imgs":[],"qh":"<p>What is an ovulation predictor kit? What does it show?<\/p>","qt":"What is an ovulation predictor kit? What does it show?","saq":{"steps":["An ovulation predictor kit shows when ovulation is about to happen since it picks up the sharp peak in the luteinizing hormone (LH) in the urine just before ovulation."],"src":"Her answer · her MODULE 3 CASES: FERTILITY QUIZ (211050), which her Anatomy Mondays 15 page names as this case’s model answer (her true/false statement)"},"scenario":"Exam case 13 · Fertility — Rose and Simon are seeing the nurse at their local GP’s clinic, as they have recently made the decision to begin trying to conceive. Rose has been on the Depo Provera injection as a method of contraception for the past 2 years. As her nurse, you advise that it could take a little while for her normal cycle to settle after coming off this hormonal contraceptive. Rose takes your recommendation about tracking her cycle after learning that there are limited days in the month where she will be fertile and able to conceive. She has also taken your recommendation about purchasing an ovulation predictor kit and some pregnancy tests.","caseId":"c13","short":{"id":"c:c13:what is an ovulation","title":"The ovulation predictor kit","hook":"It catches the LH PEAK in urine.","groups":[{"q":"What it shows","facts":[{"t":"When **ovulation** is about to happen","of":[0]},{"t":"It picks up the **peak** in **luteinizing hormone** (**LH**) in the **urine**","of":[0]}]}]},"note":"An ovulation kit detects the LH surge in urine before ovulation. A pregnancy test detects hCG; they test different events.","source":"Her answer · her MODULE 3 CASES: FERTILITY QUIZ (211050), which her Anatomy Mondays 15 page names as this case’s model answer (her true/false statement)","starred":true},{"id":"q2baad665ae","quiz":"case-c13","sys":"repro","mod":"cases","cmod":"m3","type":"essay","pts":4,"q":"What occurs during ovulation?","imgs":[],"qh":"<p>What occurs during ovulation?<\/p>","qt":"What occurs during ovulation?","saq":{"steps":["A secondary oocyte is released from the ovary.","Ovulation is triggered by a peak in the levels of LH.","The ovarian wall ruptures when the fluid-filled cyst, the Graafian or tertiary follicle, bursts.","The oocyte must be pushed by the force of fluid out of the ovary and toward the fimbriae of the Fallopian tube."],"src":"Her answer · her MODULE 3 CASES: FERTILITY QUIZ (211050), which her Anatomy Mondays 15 page names as this case’s model answer (her six-blank ovulation question, blanks filled with her keys)"},"scenario":"Exam case 13 · Fertility — Rose and Simon are seeing the nurse at their local GP’s clinic, as they have recently made the decision to begin trying to conceive. Rose has been on the Depo Provera injection as a method of contraception for the past 2 years. As her nurse, you advise that it could take a little while for her normal cycle to settle after coming off this hormonal contraceptive. Rose takes your recommendation about tracking her cycle after learning that there are limited days in the month where she will be fertile and able to conceive. She has also taken your recommendation about purchasing an ovulation predictor kit and some pregnancy tests.","caseId":"c13","short":{"id":"c:c13:what occurs during ovulation","title":"What happens at ovulation","hook":"LH PEAK → follicle BURSTS → oocyte OUT → toward the FIMBRIAE.","groups":[{"q":"What occurs","facts":[{"t":"A **secondary oocyte** is released from the **ovary**","of":[0]},{"t":"Triggered by a **peak** in **LH**","of":[1]},{"t":"The **Graafian** (tertiary) **follicle** bursts; the ovarian wall **ruptures**","of":[2]},{"t":"Fluid pushes the oocyte to the **fimbriae** of the **Fallopian tube**","of":[3]}]}]},"note":"The LH surge triggers rupture of the mature follicle and release of a secondary oocyte. The fimbriae help capture it into the uterine tube. Include the trigger and the anatomical route.","source":"Her answer · her MODULE 3 CASES: FERTILITY QUIZ (211050), which her Anatomy Mondays 15 page names as this case’s model answer (her six-blank ovulation question, blanks filled with her keys)","starred":true},{"id":"q22b21b3a98","quiz":"case-c13","sys":"repro","mod":"cases","cmod":"m3","type":"essay","pts":1,"q":"What days of a female’s cycle are they fertile? Use the accompanying image to answer.","imgs":["wb26-cycle.png"],"qh":"<p>What days of a female’s cycle are they fertile? Use the accompanying image to answer.<\/p>","qt":"What days of a female’s cycle are they fertile? Use the accompanying image to answer.","saq":{"steps":["Days 10–17."],"src":"Her answer · her MODULE 3 CASES: FERTILITY QUIZ (211050), which her Anatomy Mondays 15 page names as this case’s model answer"},"scenario":"Exam case 13 · Fertility — Rose and Simon are seeing the nurse at their local GP’s clinic, as they have recently made the decision to begin trying to conceive. Rose has been on the Depo Provera injection as a method of contraception for the past 2 years. As her nurse, you advise that it could take a little while for her normal cycle to settle after coming off this hormonal contraceptive. Rose takes your recommendation about tracking her cycle after learning that there are limited days in the month where she will be fertile and able to conceive. She has also taken your recommendation about purchasing an ovulation predictor kit and some pregnancy tests.","caseId":"c13","short":{"id":"c:c13:what days of a","title":"The fertile days","hook":"Days 10 to 17.","groups":[{"q":"The days","facts":[{"t":"**Days 10–17**","of":[0]}]}]},"note":"For the supplied course graph, the keyed window is days 10–17. This is the answer for that graph, not a reliable contraception rule for every real menstrual cycle.","source":"Her answer · her MODULE 3 CASES: FERTILITY QUIZ (211050), which her Anatomy Mondays 15 page names as this case’s model answer","starred":true},{"id":"q574fdc480d","quiz":"case-c13","sys":"repro","mod":"cases","cmod":"m3","type":"essay","pts":2,"q":"Can you explain why the hormone levels change over the course of the menstrual cycle?","imgs":["wb26-cycle.png"],"qh":"<p>Can you explain why the hormone levels change over the course of the menstrual cycle?<\/p>","qt":"Can you explain why the hormone levels change over the course of the menstrual cycle?","saq":{"steps":["Hormone levels change over the course of the menstrual cycle since each hormone is driving a different process.","We need follicles to develop (FSH), uterine lining to thicken (estrogen), ovulation (LH), and the uterus to prepare for implantation and pregnancy (progesterone)."],"src":"Her answer · her MODULE 3 CASES: FERTILITY QUIZ (211050), which her Anatomy Mondays 15 page names as this case’s model answer (her true/false statement)"},"scenario":"Exam case 13 · Fertility — Rose and Simon are seeing the nurse at their local GP’s clinic, as they have recently made the decision to begin trying to conceive. Rose has been on the Depo Provera injection as a method of contraception for the past 2 years. As her nurse, you advise that it could take a little while for her normal cycle to settle after coming off this hormonal contraceptive. Rose takes your recommendation about tracking her cycle after learning that there are limited days in the month where she will be fertile and able to conceive. She has also taken your recommendation about purchasing an ovulation predictor kit and some pregnancy tests.","caseId":"c13","short":{"id":"c:c13:can you explain why","title":"Why the hormones change","hook":"Each hormone has a job: FSH grows, estrogen thickens, LH releases, progesterone prepares.","groups":[{"q":"Why","facts":[{"t":"Each hormone drives a **different process**","of":[0]},{"t":"**Follicles** develop (**FSH**); the **uterine lining** thickens (**estrogen**)","of":[1]},{"t":"**Ovulation** (**LH**); ready for **implantation** (**progesterone**)","of":[1]}]}]},"note":"Each hormone drives a different part of the cycle: follicle growth, lining growth, ovulation and preparation for implantation. Connect the peaks on the graph to those events.","source":"Her answer · her MODULE 3 CASES: FERTILITY QUIZ (211050), which her Anatomy Mondays 15 page names as this case’s model answer (her true/false statement)","starred":true},{"id":"qc184f15557","quiz":"case-c13","sys":"repro","mod":"cases","cmod":"m3","type":"essay","pts":2,"q":"How would pregnancy change the hormone levels graph?","imgs":["wb26-cycle.png"],"qh":"<p>How would pregnancy change the hormone levels graph?<\/p>","qt":"How would pregnancy change the hormone levels graph?","saq":{"steps":["The hormone drop that we see at roughly day 21 would not occur in successful implantation and pregnancy.","The estrogen and progesterone levels will keep rising."],"src":"Her answer · her MODULE 3 CASES: FERTILITY QUIZ (211050), which her Anatomy Mondays 15 page names as this case’s model answer (her two keyed statements)"},"scenario":"Exam case 13 · Fertility — Rose and Simon are seeing the nurse at their local GP’s clinic, as they have recently made the decision to begin trying to conceive. Rose has been on the Depo Provera injection as a method of contraception for the past 2 years. As her nurse, you advise that it could take a little while for her normal cycle to settle after coming off this hormonal contraceptive. Rose takes your recommendation about tracking her cycle after learning that there are limited days in the month where she will be fertile and able to conceive. She has also taken your recommendation about purchasing an ovulation predictor kit and some pregnancy tests.","caseId":"c13","short":{"id":"c:c13:how would pregnancy change","title":"Pregnancy and the hormone graph","hook":"No DROP at day 21: the levels keep RISING.","groups":[{"q":"The change","facts":[{"t":"The **hormone drop** at about **day 21** does not happen","of":[0]},{"t":"**Estrogen** and **progesterone** keep **rising**","of":[1]}]}]},"note":"In early pregnancy, hCG supports the corpus luteum, maintaining progesterone and oestrogen instead of the premenstrual fall. FSH and LH stay low, so no new follicle ripens and there is no period. The existing answer’s day reference belongs to its course graph.","source":"Her answer · her MODULE 3 CASES: FERTILITY QUIZ (211050), which her Anatomy Mondays 15 page names as this case’s model answer (her two keyed statements)","starred":true},{"id":"qa128d9123e","quiz":"case-c13","sys":"repro","mod":"cases","cmod":"m3","type":"essay","pts":3,"q":"Hormonal methods of contraception tend to impact a female’s fertility by using progesterone. Describe how we use the normal functions of the hormone progesterone to prevent pregnancy?","imgs":[],"qh":"<p>Hormonal methods of contraception tend to impact a female’s fertility by using progesterone. Describe how we use the normal functions of the hormone progesterone to prevent pregnancy?<\/p>","qt":"Hormonal methods of contraception tend to impact a female’s fertility by using progesterone. Describe how we use the normal functions of the hormone progesterone to prevent pregnancy?","saq":{"steps":["It prevents ovulation: it prevents the LH from being released.","It thickens the cervical mucus, so it keeps the sperm out.","It imitates pregnancy by keeping the progesterone levels high."],"src":"Her answer · her 31 May 2024 case-study session (Canvas page “RECORDINGS EXAM PREP & CASE STUDIES Model answers”, the Fertility & Red green colorblindness video), 27:28 — her spoken answer to her mini-pill question (what it does, before the oxytocin distractor it does not)"},"scenario":"Exam case 13 · Fertility — Rose and Simon are seeing the nurse at their local GP’s clinic, as they have recently made the decision to begin trying to conceive. Rose has been on the Depo Provera injection as a method of contraception for the past 2 years. As her nurse, you advise that it could take a little while for her normal cycle to settle after coming off this hormonal contraceptive. Rose takes your recommendation about tracking her cycle after learning that there are limited days in the month where she will be fertile and able to conceive. She has also taken your recommendation about purchasing an ovulation predictor kit and some pregnancy tests.","caseId":"c13","short":{"id":"c:c13:hormonal methods of contraception","title":"How progesterone contraception works","hook":"STOP ovulation, BLOCK the sperm, FAKE a pregnancy.","groups":[{"q":"What progesterone does","facts":[{"t":"Prevents **ovulation**: stops the **LH** being released","of":[0]},{"t":"Thickens the **cervical mucus**: keeps the **sperm** out","of":[1]},{"t":"Imitates **pregnancy**: keeps **progesterone** levels **high**","of":[2]}]}]},"note":"Progestogens make cervical mucus harder for sperm to pass and, depending on the preparation, suppress ovulation through hormonal feedback. The course shorthand “imitates pregnancy” describes sustained hormonal feedback. Depot progestogen (Depo Provera) also thins the endometrium, so a past exam’s three points were: thicker mucus, no ovulation, thinner lining.","source":"Her answer · her 31 May 2024 case-study session (Canvas page “RECORDINGS EXAM PREP & CASE STUDIES Model answers”, the Fertility & Red green colorblindness video), 27:28 — her spoken answer to her mini-pill question (what it does, before the oxytocin distractor it does not)","starred":true},{"id":"q87e6a25512","quiz":"case-c13","sys":"repro","mod":"cases","cmod":"m3","type":"essay","pts":6,"q":"Contraception can be hormonal or non-hormonal. Summarise the differences in a tabular form. (Method · How does this prevent pregnancy? · Does this prevent STI?)","imgs":[],"qh":"<p>Contraception can be hormonal or non-hormonal. Summarise the differences in a tabular form. (Method · How does this prevent pregnancy? · Does this prevent STI?)<\/p>","qt":"Contraception can be hormonal or non-hormonal. Summarise the differences in a tabular form. (Method · How does this prevent pregnancy? · Does this prevent STI?)","saq":{"steps":["Hormonal methods (the pill; the Jadelle implant, which slowly releases the hormones) may prevent ovulation from happening.","The mini pill (progesterone only) prevents ovulation (stops LH being released), thickens the cervical mucus to keep the sperm out, and imitates pregnancy by keeping progesterone high.","Hormonal methods protect against pregnancy only, not STIs: there is no barrier.","Non-hormonal: condoms form a barrier that prevents the semen from getting into the woman’s body.","Condoms protect against both pregnancy and STIs (gonorrhoea, syphilis, HIV), but not pubic lice, which live in the pubic hair the condom does not cover.","The IUD may prevent implantation of the conceptus in the endometrium; it protects against pregnancy only. Only the condom also protects against STIs."],"src":"Her answer · her MODULE 3 CASES: FERTILITY QUIZ (211050), which her Anatomy Mondays 15 page names as this case’s model answer (its matching question: condoms, IUD, hormonal contraception); Her answer · her 31 May 2024 case-study session (Canvas page “RECORDINGS EXAM PREP & CASE STUDIES Model answers”, the Fertility & Red green colorblindness video), 27:28 (the mini pill); Her answer · her 31 May 2024 morning case-study session (same Canvas page, the Neurotransmitters & Stroke video), 18:26–20:08 (which methods protect against STIs). Filing the IUD in the non-hormonal row is the tool’s: her quiz says only “IUD”"},"scenario":"Exam case 13 · Fertility — Rose and Simon are seeing the nurse at their local GP’s clinic, as they have recently made the decision to begin trying to conceive. Rose has been on the Depo Provera injection as a method of contraception for the past 2 years. As her nurse, you advise that it could take a little while for her normal cycle to settle after coming off this hormonal contraceptive. Rose takes your recommendation about tracking her cycle after learning that there are limited days in the month where she will be fertile and able to conceive. She has also taken your recommendation about purchasing an ovulation predictor kit and some pregnancy tests.","caseId":"c13","short":{"id":"c:c13:contraception can be hormonal","title":"Her contraception table","hook":"Hormones STOP OVULATION; a condom is a BARRIER; only the CONDOM stops STIs.","groups":[{"q":"Hormonal methods","facts":[{"t":"The **pill**, the **Jadelle implant**: may **prevent ovulation**","of":[0]},{"t":"**Mini pill**: stops **LH**, thickens **cervical mucus**, **imitates pregnancy**","of":[1]},{"t":"STIs? **No**: **pregnancy only**, there is **no barrier**","of":[2]}]},{"q":"Non-hormonal methods","facts":[{"t":"**Condoms**: a **barrier** keeps the **semen** out","of":[3]},{"t":"Protect against **pregnancy** and **STIs**, but not **pubic lice**","of":[4]},{"t":"**IUD**: may prevent **implantation** in the **endometrium**","of":[5]},{"t":"**Pregnancy only**: **only the condom** also stops STIs","of":[5]}]}]},"note":"Group methods by what they interrupt: ovulation, sperm passage or fertilisation. The course key uses “implantation” for IUD; modern descriptions emphasise prevention of fertilisation. Condoms reduce STI risk; protection is not absolute.","source":"Her answer · her MODULE 3 CASES: FERTILITY QUIZ (211050), which her Anatomy Mondays 15 page names as this case’s model answer (its matching question: condoms, IUD, hormonal contraception); Her answer · her 31 May 2024 case-study session (Canvas page “RECORDINGS EXAM PREP & CASE STUDIES Model answers”, the Fertility & Red green colorblindness video), 27:28 (the mini pill); Her answer · her 31 May 2024 morning case-study session (same Canvas page, the Neurotransmitters & Stroke video), 18:26–20:08 (which methods protect against STIs). Filing the IUD in the non-hormonal row is the tool’s: her quiz says only “IUD”","starred":true},{"id":"rep-fertility","caseId":"c13","heldKey":"c13:0","type":"essay","q":"Compare the key factors in male and female fertility.","qt":"Compare the key factors in male and female fertility.","imgs":[],"note":"Compare the same feature across sexes: start time, supply, timing, hormonal control and the requirements for gametes to meet. Oocytes are not newly manufactured each month.","source":"Study answer compiled from the course workbook and reproductive learning material; not a published lecturer marking schedule.","supplement":true,"short":{"title":"Compare male and female fertility","hook":"","groups":[{"q":"Production and timing","facts":[{"t":"Female: reproductive fertility from **menarche to menopause**; male: from **puberty**, often into old age.","of":[0]},{"t":"Female: primary oocytes formed **before birth**; male: spermatogenesis starts at **puberty**.","of":[1]},{"t":"Female meiosis is **arrested**, resumes cyclically; meiosis II finishes after **fertilisation**.","of":[2]},{"t":"Male sperm production is **continuous** after puberty.","of":[3]}]},{"q":"Supply","facts":[{"t":"One primary oocyte gives **one functional ovum** plus polar bodies; one primary spermatocyte gives **four sperm**.","of":[100]},{"t":"Female: a **finite ovarian reserve**; male: spermatogonia renew, enabling continuing sperm production.","of":[101]},{"t":"Usually **one secondary oocyte per cycle** is ovulated; males produce **millions of sperm daily**.","of":[102]}]},{"q":"Hormonal control","facts":[{"t":"Female: **FSH** promotes follicle growth; **LH** triggers ovulation.","of":[200]},{"t":"Male: **FSH acts on Sertoli cells**; **LH stimulates Leydig cells** to produce testosterone.","of":[201]},{"t":"**Inhibin** reduces **FSH** through negative feedback in both sexes.","of":[202]}]},{"q":"Successful conception","facts":[{"t":"Female: **ovulation**, patent **uterine tubes**, suitable **endometrium** and cervical mucus.","of":[300]},{"t":"Male: adequate **number**, **motility** and normal **morphology** of sperm; successful ejaculation.","of":[301]},{"t":"Age, hormonal disorders, infections, smoking and other factors can impair fertility in **either sex**.","of":[302]}]},{"q":"The course comparison table","facts":[{"t":"Female tract: **cervical mucus** becomes sperm-friendly near ovulation; **acidic vaginal conditions** can harm sperm.","of":[400]},{"t":"Male **seminal fluid buffers acidity**; fructose supplies energy for sperm movement.","of":[401]},{"t":"Conception is possible around **ovulation**; the male has no equivalent monthly fertile window.","of":[402]},{"t":"**Implantation occurs in the uterus**, after the embryo develops; there is no male implantation stage.","of":[403]},{"t":"**Fimbriae**, tubal **cilia** and muscular contractions help the oocyte/embryo move.","of":[404]},{"t":"**Erection and ejaculation** deliver sperm; sperm motility and tract contractions help gametes meet.","of":[405]},{"t":"Female risks include **ovulation disorders**, blocked tubes, endometriosis and reduced ovarian reserve.","of":[406]},{"t":"Male risks include **testicular damage**, excess heat, hormonal disturbance and impaired sperm quality.","of":[407]}]}]},"starred":true},{"id":"rep-sex-hormones","caseId":"c13","heldKey":"c13:1","type":"essay","q":"Explain the sources, control and functions of the sex hormones in females and males.","qt":"Explain the sources, control and functions of the sex hormones in females and males.","imgs":[],"note":"Follow hypothalamus → pituitary → gonads. Pair each hormone with its source and target so that the male and female pathways stay connected.","source":"Study answer compiled from the course workbook and reproductive learning material; not a published lecturer marking schedule.","supplement":true,"short":{"title":"Sex hormones: source and function","hook":"","groups":[{"q":"Control","facts":[{"t":"**GnRH** from the **hypothalamus** stimulates anterior pituitary **FSH and LH**.","of":[0]},{"t":"Sex hormones provide **negative feedback** to the hypothalamus and anterior pituitary.","of":[1]}]},{"q":"FSH and LH","facts":[{"t":"**FSH**, anterior pituitary: **follicle growth** in females; **Sertoli-cell support of spermatogenesis** in males.","of":[100]},{"t":"**LH**, anterior pituitary: **ovulation/corpus luteum** in females; **Leydig-cell testosterone production** in males.","of":[101]}]},{"q":"Ovarian hormones","facts":[{"t":"**Oestrogen**, ovarian follicles: endometrial growth and female secondary sex characteristics.","of":[200]},{"t":"**Progesterone**, corpus luteum then placenta: maintains a secretory **endometrium** and supports pregnancy.","of":[201]}]},{"q":"Testosterone and inhibin","facts":[{"t":"**Testosterone**, testicular **Leydig cells** under LH: supports spermatogenesis and male secondary sex characteristics.","of":[300]},{"t":"**Inhibin**, ovarian granulosa cells or testicular Sertoli cells: inhibits **FSH**.","of":[301]}]}]},"starred":true},{"id":"rep-ivf","caseId":"c13","heldKey":"c13:2","type":"essay","q":"What is IVF, when may it be appropriate, and why are FSH injections used?","qt":"What is IVF, when may it be appropriate, and why are FSH injections used?","imgs":[],"note":"IVF brings the gametes together outside the body. FSH helps obtain several oocytes rather than relying on the usual single dominant follicle.","source":"Course FSH/follicle physiology plus NHS IVF overview: https://www.nhs.uk/tests-and-treatments/ivf/ . Compiled study answer, not a lecturer key.","supplement":true,"short":{"title":"IVF and the role of FSH","hook":"","groups":[{"q":"IVF","facts":[{"t":"**In vitro fertilisation**: fertilising collected oocytes with sperm **outside the body** in a laboratory.","of":[0]},{"t":"An embryo is then **transferred into the uterus**.","of":[1]},{"t":"May be appropriate for infertility, including **blocked uterine tubes** or some sperm/ovulation problems.","of":[2]}]},{"q":"FSH","facts":[{"t":"**FSH stimulates growth of multiple ovarian follicles**, increasing the number of oocytes available for collection.","of":[100]},{"t":"FSH helps follicles **grow**; the final maturation/ovulation trigger is a **separate** treatment step.","of":[101]}]}]},"starred":true},{"id":"q5d6f4349bd","quiz":"case-c14","sys":"gen","mod":"cases","cmod":"m3","type":"essay","pts":7,"q":"What is red-green colour blindness? (Distinguish between cones and rods, specifically where they are found in the eye; distinguish their functions using photopic, scotopic, colour, central and peripheral vision; define RG colour blindness in terms of the “inability to observe certain light frequencies”.)","imgs":["wb26-retina.png"],"qh":"<p>What is red-green colour blindness? (Distinguish between cones and rods, specifically where they are found in the eye; distinguish their functions using photopic, scotopic, colour, central and peripheral vision; define RG colour blindness in terms of the “inability to observe certain light frequencies”.)<\/p>","qt":"What is red-green colour blindness? (Distinguish between cones and rods, specifically where they are found in the eye; distinguish their functions using photopic, scotopic, colour, central and peripheral vision; define RG colour blindness in terms of the “inability to observe certain light frequencies”.)","saq":{"steps":["Cones are for colour vision: central colour vision in good light, and much more detailed.","Rods are for non-colour vision (black, white and grey scale) and more sensitive to light, so they work even in dim light.","The macula has both cones and rods; the fovea has only cones.","Red-green colour blindness is a genetic defect (an anomaly, not a disease) that causes dysfunction of the cones of the retina.","It affects the L cones (long wavelength, red light) and the M cones (medium wavelength, green light), so red and green are hard to distinguish.","It can be detected with a colour-blindness test.","In the question’s words: cones = photopic (bright light), colour and central vision; rods = scotopic (dim light) and peripheral vision."],"src":"Her answer · her 31 May 2024 case-study session (Canvas page “RECORDINGS EXAM PREP & CASE STUDIES Model answers”, the Fertility & Red green colorblindness video), 56:02–1:00:49: her words, and her quiz keys “cones” and “L and M cones” on her graded page. The LAST line is the tool’s: it puts her “good light / dim light” into the question’s words photopic / scotopic, and gives the rods peripheral vision (the textbook term; she does not say it)"},"scenario":"Exam case 14 · RG colour blindness — Simon is colour blind, a condition which affects his ability to distinguish between colours, with the most impact on red and green. He has expressed an interest in understanding why he has the disease, but neither of his parents do. He’s also heard that it is more common in males and so is wondering if he will pass this disease onto any sons he might have.","caseId":"c14","short":{"id":"c:c14:what is red green colour","title":"Rods, cones and RG colour blindness","hook":"Cones see COLOUR; RG = faulty L (red) and M (green) cones.","groups":[{"q":"Cones and rods","facts":[{"t":"**Cones**: **colour**, **central** vision, in **good light**, more **detailed**","of":[0]},{"t":"**Rods**: **grey scale**, more **sensitive** to light, work in **dim light**","of":[1]},{"t":"**Macula**: cones and rods; **fovea**: **only cones**","of":[2]}]},{"q":"What RG colour blindness is","facts":[{"t":"A **genetic defect** (an anomaly) of the **cones** of the **retina**","of":[3]},{"t":"Faulty **L cones** (**red**, long wavelength) and **M cones** (**green**, medium)","of":[4]},{"t":"Detected with a **colour-blindness test**","of":[5]}]},{"q":"In the question’s words","facts":[{"t":"Cones = **photopic**, colour, central; rods = **scotopic**, **peripheral**","of":[6]}]}]},"note":"Cones give detailed colour vision in bright light, with the highest concentration in the fovea. Rods are more sensitive in dim light and support peripheral vision. Red–green defects involve L- or M-cone pigment function; S cones detect blue.","source":"Her answer · her 31 May 2024 case-study session (Canvas page “RECORDINGS EXAM PREP & CASE STUDIES Model answers”, the Fertility & Red green colorblindness video), 56:02–1:00:49: her words, and her quiz keys “cones” and “L and M cones” on her graded page. The LAST line is the tool’s: it puts her “good light / dim light” into the question’s words photopic / scotopic, and gives the rods peripheral vision (the textbook term; she does not say it)","starred":true},{"id":"q7ba91dd4e8","quiz":"case-c14","sys":"gen","mod":"cases","cmod":"m3","type":"essay","pts":7,"q":"Draw a pedigree chart to show Simon, his mum, his dad, his maternal grandmother (not colour-blind), maternal grandfather (colour-blind), maternal aunt (colour-blind) and maternal uncle (not colour-blind). Can you track how Simon inherited the disease when neither of his parents are colour blind?","imgs":[],"qh":"<p>Draw a pedigree chart to show Simon, his mum, his dad, his maternal grandmother (not colour-blind), maternal grandfather (colour-blind), maternal aunt (colour-blind) and maternal uncle (not colour-blind). Can you track how Simon inherited the disease when neither of his parents are colour blind?<\/p>","qt":"Draw a pedigree chart to show Simon, his mum, his dad, his maternal grandmother (not colour-blind), maternal grandfather (colour-blind), maternal aunt (colour-blind) and maternal uncle (not colour-blind). Can you track how Simon inherited the disease when neither of his parents are colour blind?","saq":{"steps":["Maternal grandfather: XbY — a man (Y chromosome), colour-blind, and the condition is recessive.","Maternal grandmother: XBXb, a carrier — not colour-blind, but she has a colour-blind daughter.","Maternal aunt: XbXb — a colour-blind woman has the defect on both her X chromosomes.","Simon’s mum: XBXb, a carrier — she carried it over to Simon, but her normal XB gives her normal vision.","Simon’s dad: XBY — he is not colour-blind, so he has the normal X.","Maternal uncle: XBY — not colour-blind.","Simon: XbY — his Xb came from his mum; his dad gave him only a Y."],"src":"Her answer · her 31 May 2024 case-study session (Canvas page “RECORDINGS EXAM PREP & CASE STUDIES Model answers”, the Fertility & Red green colorblindness video), 1:01:50–1:05:25: her genotype for each relative, keyed “Correct!” on her graded quiz; the uncle’s line applies her rule for Simon’s dad (not colour-blind, so the normal X), and Simon’s line her “he gives his sons only Y’s”. She says the exam will not ask you to draw the chart, only to fill genotypes in (1:00:49)"},"scenario":"Exam case 14 · RG colour blindness — Simon is colour blind, a condition which affects his ability to distinguish between colours, with the most impact on red and green. He has expressed an interest in understanding why he has the disease, but neither of his parents do. He’s also heard that it is more common in males and so is wondering if he will pass this disease onto any sons he might have.","caseId":"c14","short":{"id":"c:c14:draw a pedigree chart","title":"Every relative’s genotype","hook":"Grandad’s Xb → carrier MUM → Simon XbY; his dad gives only a Y.","groups":[{"q":"Mum’s side","facts":[{"t":"**Grandfather**: **XbY** (a colour-blind man)","of":[0]},{"t":"**Grandmother**: **XBXb**, a **carrier** (she has a colour-blind daughter)","of":[1]},{"t":"**Aunt**: **XbXb** (the defect on **both** X chromosomes)","of":[2]},{"t":"**Uncle**: **XBY** (not colour-blind)","of":[5]}]},{"q":"Simon’s family","facts":[{"t":"**Mum**: **XBXb**, a **carrier**; her **XB** gives **normal vision**","of":[3]},{"t":"**Dad**: **XBY**, he has the **normal X**","of":[4]},{"t":"**Simon**: **XbY**; Xb from his **mum**, only a **Y** from dad","of":[6]}]}]},"note":"Use the person’s own phenotype first, then their relatives. An affected grandfather passes his affected X to every daughter. A colour-blind daughter must also receive an affected X from her mother.","source":"Her answer · her 31 May 2024 case-study session (Canvas page “RECORDINGS EXAM PREP & CASE STUDIES Model answers”, the Fertility & Red green colorblindness video), 1:01:50–1:05:25: her genotype for each relative, keyed “Correct!” on her graded quiz; the uncle’s line applies her rule for Simon’s dad (not colour-blind, so the normal X), and Simon’s line her “he gives his sons only Y’s”. She says the exam will not ask you to draw the chart, only to fill genotypes in (1:00:49)","starred":true},{"id":"q19afbec7de","quiz":"case-c14","sys":"gen","mod":"cases","cmod":"m3","type":"essay","pts":6,"q":"Given the above and your own research, how is red-green colour blindness inherited?","imgs":[],"qh":"<p>Given the above and your own research, how is red-green colour blindness inherited?<\/p>","qt":"Given the above and your own research, how is red-green colour blindness inherited?","saq":{"steps":["X-linked recessive: only the L (red) and M (green) cone genes are on the X chromosome.","Often carried by mothers, and expressed in 50% of their sons.","It only shows when all X chromosomes are affected: a woman needs both.","Fathers never pass it to their sons: they give their sons only a Y.","Fathers always pass the affected X chromosome to all their daughters.","It can skip a generation."],"src":"Her answer · her “What do we need to study for the exam?” post (413286, 4 Oct 2026), her “better answer” for the cause of RG colour blindness, split into lines; the first line’s genes and the last line are from her 2024 case-study session (59:09, 1:08:40)"},"scenario":"Exam case 14 · RG colour blindness — Simon is colour blind, a condition which affects his ability to distinguish between colours, with the most impact on red and green. He has expressed an interest in understanding why he has the disease, but neither of his parents do. He’s also heard that it is more common in males and so is wondering if he will pass this disease onto any sons he might have.","caseId":"c14","short":{"id":"c:c14:given the above and","title":"How RG colour blindness is inherited","hook":"X-linked RECESSIVE: carrier mums, affected sons; dads never to sons.","groups":[{"q":"The pattern","facts":[{"t":"**X-linked recessive**: the **L** and **M** cone genes are on the **X**","of":[0]},{"t":"Carried by **mothers**, shows in **50%** of their **sons**","of":[1]},{"t":"Shows only when **all X** chromosomes are affected: a woman needs **both**","of":[2]},{"t":"Can **skip a generation**","of":[5]}]},{"q":"Fathers","facts":[{"t":"**Never** to their **sons**: sons get only a **Y**","of":[3]},{"t":"**Always** the affected X to **all** their **daughters**","of":[4]}]}]},"note":"A male needs one affected X because his Y does not provide another copy of the gene. A female usually needs two affected copies. The 50% sons statement assumes a heterozygous carrier mother.","source":"Her answer · her “What do we need to study for the exam?” post (413286, 4 Oct 2026), her “better answer” for the cause of RG colour blindness, split into lines; the first line’s genes and the last line are from her 2024 case-study session (59:09, 1:08:40)","starred":true},{"id":"qdc3c89bb6a","quiz":"case-c14","sys":"gen","mod":"cases","cmod":"m3","type":"essay","pts":2,"q":"Will Simon pass on red-green colour blindness to his children? How?","imgs":[],"qh":"<p>Will Simon pass on red-green colour blindness to his children? How?<\/p>","qt":"Will Simon pass on red-green colour blindness to his children? How?","saq":{"steps":["To none of his sons: he gives his sons only his Y.","To all his daughters, who will be unaffected carriers: each daughter gets his X."],"src":"Her answer · her 31 May 2024 case-study session (Canvas page “RECORDINGS EXAM PREP & CASE STUDIES Model answers”, the Fertility & Red green colorblindness video), 1:06:22–1:06:54: her key “To none of his sons, but to all his daughters who will be unaffected carriers”, correct on her graded quiz"},"scenario":"Exam case 14 · RG colour blindness — Simon is colour blind, a condition which affects his ability to distinguish between colours, with the most impact on red and green. He has expressed an interest in understanding why he has the disease, but neither of his parents do. He’s also heard that it is more common in males and so is wondering if he will pass this disease onto any sons he might have.","caseId":"c14","short":{"id":"c:c14:will simon pass on","title":"Will Simon pass it on?","hook":"Sons get his Y (clear); daughters get his Xb (carriers).","groups":[{"q":"His children","facts":[{"t":"**None** of his **sons**: they get his **Y**","of":[0]},{"t":"**All** his **daughters**, as **unaffected carriers**: they get his **X**","of":[1]}]}]},"note":"Simon gives his Y to sons and affected X to all daughters. Daughters are unaffected carriers if their mother supplies a normal X; the mother’s genotype determines their actual risk.","source":"Her answer · her 31 May 2024 case-study session (Canvas page “RECORDINGS EXAM PREP & CASE STUDIES Model answers”, the Fertility & Red green colorblindness video), 1:06:22–1:06:54: her key “To none of his sons, but to all his daughters who will be unaffected carriers”, correct on her graded quiz","starred":true},{"id":"qd942840085","quiz":"case-c15","sys":"gen","mod":"cases","cmod":"m3","type":"essay","pts":6,"q":"What are the modes of inheritance of Huntington’s disease and Cystic Fibrosis? Explain the modes of inheritance for both diseases (chromosome type, pattern of inheritance, what this means).","imgs":[],"qh":"<p>What are the modes of inheritance of Huntington’s disease and Cystic Fibrosis? Explain the modes of inheritance for both diseases (chromosome type, pattern of inheritance, what this means).<\/p>","qt":"What are the modes of inheritance of Huntington’s disease and Cystic Fibrosis? Explain the modes of inheritance for both diseases (chromosome type, pattern of inheritance, what this means).","saq":{"steps":["Cystic fibrosis: autosomal recessive, on chromosome 7.","It skips generations; people can be carriers.","The affected person is rr (homozygous).","Huntington’s disease: autosomal dominant, on chromosome 4.","It is expressed whenever the dominant allele is present: in every generation someone is expected to have it.","The affected person is Rr or RR."],"src":"Her answer · her 31 May 2024 case-study session (Canvas page “RECORDINGS EXAM PREP & CASE STUDIES Model answers”, the Fertility & Red green colorblindness video), 1:16:17 and 1:30:03–1:31:53: she names cystic fibrosis autosomal recessive and Huntington’s autosomal dominant, then marks a student’s board answer to this question “all of that is right”, adding in red that the answer must name the AFFECTED person (CF rr; Huntington’s Rr or RR). The chromosome numbers are that student’s, read off her screen; its “RR – heterozygous” slip is left out (RR is homozygous)"},"scenario":"Exam case 15 · Genetic diseases — You’ve been working in a GP clinic, working alongside many different families, serving a rural community. Recently, you’ve been working alongside two families that have genetic diseases. One family has cystic fibrosis (the Harris whanau), and one has Huntington’s disease (the Anderson whanau). You are wanting to understand more about how these diseases are passed from person to person, and how this might affect any future children that are born into these families.","caseId":"c15","short":{"id":"c:c15:what are the modes","title":"CF and Huntington’s: modes of inheritance","hook":"CF: autosomal RECESSIVE, rr, skips generations. HD: autosomal DOMINANT, every generation.","groups":[{"q":"Cystic fibrosis","facts":[{"t":"**Autosomal recessive**, on **chromosome 7**","of":[0]},{"t":"**Skips generations**; people can be **carriers**","of":[1]},{"t":"Affected person: **rr**","of":[2]}]},{"q":"Huntington’s disease","facts":[{"t":"**Autosomal dominant**, on **chromosome 4**","of":[3]},{"t":"Shows whenever the **dominant allele** is present: **every generation**","of":[4]},{"t":"Affected person: **Rr** or **RR**","of":[5]}]}]},"note":"Autosomal describes the chromosome; recessive or dominant describes expression. CF requires two affected alleles. Huntington’s needs one dominant affected allele in this pedigree model.","source":"Her answer · her 31 May 2024 case-study session (Canvas page “RECORDINGS EXAM PREP & CASE STUDIES Model answers”, the Fertility & Red green colorblindness video), 1:16:17 and 1:30:03–1:31:53: she names cystic fibrosis autosomal recessive and Huntington’s autosomal dominant, then marks a student’s board answer to this question “all of that is right”, adding in red that the answer must name the AFFECTED person (CF rr; Huntington’s Rr or RR). The chromosome numbers are that student’s, read off her screen; its “RR – heterozygous” slip is left out (RR is homozygous)","starred":true},{"id":"rep-harris","caseId":"c15","heldKey":"c15:0","type":"essay","q":"CF pedigree. Number each generation left-to-right: top I-1 to I-4, middle II-1 to II-7, bottom III-1 to III-2. State each genotype and phenotype. A = normal allele; a = CF allele.","qt":"CF pedigree. Number each generation left-to-right: top I-1 to I-4, middle II-1 to II-7, bottom III-1 to III-2. State each genotype and phenotype. A = normal allele; a = CF allele.","imgs":["wb26-harris.png"],"note":"Start with every shaded person: aa. Any unaffected child of an aa parent must be Aa. An unaffected parent of an aa child must also be Aa. Leave AA/Aa unresolved where the chart cannot decide.","source":"Worked directly from the original Case Study Workbook 2026 S2 Harris pedigree using Mendelian inheritance. Indices added verbally for practice; not a lecturer-posted key.","supplement":true,"short":{"title":"Harris whānau: every genotype","hook":"","groups":[{"q":"Top generation","facts":[{"t":"**I-1: AA or Aa**, unaffected; **I-2: aa**, affected.","of":[0]},{"t":"**I-3 and I-4: Aa**, unaffected carriers: they have affected children.","of":[1]}]},{"q":"Middle generation","facts":[{"t":"**II-1, II-2 and II-3: Aa**, unaffected carriers; their affected father must pass a.","of":[100]},{"t":"**II-4: Aa**, unaffected carrier; she has an affected daughter.","of":[101]},{"t":"**II-5 and II-6: aa**, affected.","of":[102]},{"t":"**II-7: AA or Aa**, unaffected; the chart cannot distinguish them.","of":[103]}]},{"q":"Bottom generation","facts":[{"t":"**III-1: AA or Aa**, unaffected; among unaffected children of Aa × Aa, carrier probability is **2/3**.","of":[200]},{"t":"**III-2: aa**, affected.","of":[201]}]}]},"starred":true},{"id":"rep-harris-risk","caseId":"c15","heldKey":"c15:1","type":"essay","q":"For the two youngest Harris sisters, explain allele transmission and the risk of affected children. State the partner assumptions.","qt":"For the two youngest Harris sisters, explain allele transmission and the risk of affected children. State the partner assumptions.","imgs":["wb26-harris.png"],"note":"Passing an allele and having an affected child are different probabilities. Work out her genotype, the partner’s genotype, then combine one allele from each.","source":"Derived from the original Harris pedigree and Punnett squares; assumes Mendelian inheritance and the stated partner genotype. Not a lecturer-posted key.","supplement":true,"short":{"title":"Harris sisters: risk to children","hook":"","groups":[{"q":"Affected sister, aa","facts":[{"t":"She passes **a to every child**. An affected child also needs **a from the other parent**.","of":[0]},{"t":"With **AA partner: 0% affected**, all Aa carriers.","of":[1]},{"t":"With **Aa partner: 50% affected**; with **aa partner: 100% affected**.","of":[2]}]},{"q":"Unaffected sister, AA or Aa","facts":[{"t":"She may be **AA or Aa**; her carrier probability is **2/3**, given she is unaffected.","of":[100]},{"t":"If **AA**, none of her children will have CF; if **Aa**, each child has **50% chance of receiving a**.","of":[101]},{"t":"If she is **Aa with Aa partner: 25% affected** per pregnancy; with aa partner: 50%.","of":[102]},{"t":"Before her genotype is known, with a confirmed **Aa partner**, affected-child risk is **2/3 × 1/4 = 1/6**.","of":[103]}]}]},"starred":true},{"id":"rep-anderson","caseId":"c15","heldKey":"c15:2","type":"essay","q":"State every genotype and phenotype on the Anderson pedigree. H = dominant Huntington’s allele; h = unaffected allele. Use the chart’s affected/unaffected model.","qt":"State every genotype and phenotype on the Anderson pedigree. H = dominant Huntington’s allele; h = unaffected allele. Use the chart’s affected/unaffected model.","imgs":["wb26-anderson.png"],"note":"For this dominant pedigree, fill the unshaded people as hh first. Each shaded child with an hh parent must be Hh. This is the workbook model; real Huntington’s disease can have delayed symptom onset.","source":"Worked directly from the original Case Study Workbook 2026 S2 Anderson pedigree. Uses the simplified phenotype convention of the exercise; not a lecturer-posted key.","supplement":true,"short":{"title":"Anderson whānau: every genotype","hook":"","groups":[{"q":"Top generation","facts":[{"t":"**I-1: hh**, unaffected. **I-2: Hh**, affected; an unaffected child rules out HH.","of":[0]}]},{"q":"Middle generation","facts":[{"t":"**II-1, II-2, II-4 and II-6: hh**, unaffected.","of":[100]},{"t":"**II-3 and II-5: Hh**, affected; their father I-1 can only supply h.","of":[101]}]},{"q":"Bottom generation","facts":[{"t":"**III-1, III-2 and III-6: hh**, unaffected.","of":[200]},{"t":"**III-3, III-4 and III-5: Hh**, affected; each has one hh parent.","of":[201]}]}]},"starred":true},{"id":"rep-anderson-risk","caseId":"c15","heldKey":"c15:3","type":"essay","q":"For each of the six third-generation cousins, can they pass on the Huntington’s allele? Assume an unaffected hh partner.","qt":"For each of the six third-generation cousins, can they pass on the Huntington’s allele? Assume an unaffected hh partner.","imgs":["wb26-anderson.png"],"note":"One dominant H is sufficient in this exercise. Hh × hh produces half Hh and half hh. Each pregnancy is a new independent event.","source":"Derived from the original Anderson pedigree and Hh × hh Punnett square, with an unaffected partner. Not a lecturer-posted key.","supplement":true,"short":{"title":"Anderson cousins: risk to children","hook":"","groups":[{"q":"Cousins 1–3","facts":[{"t":"**III-1: hh → 0%** chance of passing H.","of":[0]},{"t":"**III-2: hh → 0%** chance of passing H.","of":[1]},{"t":"**III-3: Hh → 50%** chance of passing H per child.","of":[2]}]},{"q":"Cousins 4–6","facts":[{"t":"**III-4: Hh → 50%** chance of passing H per child.","of":[100]},{"t":"**III-5: Hh → 50%** chance of passing H per child.","of":[101]},{"t":"**III-6: hh → 0%** chance of passing H.","of":[102]}]}]},"starred":true},{"id":"q6f4168df8a","quiz":"211092","sys":"cases","mod":"cases","pts":3,"q":"The role of the axillary lymph nodes in the spread of cancer is [ Select ] . The Spread of cancer is known as [a], so if cancerous cells detach themselves from their origin (for tumor for example), and get into the lymphatic system they could potentially get to any part of the body. Checking the armpit lymph nodes, since the breast drains to them, can give an indication of whether cancer has spread. If they have no cancer cells, it shows that the cancer is [ Select ] . The swelling in Mary's right arm after mastectomy is a sign that [ Select ] .","imgs":["HS2DATA-668c28e1b4368fa2.png"],"qh":"<ol><li>The role of the axillary lymph nodes in the spread of cancer is [[BLANK:0]].<\/li><\/ol> <p>The Spread of cancer is known as [a], so if cancerous cells detach themselves from their origin (for tumor for example), and get into the lymphatic system they could potentially get to any part of the body. Checking the armpit lymph nodes, since the breast drains to them, can give an indication of whether cancer has spread. If they have no cancer cells, it shows that the cancer is [[BLANK:1]].<\/p> <p>The swelling in Mary's right arm after mastectomy is a sign that [[BLANK:2]].<\/p> <p><strong> [[IMG:HS2DATA-668c28e1b4368fa2.png]]<\/strong><\/p>","qt":"The role of the axillary lymph nodes in the spread of cancer is ____. The Spread of cancer is known as [a], so if cancerous cells detach themselves from their origin (for tumor for example), and get into the lymphatic system they could potentially get to any part of the body. Checking the armpit lymph nodes, since the breast drains to them, can give an indication of whether cancer has spread. If they have no cancer cells, it shows that the cancer is ____. The swelling in Mary's right arm after mastectomy is a sign that ____.","type":"cloze","bk":"dd","blanks":[{"label":"Answer 1:","options":["epigenetic","epistasis","mutated","metastasis"],"correct":"metastasis","ctx":"…nodes in the spread of cancer is"},{"label":"Answer 2:","options":["limited to the breast","not as aggressive","aggressive"],"correct":"limited to the breast","ctx":"…cells, it shows that the cancer is"},{"label":"Answer 3:","options":["she is drinking too much fluid","the cancer has spread","more lymph than usual is spreading from the arm","the lymph drainage is hampered by the surgery"],"correct":"the lymph drainage is hampered by the surgery","ctx":"…arm after mastectomy is a sign that"}],"caseId":"c2","note":null,"source":"Case Study Formative Test · Modules 1–2","starred":false},{"id":"q9d2af05550","quiz":"case-c3","sys":"resp","mod":"cases","cmod":"m1","type":"essay","pts":10,"q":"Her four lung micrographs, A to D (Case Study Workbook, case 3, “Images of different parts of the lungs”): name the part of the airway each one shows, and give its lining and whether cartilage and smooth muscle are present.","imgs":["wb26-lung4.png"],"qh":"<p>Her four lung micrographs, A to D (Case Study Workbook, case 3, “Images of different parts of the lungs”): name the part of the airway each one shows, and give its lining and whether cartilage and smooth muscle are present.<\/p>","qt":"Her four lung micrographs, A to D (Case Study Workbook, case 3, “Images of different parts of the lungs”): name the part of the airway each one shows, and give its lining and whether cartilage and smooth muscle are present.","saq":{"steps":["A — Trachea: lined with ciliated pseudostratified columnar epithelium.","Trachea: cartilage present; smooth muscles present.","B — Bronchus: lined with ciliated pseudostratified columnar epithelium (1).","Bronchus: smooth muscles present (2); cartilage present (3).","C — Bronchiole: lined with cuboidal epithelium.","Bronchiole: cartilage absent; smooth muscles present.","D — Alveoli: composed of mainly type 1 pneumocytes = squamous epithelium for gaseous exchange.","Alveoli: a smaller number of type 2 pneumocytes for surfactant production; macrophages to keep the alveoli clean.","Alveoli: no cartilage or muscles present.","The smooth muscles are relaxed by bronchodilators (the reliever); cortisol, daily (the preventer), reduces the inflammation."],"src":"Her answer · her Case Study Workbook 2026 S2, case 3 (the answers are in her own table under the four images), and her CASE STUDY LUNG HISTOLOGY FOR EXAM deck, slide 2, for the last line. The question wording and the A–D letters are the tool’s: the table is not starred, but her exam helpline links that deck under this case"},"scenario":"Exam case 3 · Asthma — Ane has had severe asthma since they were young. During a particularly bad asthma attack, Ane is experiencing difficulty breathing, particularly on the out-breath. Ane’s asthma is often triggered by small particles of pollen that manage to make their way into their lungs despite the protective features designed to keep them out. Ane makes sure to have their Salbutamol inhaler, which helps to relieve the symptoms of their asthma attack.","caseId":"c3","short":{"id":"c:c3:her four lung micrographs","title":"Four lung micrographs, A to D","hook":"Cartilage stops at the bronchiole; muscle stops at the alveoli.","groups":[{"q":"A · Trachea","facts":[{"t":"**Trachea**: **ciliated pseudostratified columnar** epithelium","of":[0]},{"t":"**Cartilage** present; **smooth muscles** present","of":[1]}]},{"q":"B · Bronchus","facts":[{"t":"**Bronchus**: **ciliated pseudostratified columnar** epithelium (1)","of":[2]},{"t":"**Smooth muscles** (2) and **cartilage** (3) present","of":[3]}]},{"q":"C · Bronchiole","facts":[{"t":"**Bronchiole**: **cuboidal** epithelium","of":[4]},{"t":"Cartilage **absent**; **smooth muscles** present","of":[5]}]},{"q":"D · Alveoli","facts":[{"t":"**Type 1 pneumocytes**: **squamous** epithelium for **gaseous exchange**","of":[6]},{"t":"**Type 2** for **surfactant**; **macrophages** keep them clean","of":[7]},{"t":"**No cartilage** or **muscles**","of":[8]}]},{"q":"The inhalers","facts":[{"t":"**Bronchodilators** relax the muscle (**reliever**); **cortisol** daily (**preventer**)","of":[9]}]}]},"note":"Move from the large conducting airways to tiny exchange surfaces. Support structures diminish along the route; alveoli need thin walls for diffusion. Use the actual pictures, not just the names in order.","source":"Her answer · her Case Study Workbook 2026 S2, case 3 (the answers are in her own table under the four images
