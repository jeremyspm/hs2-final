), and her CASE STUDY LUNG HISTOLOGY FOR EXAM deck, slide 2, for the last line. The question wording and the A–D letters are the tool’s: the table is not starred, but her exam helpline links that deck under this case","starred":false},{"id":"qa9d89d6a7d","quiz":"211092","sys":"cases","mod":"cases","pts":4,"q":"The term used to describe difficulty breathing is [ Select ] . The best answer would be: Ane’s breathing is made difficult because asthma makes the bronchi and bronchiole become obstructed by [ Select ] . An inhaler helps during an asthma attack because it makes the airways [ Select ] . One mechanism that the body uses to keep dust and small particles out of the lungs and formed by the pseudostratified columnar epithelium lining of the airways is the [ Select ] .","imgs":["HS2DATA-0e88b38bdc2cc23c.png"],"qh":"<p>[[IMG:HS2DATA-0e88b38bdc2cc23c.png]]<\/p> <ol><li>The term used to describe difficulty breathing is [[BLANK:0]].<\/li> <li>The best answer would be: Ane’s breathing is made difficult because asthma makes the bronchi and bronchiole become obstructed by [[BLANK:1]].<\/li> <li>An inhaler helps during an asthma attack because it makes the airways [[BLANK:2]].<\/li> <li>One mechanism that the body uses to keep dust and small particles out of the lungs and formed by the pseudostratified columnar epithelium lining of the airways is the [[BLANK:3]].<\/li><\/ol>","qt":"The term used to describe difficulty breathing is ____. The best answer would be: Ane’s breathing is made difficult because asthma makes the bronchi and bronchiole become obstructed by ____. An inhaler helps during an asthma attack because it makes the airways ____. One mechanism that the body uses to keep dust and small particles out of the lungs and formed by the pseudostratified columnar epithelium lining of the airways is the ____.","type":"cloze","bk":"dd","blanks":[{"label":"Answer 1:","options":["dyspnea","eupnoea","hyperventilation","hypoventilation"],"correct":"dyspnea","ctx":"…term used to describe difficulty breathing is"},{"label":"Answer 2:","options":["cartilage rings collapsing","the trachealis muscle contracting","excessive mucus prodction","swelling","swelling and mucus accumulation"],"correct":"swelling and mucus accumulation","ctx":"…the bronchi and bronchiole become obstructed by"},{"label":"Answer 3:","options":["constrict","dilate"],"correct":"dilate","ctx":"…asthma attack because it makes the airways"},{"label":"Answer 4:","options":["muco-ciliary escalator","hairs in the nostrils","sensitive carina","trachealis muscle"],"correct":"muco-ciliary escalator","ctx":"…epithelium lining of the airways is the"}],"caseId":"c3","note":null,"source":"Case Study Formative Test · Modules 1–2","starred":false},{"id":"q22116bfbd5","quiz":"case-c4","sys":"resp","mod":"cases","cmod":"m1","type":"essay","pts":2,"q":"Compare the tables you completed above – what do you notice?","imgs":[],"qh":"<p>Compare the tables you completed above – what do you notice?<\/p>","qt":"Compare the tables you completed above – what do you notice?","saq":{"steps":["Very similar processes: the bicarbonate buffer system.","CO₂ and H⁺ are linked: whatever happens to one, happens to the other."],"src":"Her answer · 2024 case-study model-answers deck (Lym Panic Asth Diab), slide 15 (her line under the table) · not starred, but inside her yellow exam case (her exam announcement: “Exam case studies are marked in yellow and starred”; her helpline: an unstarred question can still be asked, depending on marks)"},"scenario":"Exam case 4 · Panic attacks — Manaia lives with an anxiety disorder, which sometimes manifests in panic attacks that impact on her breathing. Manaia describes her panic attack as a time when she breathes really really hard and fast and cannot control her breathing at all. You know that there is a link between breathing and the pH of your blood because the respiratory system is one of the buffer systems of the body. You know that during a prolonged panic attack, Manaia might be at risk of what is called respiratory alkalosis, but you’ll need to remember why this is.","caseId":"c4","short":{"id":"c:c4:compare the tables you","title":"What the two tables share","hook":"CO₂ and H⁺ move TOGETHER.","groups":[{"q":"What you notice","facts":[{"t":"**Very similar processes**: the **bicarbonate buffer system**","of":[0]},{"t":"**CO₂** and **H⁺** are **linked**: whatever happens to **one** happens to the **other**","of":[1]}]}]},"note":"Both tables use the same reversible buffer relationship. What differs is the starting disturbance: breathing in the respiratory table, or a metabolic acid/base change in the metabolic table.","source":"Her answer · 2024 case-study model-answers deck (Lym Panic Asth Diab), slide 15 (her line under the table) · not starred, but inside her yellow exam case (her exam announcement: “Exam case studies are marked in yellow and starred”; her helpline: an unstarred question can still be asked, depending on marks)","starred":false},{"id":"q0572a11608","quiz":"case-c6","sys":"endo","mod":"cases","cmod":"m2","type":"essay","pts":3,"q":"What other molecules also influence blood glucose levels?","imgs":[],"qh":"<p>What other molecules also influence blood glucose levels?<\/p>","qt":"What other molecules also influence blood glucose levels?","saq":{"steps":["Glucagon stimulates the breakdown of glycogen (glycogenolysis).","Glucagon stimulates the breakdown of fats (lipolysis).","Glucagon stimulates the liver to promote gluconeogenesis: creating new glucose from non-glucose sources."],"src":"Her answer · 2024 case-study model-answers deck (Lym Panic Asth Diab), slide 31 · not starred, but inside her yellow exam case (her exam announcement: “Exam case studies are marked in yellow and starred”; her helpline: an unstarred question can still be asked, depending on marks)"},"scenario":"Exam case 6 · Diabetes — Larry has been recently diagnosed with Type 2 diabetes mellitus, an endocrine disorder, after what appears to be many years of uncontrolled hyperglycaemia. He must measure his blood sugar every as he works with his diabetes nurse to bring it under control, and he will also need to have insulin injections and other medications to help his blood glucose regulation. Larry is a little overwhelmed, and isn’t sure of what this insulin is for. As his nurse, you need a robust understanding of what insulin does in the body. Diabetes mellitus is a disease that involves the dysfunction of insulin and glucose regulation. There are two types, type 1 where the body fails to make insulin, and type 2 where the body is unable to respond to insulin when it is secreted.","caseId":"c6","short":{"id":"c:c6:what other molecules also","title":"What glucagon does to blood sugar","hook":"Glucagon RAISES BGL three ways: glycogen, fat, new glucose.","groups":[{"q":"Glucagon","facts":[{"t":"**Glucagon**: breaks down **glycogen** (**glycogenolysis**)","of":[0]},{"t":"Breaks down **fats** (**lipolysis**)","of":[1]},{"t":"Liver: **gluconeogenesis**, **new glucose** from **non-glucose** sources","of":[2]}]}]},"note":"Between meals the liver helps maintain blood glucose. Glucagon promotes glycogen breakdown and glucose production, raising blood glucose.","source":"Her answer · 2024 case-study model-answers deck (Lym Panic Asth Diab), slide 31 · not starred, but inside her yellow exam case (her exam announcement: “Exam case studies are marked in yellow and starred”; her helpline: an unstarred question can still be asked, depending on marks)","starred":false},{"id":"q17bb2237b5","quiz":"case-c6","sys":"endo","mod":"cases","cmod":"m2","type":"essay","pts":4,"q":"Insulin is designed to only be high after a meal, so in normal function it shows a pattern like the accompanying diagram. Can you describe the normal BGL over the day? What about insulin?","imgs":["wb26-bgl-day.png"],"qh":"<p>Insulin is designed to only be high after a meal, so in normal function it shows a pattern like the accompanying diagram. Can you describe the normal BGL over the day? What about insulin?<\/p>","qt":"Insulin is designed to only be high after a meal, so in normal function it shows a pattern like the accompanying diagram. Can you describe the normal BGL over the day? What about insulin?","saq":{"steps":["BGL changes over the day based on your meals (particularly around carbs and sugar).","There is a background insulin level: insulin is never at zero.","BGL is also never at zero: it stays in the normal range of blood glucose.","Basal insulin = background levels; bolus insulin = released or given after meals."],"src":"Her answer · 2024 case-study model-answers deck (Lym Panic Asth Diab), slide 33 · not starred, but inside her yellow exam case (her exam announcement: “Exam case studies are marked in yellow and starred”; her helpline: an unstarred question can still be asked, depending on marks)"},"scenario":"Exam case 6 · Diabetes — Larry has been recently diagnosed with Type 2 diabetes mellitus, an endocrine disorder, after what appears to be many years of uncontrolled hyperglycaemia. He must measure his blood sugar every as he works with his diabetes nurse to bring it under control, and he will also need to have insulin injections and other medications to help his blood glucose regulation. Larry is a little overwhelmed, and isn’t sure of what this insulin is for. As his nurse, you need a robust understanding of what insulin does in the body. Diabetes mellitus is a disease that involves the dysfunction of insulin and glucose regulation. There are two types, type 1 where the body fails to make insulin, and type 2 where the body is unable to respond to insulin when it is secreted.","caseId":"c6","short":{"id":"c:c6:insulin is designed to","title":"Glucose and insulin over a day","hook":"Spikes after MEALS; never zero; basal underneath, bolus on top.","groups":[{"q":"Over the day","facts":[{"t":"**BGL** follows your **meals** (**carbs** and **sugar**)","of":[0]},{"t":"**Background insulin**: insulin is **never at zero**","of":[1]},{"t":"BGL never zero either: stays in the **normal range**","of":[2]},{"t":"**Basal** = background; **bolus** = after **meals**","of":[3]}]}]},"note":"Read time along the horizontal axis. Meals cause glucose to rise, stimulating insulin. The response helps glucose return towards its usual range. Follow each curve rather than memorising its colour.","source":"Her answer · 2024 case-study model-answers deck (Lym Panic Asth Diab), slide 33 · not starred, but inside her yellow exam case (her exam announcement: “Exam case studies are marked in yellow and starred”; her helpline: an unstarred question can still be asked, depending on marks)","starred":false},{"id":"q3fab2a8864","quiz":"case-c6","sys":"endo","mod":"cases","cmod":"m2","type":"essay","pts":1,"q":"In normal blood sugar regulation, does BGL go above the normal range?","imgs":["wb26-bgl-day.png"],"qh":"<p>In normal blood sugar regulation, does BGL go above the normal range?<\/p>","qt":"In normal blood sugar regulation, does BGL go above the normal range?","saq":{"steps":["No: it should not exceed the normal range."],"src":"Her answer · 2024 case-study model-answers deck (Lym Panic Asth Diab), slide 33 · not starred, but inside her yellow exam case (her exam announcement: “Exam case studies are marked in yellow and starred”; her helpline: an unstarred question can still be asked, depending on marks)"},"scenario":"Exam case 6 · Diabetes — Larry has been recently diagnosed with Type 2 diabetes mellitus, an endocrine disorder, after what appears to be many years of uncontrolled hyperglycaemia. He must measure his blood sugar every as he works with his diabetes nurse to bring it under control, and he will also need to have insulin injections and other medications to help his blood glucose regulation. Larry is a little overwhelmed, and isn’t sure of what this insulin is for. As his nurse, you need a robust understanding of what insulin does in the body. Diabetes mellitus is a disease that involves the dysfunction of insulin and glucose regulation. There are two types, type 1 where the body fails to make insulin, and type 2 where the body is unable to respond to insulin when it is secreted.","caseId":"c6","short":{"id":"c:c6:in normal blood sugar","title":"Does BGL leave the normal range?","hook":"No.","groups":[{"q":"The answer","facts":[{"t":"**No**: it should not **exceed** the **normal range**","of":[0]}]}]},"note":"Answer from the case’s graph and the range specified in the source answer. A rise after food does not automatically mean diabetes.","source":"Her answer · 2024 case-study model-answers deck (Lym Panic Asth Diab), slide 33 · not starred, but inside her yellow exam case (her exam announcement: “Exam case studies are marked in yellow and starred”; her helpline: an unstarred question can still be asked, depending on marks)","starred":false},{"id":"q838ff03a2c","quiz":"case-c6","sys":"endo","mod":"cases","cmod":"m2","type":"essay","pts":2,"q":"What happens overnight? What could that mean for the morning?","imgs":["wb26-bgl-day.png"],"qh":"<p>What happens overnight? What could that mean for the morning?<\/p>","qt":"What happens overnight? What could that mean for the morning?","saq":{"steps":["BGL drops to its lowest overnight.","Breakfast is breaking the fast: you wake up hungry, as your body has run out of glycogen."],"src":"Her answer · 2024 case-study model-answers deck (Lym Panic Asth Diab), slide 34 · not starred, but inside her yellow exam case (her exam announcement: “Exam case studies are marked in yellow and starred”; her helpline: an unstarred question can still be asked, depending on marks)"},"scenario":"Exam case 6 · Diabetes — Larry has been recently diagnosed with Type 2 diabetes mellitus, an endocrine disorder, after what appears to be many years of uncontrolled hyperglycaemia. He must measure his blood sugar every as he works with his diabetes nurse to bring it under control, and he will also need to have insulin injections and other medications to help his blood glucose regulation. Larry is a little overwhelmed, and isn’t sure of what this insulin is for. As his nurse, you need a robust understanding of what insulin does in the body. Diabetes mellitus is a disease that involves the dysfunction of insulin and glucose regulation. There are two types, type 1 where the body fails to make insulin, and type 2 where the body is unable to respond to insulin when it is secreted.","caseId":"c6","short":{"id":"c:c6:what happens overnight what","title":"Overnight and the morning","hook":"Lowest at night; break the FAST in the morning.","groups":[{"q":"Overnight","facts":[{"t":"BGL is **lowest overnight**","of":[0]},{"t":"**Breakfast** = **breaking the fast**: hungry, **glycogen** run out","of":[1]}]}]},"note":"Without incoming food, stored fuel supports blood glucose. Glucagon helps the liver supply glucose between meals and overnight. Cortisol rises before waking, so the morning reading can sit a little higher (the dawn effect).","source":"Her answer · 2024 case-study model-answers deck (Lym Panic Asth Diab), slide 34 · not starred, but inside her yellow exam case (her exam announcement: “Exam case studies are marked in yellow and starred”; her helpline: an unstarred question can still be asked, depending on marks)","starred":false},{"id":"q4913c1cade","quiz":"case-c6","sys":"endo","mod":"cases","cmod":"m2","type":"essay","pts":3,"q":"When the body cells are resistant to the insulin signal, the pancreas tries to compensate by making MORE insulin, to make the signal meaningful again. Due to all this pancreas hyperactivity, damage and loss of function can occur, which means the pancreas now struggles to make enough insulin. What would happen in the body now? How might we need to intervene?","imgs":[],"qh":"<p>When the body cells are resistant to the insulin signal, the pancreas tries to compensate by making MORE insulin, to make the signal meaningful again. Due to all this pancreas hyperactivity, damage and loss of function can occur, which means the pancreas now struggles to make enough insulin. What would happen in the body now? How might we need to intervene?<\/p>","qt":"When the body cells are resistant to the insulin signal, the pancreas tries to compensate by making MORE insulin, to make the signal meaningful again. Due to all this pancreas hyperactivity, damage and loss of function can occur, which means the pancreas now struggles to make enough insulin. What would happen in the body now? How might we need to intervene?","saq":{"steps":["Pancreatic fatigue: damage to the pancreas from overworking.","Low insulin levels: impaired blood glucose regulation.","Type 2 diabetes mellitus: the person might end up on insulin."],"src":"Her answer · 2024 case-study model-answers deck (Lym Panic Asth Diab), slide 34 · not starred, but inside her yellow exam case (her exam announcement: “Exam case studies are marked in yellow and starred”; her helpline: an unstarred question can still be asked, depending on marks)"},"scenario":"Exam case 6 · Diabetes — Larry has been recently diagnosed with Type 2 diabetes mellitus, an endocrine disorder, after what appears to be many years of uncontrolled hyperglycaemia. He must measure his blood sugar every as he works with his diabetes nurse to bring it under control, and he will also need to have insulin injections and other medications to help his blood glucose regulation. Larry is a little overwhelmed, and isn’t sure of what this insulin is for. As his nurse, you need a robust understanding of what insulin does in the body. Diabetes mellitus is a disease that involves the dysfunction of insulin and glucose regulation. There are two types, type 1 where the body fails to make insulin, and type 2 where the body is unable to respond to insulin when it is secreted.","caseId":"c6","short":{"id":"c:c6:when the body cells","title":"When the pancreas tires","hook":"Overworked pancreas → too little insulin → type 2 on insulin.","groups":[{"q":"What happens","facts":[{"t":"**Pancreatic fatigue**: **damage** from **overworking**","of":[0]},{"t":"**Low insulin**: **impaired** glucose regulation","of":[1]},{"t":"**Type 2** diabetes: may end up **on insulin**","of":[2]}]}]},"note":"If insulin secretion cannot meet the body’s needs, glucose remains elevated in the blood. Link insufficient effective insulin to impaired glucose uptake and storage.","source":"Her answer · 2024 case-study model-answers deck (Lym Panic Asth Diab), slide 34 · not starred, but inside her yellow exam case (her exam announcement: “Exam case studies are marked in yellow and starred”; her helpline: an unstarred question can still be asked, depending on marks)","starred":false},{"id":"rep-insulin-day","caseId":"c6","heldKey":"c6:tutor","type":"essay","q":"When during the day is insulin highest, and when is it lowest? Explain why.","qt":"When during the day is insulin highest, and when is it lowest? Explain why.","imgs":[],"note":"Insulin tracks the glucose curve on her daily graph: peaks after each meal, a low flat line through the overnight fast.","source":"Asked on a past HS2 final, as recalled by student tutors (Oct 2026). Study answer compiled from the course learning pages; not a lecturer marking schedule.","supplement":true,"short":{"title":"When insulin is highest and lowest","hook":"","groups":[{"q":"Highest","facts":[{"t":"Highest **after meals**: rising blood glucose triggers the **beta cells**.","of":[0]},{"t":"This is the **bolus** (mealtime) release, peaking within about an hour of eating.","of":[1]}]},{"q":"Lowest","facts":[{"t":"Lowest **overnight** and before breakfast, while **fasting**.","of":[100]},{"t":"Only **basal** (background) insulin then; it is **never zero**.","of":[101]}]},{"q":"Why","facts":[{"t":"Insulin **follows blood glucose**: no food coming in, so little insulin is needed.","of":[200]},{"t":"**Glucagon** keeps glucose up overnight instead.","of":[201]}]}]},"starred":false},{"id":"q801b095ea3","quiz":"211092","sys":"cases","mod":"cases","pts":6,"q":"*Insulin's role in the liver is to stimulate it to stimulate [ Select ] . *Insulin's role in the muscle cells is to stimulate them to [ Select ] . *Insulin's role in the fat tissue is to stimulate [ Select ] . Gluconeogenesis and glycogenolysis are stimulated by the hormone (s) [ Select ] . Glycogenesis is stimulated by the hormone [ Select ] . Glycogenolysis is stimulated by the hormone [ Select ] .","imgs":["HS2DATA-b415a280511ea2ce.png"],"qh":"<p>[[IMG:HS2DATA-b415a280511ea2ce.png]]<\/p> <ol><li>*Insulin's role in the liver is to stimulate it to stimulate [[BLANK:0]].<\/li> <li>*Insulin's role in the muscle cells is to stimulate them to [[BLANK:1]].<\/li> <li>*Insulin's role in the fat tissue is to stimulate [[BLANK:2]].<\/li> <li>Gluconeogenesis and glycogenolysis are stimulated by the hormone (s) [[BLANK:3]].<\/li> <li>Glycogenesis is stimulated by the hormone [[BLANK:4]].<\/li> <li>Glycogenolysis is stimulated by the hormone [[BLANK:5]].<\/li><\/ol>","qt":"*Insulin's role in the liver is to stimulate it to stimulate ____. *Insulin's role in the muscle cells is to stimulate them to ____. *Insulin's role in the fat tissue is to stimulate ____. Gluconeogenesis and glycogenolysis are stimulated by the hormone (s) ____. Glycogenesis is stimulated by the hormone ____. Glycogenolysis is stimulated by the hormone ____.","type":"cloze","bk":"dd","blanks":[{"label":"Answer 1:","options":["form glucose from amino acids and fats","to form steroids","convert glycogen to glucose.","convert glucose to glycogen"],"correct":"convert glucose to glycogen","ctx":"…liver is to stimulate it to stimulate"},{"label":"Answer 2:","options":["start the cascade of reactions that would lead to insulin uptake","insert GLUT 4 receptors into the membrane to facilitate glucose uptake","open up their cytoplasm for glucose uptake","convert glucose to glycogen"],"correct":"insert GLUT 4 receptors into the membrane to facilitate glucose uptake","ctx":"…muscle cells is to stimulate them to"},{"label":"Answer 3:","options":["oxidation of lipids","lipolysis","lipogenesis"],"correct":"lipogenesis","ctx":"…in the fat tissue is to stimulate"},{"label":"Answer 4:","options":["parathyroid hormone","glucagon and epinephrine","calcitonin and thyroxine","insulin and glucagon"],"correct":"glucagon and epinephrine","ctx":"…glycogenolysis are stimulated by the hormone (s)"},{"label":"Answer 5:","options":["glucagon","lipase","glycogen","insulin"],"correct":"insulin","ctx":"Glycogenesis is stimulated by the hormone"},{"label":"Answer 6:","options":["insulin","glucagon","glycolysis"],"correct":"glucagon","ctx":"Glycogenolysis is stimulated by the hormone"}],"caseId":"c6","note":null,"source":"Case Study Formative Test · Modules 1–2","starred":false},{"id":"q65fcfbe6de","quiz":"case-c8","sys":"ms","mod":"cases","cmod":"m2","type":"essay","pts":2,"q":"The knee and hip are both synovial joints. What are the benefits to the body of a synovial joint?","imgs":[],"qh":"<p>The knee and hip are both synovial joints. What are the benefits to the body of a synovial joint?<\/p>","qt":"The knee and hip are both synovial joints. What are the benefits to the body of a synovial joint?","saq":{"steps":["Synovial joints are freely movable.","They are the most freely moving type of joint in the body: without synovial joints we would have very limited movement."],"src":"Her answer · her exam revision Kahoot, question 24 (“Both the shoulder (ball-and-socket) and the knee (hinge) are synovial joints which mean they are freely movable” — True); the second line is Emma’s answer (her co-lecturer, who set the exam) on Emma’s exam-prep page, “Recordings Module 2&3 Part 2 and Exam Prep”, which Hannetjie points the class to for exam revision · not starred, but inside her yellow exam case (her exam announcement: “Exam case studies are marked in yellow and starred”; her helpline: an unstarred question can still be asked, depending on marks)"},"scenario":"Exam case 8 · Joints and arthritis — Shannon is a 30-year-old woman that has had a series of issues with her joints. She has had bursitis in her hip in the past, and is now has presented mainly with pain in her knee and hip joints, as well as her hands. After consultation, she has recently been diagnosed with rheumatoid arthritis. She is concerned, as she feels she is too young to have arthritis, even though she is fairly active and has been an athlete most of her life. Part of the treatment plan that manage the joint includes the use of prednisone. Prednisone is a synthetic corticosteroid, similar to cortisol. Cortisol is part of the body’s long term stress response.","caseId":"c8","short":{"id":"c:c8:the knee and hip","title":"Why synovial joints matter","hook":"FREELY movable: without them, very little movement.","groups":[{"q":"Benefits","facts":[{"t":"Synovial joints are **freely movable**","of":[0]},{"t":"The **most freely moving** joints: without them, **very limited movement**","of":[1]}]}]},"note":"The joint permits movement while reducing friction and supporting load. Link the fluid-filled cavity and smooth surfaces to those benefits: free movement, low friction, shock absorption and stability.","source":"Her answer · her exam revision Kahoot, question 24 (“Both the shoulder (ball-and-socket) and the knee (hinge) are synovial joints which mean they are freely movable” — True); the second line is Emma’s answer (her co-lecturer, who set the exam) on Emma’s exam-prep page, “Recordings Module 2&3 Part 2 and Exam Prep”, which Hannetjie points the class to for exam revision · not starred, but inside her yellow exam case (her exam announcement: “Exam case studies are marked in yellow and starred”; her helpline: an unstarred question can still be asked, depending on marks)","starred":false},{"id":"q5b554b25dd","quiz":"case-c8","sys":"ms","mod":"cases","cmod":"m2","type":"essay","pts":2,"q":"What kind of synovial joint are the hip and knee? The shoulder and the elbow?","imgs":[],"qh":"<p>What kind of synovial joint are the hip and knee? The shoulder and the elbow?<\/p>","qt":"What kind of synovial joint are the hip and knee? The shoulder and the elbow?","saq":{"steps":["The shoulder and the hip are ball-and-socket joints: a ball moving in a socket.","The knee and the elbow are hinge joints: they can only open and close like a door."],"src":"Her answer · her 30 May 2024 case-study session (same Canvas page, the Joints & Arthritis video, where she also plays her exam revision Kahoot), 40:30 · not starred, but inside her yellow exam case (her exam announcement: “Exam case studies are marked in yellow and starred”; her helpline: an unstarred question can still be asked, depending on marks)"},"scenario":"Exam case 8 · Joints and arthritis — Shannon is a 30-year-old woman that has had a series of issues with her joints. She has had bursitis in her hip in the past, and is now has presented mainly with pain in her knee and hip joints, as well as her hands. After consultation, she has recently been diagnosed with rheumatoid arthritis. She is concerned, as she feels she is too young to have arthritis, even though she is fairly active and has been an athlete most of her life. Part of the treatment plan that manage the joint includes the use of prednisone. Prednisone is a synthetic corticosteroid, similar to cortisol. Cortisol is part of the body’s long term stress response.","caseId":"c8","short":{"id":"c:c8:what kind of synovial","title":"Hip, knee, shoulder, elbow: joint types","hook":"Ball-and-socket: shoulder, HIP. Hinge, like a door: KNEE, elbow.","groups":[{"q":"Types","facts":[{"t":"**Shoulder** and **hip**: **ball-and-socket**","of":[0]},{"t":"**Knee** and **elbow**: **hinge**, open and close like a **door**","of":[1]}]}]},"note":"Hip and shoulder are ball-and-socket joints with movement in several planes. Knee and elbow are taught as hinge joints here; the knee is more precisely a modified hinge.","source":"Her answer · her 30 May 2024 case-study session (same Canvas page, the Joints & Arthritis video, where she also plays her exam revision Kahoot), 40:30 · not starred, but inside her yellow exam case (her exam announcement: “Exam case studies are marked in yellow and starred”; her helpline: an unstarred question can still be asked, depending on marks)","starred":false},{"id":"q5c099e3af1","quiz":"case-c8","sys":"ms","mod":"cases","cmod":"m2","type":"essay","pts":2,"q":"What is bursitis?","imgs":[],"qh":"<p>What is bursitis?<\/p>","qt":"What is bursitis?","saq":{"steps":["A bursa is a lubricated, fluid-filled thin sac between bone and the surrounding soft tissue (tendons, muscles): a cushion to reduce friction.","In bursitis it becomes inflamed and swollen, and then it has the opposite effect (and it is painful)."],"src":"Her answer · her 30 May 2024 case-study session (same Canvas page, the Joints & Arthritis video, where she also plays her exam revision Kahoot), 1:13:35–1:15:09 (“inflammation of the bursa — associated with pain” is Emma’s answer (her co-lecturer, who set the exam) on Emma’s exam-prep page, “Recordings Module 2&3 Part 2 and Exam Prep”, which Hannetjie points the class to for exam revision) · not starred, but inside her yellow exam case (her exam announcement: “Exam case studies are marked in yellow and starred”; her helpline: an unstarred question can still be asked, depending on marks)"},"scenario":"Exam case 8 · Joints and arthritis — Shannon is a 30-year-old woman that has had a series of issues with her joints. She has had bursitis in her hip in the past, and is now has presented mainly with pain in her knee and hip joints, as well as her hands. After consultation, she has recently been diagnosed with rheumatoid arthritis. She is concerned, as she feels she is too young to have arthritis, even though she is fairly active and has been an athlete most of her life. Part of the treatment plan that manage the joint includes the use of prednisone. Prednisone is a synthetic corticosteroid, similar to cortisol. Cortisol is part of the body’s long term stress response.","caseId":"c8","short":{"id":"c:c8:what is bursitis","title":"Bursitis","hook":"A friction CUSHION that gets inflamed.","groups":[{"q":"The bursa","facts":[{"t":"**Bursa**: a **fluid-filled** **sac** between bone and soft tissue","of":[0]},{"t":"A **cushion** to reduce **friction**","of":[0]}]},{"q":"Bursitis","facts":[{"t":"**Inflamed** and **swollen**: the **opposite effect**, and painful","of":[1]}]}]},"note":"A bursa is a small fluid-filled sac that reduces friction between moving tissues. Inflammation of that sac is bursitis. Distinguish the bursa from the joint’s articular surfaces.","source":"Her answer · her 30 May 2024 case-study session (same Canvas page, the Joints & Arthritis video, where she also plays her exam revision Kahoot), 1:13:35–1:15:09 (“inflammation of the bursa — associated with pain” is Emma’s answer (her co-lecturer, who set the exam) on Emma’s exam-prep page, “Recordings Module 2&3 Part 2 and Exam Prep”, which Hannetjie points the class to for exam revision) · not starred, but inside her yellow exam case (her exam announcement: “Exam case studies are marked in yellow and starred”; her helpline: an unstarred question can still be asked, depending on marks)","starred":false},{"id":"qb6d1f8a469","quiz":"case-c8","sys":"ms","mod":"cases","cmod":"m2","type":"essay","pts":2,"q":"What might you say to Shannon about her concerns?","imgs":[],"qh":"<p>What might you say to Shannon about her concerns?<\/p>","qt":"What might you say to Shannon about her concerns?","saq":{"steps":["Rheumatoid arthritis is an autoimmune condition: it can hit at any age, so she is not too young for it.","It is not the wear and tear of osteoarthritis, which usually begins later in life."],"src":"Her answer · her 30 May 2024 case-study session (same Canvas page, the Joints & Arthritis video, where she also plays her exam revision Kahoot), 1:18:34 (“an autoimmune condition, it can hit at any age”), with her deck’s RA-vs-OA table (“It may begin any time in life” / “It usually begins later in life”) · not starred, but inside her yellow exam case (her exam announcement: “Exam case studies are marked in yellow and starred”; her helpline: an unstarred question can still be asked, depending on marks)"},"scenario":"Exam case 8 · Joints and arthritis — Shannon is a 30-year-old woman that has had a series of issues with her joints. She has had bursitis in her hip in the past, and is now has presented mainly with pain in her knee and hip joints, as well as her hands. After consultation, she has recently been diagnosed with rheumatoid arthritis. She is concerned, as she feels she is too young to have arthritis, even though she is fairly active and has been an athlete most of her life. Part of the treatment plan that manage the joint includes the use of prednisone. Prednisone is a synthetic corticosteroid, similar to cortisol. Cortisol is part of the body’s long term stress response.","caseId":"c8","short":{"id":"c:c8:what might you say","title":"What to tell Shannon","hook":"RA is autoimmune: ANY age.","groups":[{"q":"What to say","facts":[{"t":"**Rheumatoid arthritis** is **autoimmune**: it can hit at **any age**","of":[0]},{"t":"Not the **wear and tear** of osteoarthritis, which begins **later in life**","of":[1]}]}]},"note":"Translate the case explanation into understandable advice while retaining the specific points in the model answer. Explain the reason behind the advice.","source":"Her answer · her 30 May 2024 case-study session (same Canvas page, the Joints & Arthritis video, where she also plays her exam revision Kahoot), 1:18:34 (“an autoimmune condition, it can hit at any age”), with her deck’s RA-vs-OA table (“It may begin any time in life” / “It usually begins later in life”) · not starred, but inside her yellow exam case (her exam announcement: “Exam case studies are marked in yellow and starred”; her helpline: an unstarred question can still be asked, depending on marks)","starred":false},{"id":"rep-bursitis","caseId":"c8","heldKey":"c8:0","type":"essay","q":"Compare and contrast bursitis and arthritis.","qt":"Compare and contrast bursitis and arthritis.","imgs":[],"note":"Compare the anatomical site first, then the shared symptoms. The existing bursitis and arthritis answers supply the two sides.","source":"Compiled comparison from the existing case 8 answers and Hannetjie’s joint material; not a verbatim lecturer answer.","supplement":true,"short":{"title":"Bursitis compared with arthritis","hook":"","groups":[{"q":"Site and effect","facts":[{"t":"**Bursitis**: inflammation of a **bursa**, a friction-reducing sac outside the joint cavity.","of":[0]},{"t":"**Arthritis**: disease/inflammation of the **joint**, involving structures such as cartilage and synovium.","of":[1]},{"t":"Both can cause **pain**, **swelling** and **restricted movement**.","of":[2]},{"t":"Bursitis often follows **repetitive friction/pressure**; arthritis has different causes, including autoimmune and degenerative disease.","of":[3]}]}]},"starred":false},{"id":"q2c0b3dca7c","quiz":"211092","sys":"cases","mod":"cases","pts":6,"q":"1. The part labeled B in the diagram is known as [ Select ] and is responsible for [ Select ] the joint. 2. The part labeled G in the diagram is known as [ Select ] and is NOT responsible for [ Select ] the joint. 3. The labeled part that is affected primarily by arthritis is labelled [ Select ] . Osteoarthritis occurs most often in [ Select ] .","imgs":["HS2DATA-2fd796e4e30851c4.png"],"qh":"<p>[[IMG:HS2DATA-2fd796e4e30851c4.png]]<\/p> <p>1. The part labeled B in the diagram is known as [[BLANK:0]] and is responsible for [[BLANK:1]] the joint.<\/p> <p>2. The part labeled G in the diagram is known as [[BLANK:2]] and is NOT responsible for [[BLANK:3]] the joint.<\/p> <p>3. The labeled part that is affected primarily by arthritis is labelled [[BLANK:4]]. Osteoarthritis occurs most often in [[BLANK:5]].<\/p>","qt":"1. The part labeled B in the diagram is known as ____ and is responsible for ____ the joint. 2. The part labeled G in the diagram is known as ____ and is NOT responsible for ____ the joint. 3. The labeled part that is affected primarily by arthritis is labelled ____. Osteoarthritis occurs most often in ____.","type":"cloze","bk":"dd","blanks":[{"label":"Answer 1:","options":["joint capsule","synovial fluid","ligament","synovial membrane"],"correct":"synovial fluid","ctx":"…B in the diagram is known as"},{"label":"Answer 2:","options":["feeding the bone","lubricating","stabilising","strenthening"],"correct":"lubricating","ctx":"…known as ___ and is responsible for"},{"label":"Answer 3:","options":["fibrous cartilage","elastic cartilage","bony cartilage","hyaline cartilage"],"correct":"hyaline cartilage","ctx":"…G in the diagram is known as"},{"label":"Answer 4:","options":["absorbing shock","secreting synovial fluid","protecting the bone","making joint surfaces smooth"],"correct":"secreting synovial fluid","ctx":"…as ___ and is NOT responsible for"},{"label":"Answer 5:","options":["C","G","D","F"],"correct":"G","ctx":"…is affected primarily by arthritis is labelled"},{"label":"Answer 6:","options":["elderly because of wear and tear","younger people because of autoimmune conditions","younger people because of  wear and tear","elderly because of autoimmune conditions"],"correct":"elderly because of wear and tear","ctx":"…___ . Osteoarthritis occurs most often in"}],"caseId":"c8","note":null,"source":"Case Study Formative Test · Modules 1–2","starred":false},{"id":"q56f07a8c77","quiz":"case-c9","sys":"ns","mod":"cases","cmod":"m2","type":"essay","pts":3,"q":"Levodopa, which travels through the blood and into the brain is used as medication. Why not Dopamine itself?","imgs":[],"qh":"<p>Levodopa, which travels through the blood and into the brain is used as medication. Why not Dopamine itself?<\/p>","qt":"Levodopa, which travels through the blood and into the brain is used as medication. Why not Dopamine itself?","saq":{"steps":["To work on brain cells, a medication must be able to cross the blood-brain barrier.","Substances that are not lipid (fat) soluble cannot cross it, so they are useless in treating conditions of the brain.","Levodopa crosses into the brain and is made into dopamine there; dopamine itself does not cross the blood-brain barrier."],"src":"Her answer · her 30 May 2024 case-study session (same Canvas page, the Joints & Arthritis video, where she also plays her exam revision Kahoot), 53:58–54:58, for the first two lines (her Kahoot question 37: “Alcohol affects the brain because it can cross the blood-brain barrier” — True). The LAST line is the tool’s: she never says it outright · not starred, but inside her yellow exam case (her exam announcement: “Exam case studies are marked in yellow and starred”; her helpline: an unstarred question can still be asked, depending on marks)"},"scenario":"Exam case 9 · Neurotransmitters and the brain — Mr Paraone has been admitted to hospital after a fall and has reported they are having issues with mobility and tremors. Mr Paraone is later diagnosed with Parkinson’s disease. This is a brain disease where cells that normally make Dopamine, a neurotransmitter, start to die. One of the treatments to help control their symptoms is called Levodopa, which travels through the blood and into the brain to help to boost the brain’s Dopamine levels, so the neurons can continue to communicate properly via their synapses.","caseId":"c9","short":{"id":"c:c9:levodopa which travels through","title":"Why levodopa, not dopamine","hook":"Only what crosses the BLOOD-BRAIN BARRIER works on the brain.","groups":[{"q":"Why","facts":[{"t":"Must cross the **blood-brain barrier** to work on brain cells","of":[0]},{"t":"**Levodopa** uses an **amino-acid transporter** to cross the blood–brain barrier.","of":[1],"fix":"Clarifies the old key: lipid solubility is not the only route across. Source: NCBI Basic Neurochemistry, Blood–Brain Barrier, https://www.ncbi.nlm.nih.gov/books/NBK28180/"},{"t":"**Levodopa** crosses, becomes **dopamine**; dopamine itself **does not cross**","of":[2]}]}]},"note":"Levodopa crosses the blood–brain barrier and is converted to dopamine in the brain; dopamine does not readily cross. Levodopa uses an amino-acid transporter: the old answer’s blanket “not fat soluble = cannot cross” rule is too broad.","source":"Her answer · her 30 May 2024 case-study session (same Canvas page, the Joints & Arthritis video, where she also plays her exam revision Kahoot), 53:58–54:58, for the first two lines (her Kahoot question 37: “Alcohol affects the brain because it can cross the blood-brain barrier” — True). The LAST line is the tool’s: she never says it outright · not starred, but inside her yellow exam case (her exam announcement: “Exam case studies are marked in yellow and starred”; her helpline: an unstarred question can still be asked, depending on marks)","starred":false},{"id":"q51e1763fe8","quiz":"211092","sys":"cases","mod":"cases","pts":4,"q":"1. B is pointing towards a vesicle containing [ Select ] . 2. E shows [ Select ] . 3. The transport process moving neurotransmitters into the synaptic cleft is [ Select ] and over the synaptic cleft is [ Select ] .","imgs":["HS2DATA-bb4c6771e032d69a.png"],"qh":"<p>[[IMG:HS2DATA-bb4c6771e032d69a.png]]<\/p> <p>1. B is pointing towards a vesicle containing [[BLANK:0]].<\/p> <p>2. E shows [[BLANK:1]].<\/p> <p>3. The transport process moving neurotransmitters into the synaptic cleft is [[BLANK:2]] and over the synaptic cleft is [[BLANK:3]].<\/p>","qt":"1. B is pointing towards a vesicle containing ____. 2. E shows ____. 3. The transport process moving neurotransmitters into the synaptic cleft is ____ and over the synaptic cleft is ____.","type":"cloze","bk":"dd","blanks":[{"label":"Answer 1:","options":["Neurotransmitters such as serotonin, epinephrine or dopamine","Hormones such as epinephrin quiz":"211092","sys":"cases","mod":"cases","pts":13,"q":"3.1 3.2 3.3 3.4 A person who did not take any alcohol or drugs behaved like a drunk person after a motor accident. He was immediately tested for blood alcohol but the test came back negative. The brain part that could have been damaged is the cerebellum. A person breathes strangely after trauma to his head. The breathing is characterised by: • Prolonged, gasping inspirations • A pause at full inspiration • Inadequate or brief expiration The doctor in the ER suspects injury to the Pons because that is where the apneustic centre controlling the length of inspiration is situated. A person breathes strangely after falling down the stairs and resulting in trauma to his head. The breathing is characterised by: • Very slow breathing (bradypnea) • Shallow, ineffective breaths • Poor response to high CO₂ or low O₂ levels. The neurologist in the ER suspects partial injury to the Medulla Oblongata because it contains the pacemaker of the respiratory system. A person behaves strangely after a high speed motorbike accident. • Her left-and right- hand act independently • She has difficulty coordinating tasks where her hands must work together (e.g., tying shoelaces), • Her one hand behaves “unexpectedly” or in conflict with the other (alien hand phenomenon). The ER staff suspects injury to the corpus callosum . Where in this image is the Cerebellum situated? Guided answer -use labelled parts where possible: The cerebellum is situated directly posterior of the , directly inferior of the , directly superior of the . Where in this image is the Pons situated? Guided answer -use labelled parts where possible: The Pons is situated on the side of the brain stem, directly inferior of the where the is labelled, directly superior of the unlabelled and directly anterior of the . Where in this image is the Medulla oblongata situated? Guided answer -use labelled parts where possible: The Medulla oblongata is situated directly anterior of the , directly inferior of the unlabelled . Where in this image is the corpus callosum located? Guided answer -use labelled parts where possible: The Corpus callosum is situated directly superior of the anteriorly and, directly superior of the labelled posteriorly. It is inferior of the unlabelled .","imgs":["HS2DATA-1b8db19d94624658.png"],"qh":"<div class=\"tbl\"><div class=\"tr\"><div class=\"td\"><p>3.1<\/p><\/div> <div class=\"td\"><p>3.2<\/p><\/div> <div class=\"td\"><p>3.3<\/p><\/div> <div class=\"td\"><p>3.4<\/p><\/div><\/div> <div class=\"tr\"><div class=\"td\"><p>A person who did not take any alcohol or drugs behaved like a drunk person after a motor accident. He was immediately tested for blood alcohol but the test came back negative.<\/p> <p>The brain part that could have been damaged is the cerebellum.<\/p><\/div> <div class=\"td\"><p>A person breathes strangely after trauma to his head. The breathing is characterised by:<br>• Prolonged, gasping inspirations<br>• A pause at full inspiration<br>• Inadequate or brief expiration<\/p> <p>The doctor in the ER suspects injury to the Pons because that is where the apneustic centre controlling the length of inspiration is situated.<\/p><\/div> <div class=\"td\"><p>A person breathes strangely after falling down the stairs and resulting in trauma to his head. The breathing is characterised by:<\/p> <p>• Very slow breathing (bradypnea)<br>• Shallow, ineffective breaths<br>• Poor response to high CO₂ or low O₂ levels.<br>The neurologist in the ER suspects partial injury to the Medulla<br>Oblongata because it contains the pacemaker of the respiratory system.<\/p><\/div> <div class=\"td\"><p>A person behaves strangely after a high speed motorbike accident.<\/p> <p>• Her left-and right- hand act independently<br>• She has difficulty coordinating tasks where her hands must work together (e.g., tying shoelaces),<br>• Her one hand behaves “unexpectedly” or in conflict with the other (alien hand phenomenon).<\/p> <p>The erised by: • Prolonged, gasping inspirations • A pause at full inspiration • Inadequate or brief expiration The doctor in the ER suspects injury to the Pons because that is where the apneustic centre controlling the length of inspiration is situated. A person breathes strangely after falling down the stairs and resulting in trauma to his head. The breathing is characterised by: • Very slow breathing (bradypnea) • Shallow, ineffective breaths • Poor response to high CO₂ or low O₂ levels. The neurologist in the ER suspects partial injury to the Medulla Oblongata because it contains the pacemaker of the respiratory system. A person behaves strangely after a high speed motorbike accident. • Her left-and right- hand act independently • She has difficulty coordinating tasks where her hands must work together (e.g., tying shoelaces), • Her one hand behaves “unexpectedly” or in conflict with the other (alien hand phenomenon). The ER staff suspects injury to the corpus callosum. Where in this image is the Cerebellum situated? Guided answer -use labelled parts where possible: The cerebellum is situated directly posterior of the ____, directly inferior of the ____, directly superior of the ____. Where in this image is the Pons situated? Guided answer -use labelled parts where possible: The Pons is situated on the ____ side of the brain stem, directly inferior of the ____ where the ____ is labelled, directly superior of the unlabelled ____ and directly anterior of the ____. Where in this image is the Medulla oblongata situated? Guided answer -use labelled parts where possible: The Medulla oblongata is situated directly anterior of the ____, directly inferior of the unlabelled ____. Where in this image is the corpus callosum located? Guided answer -use labelled parts where possible: The Corpus callosum is situated directly superior of the ____ anteriorly and, directly superior of the labelled ____ posteriorly. It is inferior of the unlabelled ____.","type":"cloze","bk":"fib","blanks":[{"label":"Answer 1:","options":["4th ventricle","fourth ventricle"],"correct":"fourth ventricle","ctx":"…cerebellum is situated directly posterior of the"},{"label":"Answer 2:","options":["inferior colliculus"],"correct":"inferior colliculus","ctx":"…the ___ , directly inferior of the"},{"label":"Answer 3:","options":["reticular formation"],"correct":"reticular formation","ctx":"…the ___ , directly superior of the"},{"label":"Answer 4:","options":["anterior"],"correct":"anterior","ctx":"The Pons is situated on the"},{"label":"Answer 5:","options":["mid brain"],"correct":"mid brain","ctx":"…the brain stem, directly inferior of the"},{"label":"Answer 6:","options":["inferior colliculus"],"correct":"inferior colliculus","ctx":"…directly inferior of the ___ where the"},{"label":"Answer 7:","options":["Medulla Oblongata"],"correct":"Medulla Oblongata","ctx":"…is labelled, directly superior of the unlabelled"},{"label":"Answer 8:","options":["4th ventricle","fourth ventricle"],"correct":"fourth ventricle","ctx":"…unlabelled ___ and directly anterior of the"},{"label":"Answer 9:","options":["reticular formation","cerebellum"],"correct":"cerebellum","ctx":"…oblongata is situated directly anterior of the"},{"label":"Answer 10:","options":["pons"],"correct":"pons","ctx":"…___ , directly inferior of the unlabelled"},{"label":"Answer 11:","options":["lateral ventricle"],"correct":"lateral ventricle","ctx":"…callosum is situated directly superior of the"},{"label":"Answer 12:","options":["fornix"],"correct":"fornix","ctx":"…anteriorly and, directly superior of the labelled"},{"label":"Answer 13:","options":["cingulate gyrus","cerebrum","cingulate gyrus of cerebrum"],"correct":"cingulate gyrus of cerebrum","ctx":"…posteriorly. It is inferior of the unlabelled"}],"caseId":"c10","note":null,"source":"Case Study Formative Test · Modules 1–2","starred":false},{"id":"rep-male-pill","caseId":"c13","heldKey":"c13:research","type":"essay","q":"The workbook asks you to research a male contraceptive pill. How could a hormonal approach work?","qt":"The workbook asks you to research a male contraceptive pill. How could a hormonal approach work?","imgs":[],"note":"Use the male hormonal pathway you already know: pituitary LH/FSH control the testes. The research aim is to interrupt sperm production while preserving other androgen-dependent functions.","source":"Workbook research prompt; study explanation supported by NICHD Contraceptive Development Program, https://www.nichd.nih.gov/about/org/diphr/officebranch/cdp/research/contraception_men . Describes the research mechanism, not a prescription or claim of clinical availability.","supplement":true,"short":{"title":"Male contraceptive pill: the research idea","hook":"","groups":[{"q":"Hormonal research","facts":[{"t":"Suppress **LH and FSH** through negative feedback to reduce **testicular testosterone and sperm production**.","of":[0]},{"t":"An **androgen component** maintains other testosterone-dependent functions while sperm production is suppressed.","of":[1]},{"t":"**DMAU** is an oral research candidate with androgenic and progestogenic actions. Research must establish contraceptive effectiveness, safety and **reversibility**.","of":[2]}]}]},"starred":false},{"id":"rep-depo","caseId":"c13","heldKey":"c13:tutor","type":"essay","q":"Rose has been on the Depo Provera injection. How does it prevent pregnancy?","qt":"Rose has been on the Depo Provera injection. How does it prevent pregnancy?","imgs":[],"note":"Depo Provera is a long-acting version of the progesterone method. Learn the three effects together; the past exam asked for all three.","source":"Asked on a past HS2 final, as recalled by student tutors (Oct 2026). Study answer compiled from the course learning pages; not a lecturer marking schedule.","supplement":true,"short":{"title":"How Depo Provera prevents pregnancy","hook":"","groups":[{"q":"What it is","facts":[{"t":"A **progestogen** injection, given about every **3 months**.","of":[0]}]},{"q":"Three effects","facts":[{"t":"**Prevents ovulation**: negative feedback suppresses **FSH and LH**.","of":[100]},{"t":"**Thickens cervical mucus**: sperm cannot get through.","of":[101]},{"t":"**Thins the endometrium**: implantation is less likely.","of":[102]}]},{"q":"For Rose","facts":[{"t":"Fertility can take **months** to return after the last injection, sometimes over a year.","of":[200]}]}]},"starred":false},{"id":"rep-male-glands","caseId":"c13","heldKey":"c13:tutor","type":"essay","q":"Name the male accessory glands, where they are, and what each adds to semen.","qt":"Name the male accessory glands, where they are, and what each adds to semen.","imgs":[],"note":"Her material says both the seminal vesicles and the bulbourethral glands secrete alkaline fluid. Read the stem: fructose or most of the volume means seminal vesicles; neutralising the urethra before ejaculation means bulbourethral.","source":"Asked on a past HS2 final, as recalled by student tutors (Oct 2026). Study answer compiled from the course learning pages; not a lecturer marking schedule.","supplement":true,"short":{"title":"The male accessory glands","hook":"","groups":[{"q":"Seminal vesicles","facts":[{"t":"Paired glands behind the bladder: the **largest share** of semen (about 60%).","of":[0]},{"t":"**Alkaline** fluid rich in **fructose**, the sperm’s fuel, and **prostaglandins**.","of":[1]}]},{"q":"Prostate","facts":[{"t":"**Walnut-sized**, **inferior to the bladder**, encircling the urethra.","of":[100]},{"t":"Milky, slightly **acidic** fluid, about **30%** of semen.","of":[101]}]},{"q":"Bulbourethral glands","facts":[{"t":"**Cowper’s** glands: pea-sized, **inferior to the prostate**.","of":[200]},{"t":"Clear **alkaline mucus** that **neutralises** acidic urine traces and lubricates.","of":[201]}]}]},"starred":false},{"id":"rep-s-cones","caseId":"c14","heldKey":"c14:tutor","type":"essay","q":"Name the three types of cone and the colour each detects. Which is faulty in blue colour blindness?","qt":"Name the three types of cone and the colour each detects. Which is faulty in blue colour blindness?","imgs":[],"note":"Name a cone by its wavelength: long, medium, short. Only red–green colour blindness follows Simon’s X-linked pattern.","source":"Asked on a past HS2 final, as recalled by student tutors (Oct 2026). Study answer compiled from the course learning pages; not a lecturer marking schedule.","supplement":true,"short":{"title":"The three cone types","hook":"","groups":[{"q":"Cones","facts":[{"t":"**L cones**: **red**, long wavelength.","of":[0]},{"t":"**M cones**: **green**, medium wavelength.","of":[1]},{"t":"**S cones**: **blue**, short wavelength.","of":[2]}]},{"q":"Colour blindness","facts":[{"t":"Red–green: faulty **L or M** cones, **X-linked** recessive.","of":[100]},{"t":"Blue (tritan): faulty **S cones**; **autosomal**, so not linked to the X, and rare.","of":[101]}]}]},"starred":false},{"id":"q0bb9168466","quiz":"rg-2024","sys":"gen","mod":"cases","cmod":"m3","type":"mcq","pts":1,"q":"What would Simon's mum's genotype have been and why do you say so?","qh":"<p>What would Simon's mum's genotype have been and why do you say so?<\/p>","qt":"What would Simon's mum's genotype have been and why do you say so?","imgs":[],"opts":["XbXb - she inherited the recessive allele from her father","XBXB - she is not colourblind - the condition is recessive","XbXB - she is not colourblind","XbXb - she inherited the recessive allele from both her parents","XbXB - she carried it over to Simon but her normal XB gave her normal vision"],"key":["XbXB - she carried it over to Simon but her normal XB gave her normal vision"],"scenario":"Exam case 14 · RG colour blindness — Simon is colour blind, a condition which affects his ability to distinguish between colours, with the most impact on red and green. He has expressed an interest in understanding why he has the disease, but neither of his parents do. He’s also heard that it is more common in males and so is wondering if he will pass this disease onto any sons he might have.","refs":[{"k":"her","t":"She’s a carrier… She carried it over to Simon, but her normal XB gives her normal vision… if she’s not colourblind, she could just as well have been that one also. That this is not enough reason. This is the right one.","src":"her recorded 31 May 2024 case session, 1:05:25 — her RG colour-blindness quiz, Q3, which she answers aloud and scores 10/10"}],"caseId":"c14","note":null,"source":"Her RG colour-blindness quiz (2024, read off her recorded session)","starred":false},{"id":"q6b53df75d1","quiz":"rg-2024","sys":"gen","mod":"cases","cmod":"m3","type":"mcq","pts":1,"q":"Will Simon pass on red-green colour-blindness to his children? How?","qh":"<p>Will Simon pass on red-green colour-blindness to his children? How?<\/p>","qt":"Will Simon pass on red-green colour-blindness to his children? How?","imgs":[],"opts":["No, to none of his children","Yes to all his sons who will be colourblind","Yes to all his daughters who will all be colour-blind","To none of his sons, but to all his daughters who will be unaffected carriers","Yes to all his children who will be colourblind"],"key":["To none of his sons, but to all his daughters who will be unaffected carriers"],"scenario":"Exam case 14 · RG colour blindness — Simon is colour blind, a condition which affects his ability to distinguish between colours, with the most impact on red and green. He has expressed an interest in understanding why he has the disease, but neither of his parents do. He’s also heard that it is more common in males and so is wondering if he will pass this disease onto any sons he might have.","refs":[{"k":"her","t":"He give his daughters an X… he cannot pass it on to his sons… To none of his sons, but to all his daughters who will be unaffected carriers. That’s right.","src":"her recorded 31 May 2024 case session, 1:06:22 — her RG colour-blindness quiz, Q4, which she answers aloud and scores 10/10"}],"cas
