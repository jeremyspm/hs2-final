<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HS2 · Paper Sim — Final exam</title>
<meta name="robots" content="noindex,nofollow">
<style>
/* ── estate tokens (house.css contract, dark default) ─────────────── */
:root{
  --bg:hsl(225 33% 5%); --fg:hsl(225 31% 95%); --card:hsl(224 44% 10%);
  --primary:hsl(218 91% 64%); --onprimary:hsl(225 33% 5%);
  --muted:hsl(220 38% 13%); --muted-fg:hsl(218 19% 67%);
  --accent:hsl(219 40% 18%); --danger:hsl(0 84% 60%); --ok:hsl(158 64% 42%);
  --warn:hsl(38 92% 55%); --border:hsl(222 27% 19%); --radius:.625rem;
  --dur:200ms; --ease:cubic-bezier(.4,0,.2,1);
}
:root[data-theme=light]{
  --bg:hsl(214 47% 97%); --fg:hsl(222 47% 11%); --card:hsl(0 0% 100%);
  --onprimary:#fff; --muted:hsl(215 40% 93%); --muted-fg:hsl(220 12% 40%);
  --accent:hsl(216 45% 91%); --border:hsl(215 33% 89%); --warn:hsl(38 92% 40%);
}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--fg);
  font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;padding:10px 14px}
header h1{font-size:1rem;margin:0;flex:1;font-weight:700}
header .d{color:var(--muted-fg);font-size:.8rem;white-space:nowrap}
/* phone: title over countdown on the left, buttons full height on the right (was one flex row: the title got squeezed to a word per line) */
@media(max-width:560px){
  header{display:grid;grid-template-columns:minmax(0,1fr);grid-auto-columns:auto;gap:0 8px;padding:8px 12px}
  header h1{grid-area:1/1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header .d{grid-area:2/1;white-space:normal;font-size:.76rem;line-height:1.3}
  header .btn{grid-row:1/span 2;padding:8px 10px;min-width:40px}
}
main{max-width:720px;margin:0 auto;padding:14px 14px 90px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px;margin:0 0 12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;
  border:1px solid var(--border);background:var(--muted);color:var(--fg);
  border-radius:var(--radius);padding:10px 14px;font:inherit;font-weight:600;
  transition:background var(--dur) var(--ease)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--onprimary)}
.btn.ghost{background:transparent}
.btn.wide{width:100%;margin-top:8px}
a.btn{text-decoration:none}
.btn:disabled{opacity:.45;cursor:default}
.door h2{margin:.1rem 0 .3rem;font-size:1.02rem}
.door p{margin:.2rem 0 .6rem;color:var(--muted-fg);font-size:.88rem}
.qlist{display:flex;flex-direction:column;gap:6px;margin-top:8px}
/* a quiz row: tag + name, then count + Learn + Sit as one group that drops to a
   second line at phone width instead of squeezing the name into four lines */
.qrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;border:1px solid var(--border);
  border-radius:var(--radius);padding:8px 10px;background:var(--muted)}
.qrow b{flex:1 1 150px;font-size:.86rem;font-weight:600}
.qrow .m{color:var(--muted-fg);font-size:.76rem;white-space:nowrap}
.qrow .acts{margin-left:auto;display:flex;gap:6px;align-items:center}
.sysrow{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 2px}
/* quiz selection: tick any rows (or a whole system) and the bottom bar runs them as one */
.qrow{cursor:pointer}
.qrow.on{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.qrow>input.pk{flex:0 0 auto;width:18px;height:18px;margin:0;accent-color:var(--primary);cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0 4px;font-size:.8rem;color:var(--muted-fg)}
.chip{border:1px solid var(--border);border-radius:99px;padding:4px 11px;background:transparent;color:var(--fg);
  cursor:pointer;font:inherit;font-size:.8rem;font-weight:600;line-height:1.3}
.chip.on{background:var(--primary);border-color:var(--primary);color:var(--onprimary)}
.footbar .btn.x{flex:0 0 auto}
/* ── focus checklist ─────────────────────────────────────────────────── */
.fhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;margin:2px 0 8px}
.fbar{height:6px;border-radius:99px;background:var(--accent);overflow:hidden;flex:1 1 140px;min-width:120px}
.fbar i{display:block;height:100%;background:var(--ok);transition:width .25s}
.ftier{font-weight:700;font-size:.82rem;margin:14px 0 6px;display:flex;align-items:center;gap:8px}
.ftier b{font-weight:700}
.ftier .fnum{font-weight:400;color:var(--muted-fg)}
.frow{display:flex;gap:9px;align-items:flex-start;padding:8px 10px;margin-bottom:6px;
  border:1px solid var(--border);border-radius:var(--radius);background:var(--muted);
  border-left:3px solid var(--tc,var(--border))}
.frow.on{opacity:.62}
.frow.on .ft{text-decoration:line-through}
.frow>input.fchk{flex:0 0 auto;width:18px;height:18px;margin-top:2px;accent-color:var(--ok);cursor:pointer}
.fbody{flex:1 1 auto;min-width:0}
.fbody>summary{cursor:pointer;list-style:none;display:block}
.fbody>summary::-webkit-details-marker{display:none}
.ft{font-weight:650;font-size:.92rem;display:block}
.fmeta{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.fchip{font-size:.68rem;padding:1px 7px;border-radius:99px;background:var(--accent);color:var(--muted-fg);white-space:nowrap}
.fchip.her{background:hsl(38 92% 55% / .18);color:var(--warn)}
.fchip.tape{background:hsl(0 84% 60% / .16);color:var(--danger)}
.fchip.saq{background:hsl(218 91% 64% / .16);color:var(--primary)}
.fchip.sys{background:transparent;border:1px solid var(--border)}
.fchip.hl{background:hsl(158 64% 42% / .2);color:var(--ok);font-weight:650}
.fchip.rev{background:hsl(158 64% 42% / .12);color:var(--ok)}
.fchip.kh{background:hsl(280 60% 60% / .16);color:hsl(280 70% 72%)}
.hlans{margin-top:8px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);overflow:hidden}
.hlans>summary{cursor:pointer;padding:7px 10px;font-weight:650;font-size:.84rem;color:var(--ok);list-style:none}
.hlans>summary::-webkit-details-marker{display:none}
.hlans .hlbody{padding:0 10px 10px;font-size:.83rem;line-height:1.55;white-space:pre-wrap}
.hlans .hlh{font-weight:700;margin:8px 0 4px;font-size:.8rem;letter-spacing:.02em}
.fdet{font-size:.85rem;line-height:1.5;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.fdet p{margin:0 0 7px}
.fdet .fcap{color:var(--muted-fg)}
.fwhy{font-size:.8rem;line-height:1.5;color:var(--muted-fg);margin:0 0 4px}
@media(max-width:400px){ .ft{font-size:.88rem} .fdet{font-size:.82rem} }
.tag{font-size:.72rem;padding:2px 8px;border-radius:99px;background:var(--accent);color:var(--muted-fg)}
.tag.repro{color:hsl(335 85% 72%)}.tag.gen{color:hsl(268 80% 74%)}.tag.senses{color:hsl(38 92% 62%)}
.tag.cvs{color:hsl(0 84% 70%)}.tag.resp{color:hsl(199 89% 64%)}.tag.lymph{color:hsl(140 55% 58%)}
.tag.ms{color:hsl(28 90% 62%)}.tag.ns{color:hsl(268 80% 74%)}.tag.endo{color:hsl(158 64% 52%)}
.qmod{margin:14px 0 4px;font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-fg)}
.tag.mixed{color:var(--muted-fg)}
/* sitting */
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.qhead .n{font-weight:700}
.qhead .timer{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted-fg)}
.qhead .timer.low{color:var(--danger);font-weight:700}
.stem{white-space:pre-wrap;margin-bottom:10px}
.stem img,.qimg{max-width:100%;border-radius:8px;background:#fff;display:block;margin:8px 0}
/* structured stem: her paragraphs, lists and table rows survive; a Canvas layout
   table becomes stacked cells at phone width and side-by-side from 560px */
.stem.rich{white-space:normal;line-height:1.5}
.stem.rich p{margin:.4em 0}
.stem.rich ul,.stem.rich ol{margin:.3em 0;padding-left:1.35em}
.stem.rich li{margin:.15em 0}
.stem.rich li>p{margin:.1em 0}
.stem.rich div{margin:.15em 0}
.stem.rich .tbl{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.stem.rich .tr{display:flex;flex-wrap:wrap;gap:8px 14px;border:1px solid var(--border);border-radius:8px;padding:8px 10px;background:var(--muted)}
.stem.rich .td{flex:1 1 220px;min-width:0}
.stem.rich .td>p:first-child{margin-top:0}
.stem.rich .td img{margin:0 0 4px;max-height:280px;width:auto}
.stem.rich img{max-height:520px;width:auto}
.inl{display:inline-block;width:auto;max-width:100%;padding:5px 8px;margin:2px 0;vertical-align:baseline;
  font-size:.95em;border:1px solid var(--primary);background:var(--card);color:var(--fg);border-radius:6px}
input.inl{min-width:7ch}
.inl:focus{outline:2px solid var(--primary);outline-offset:1px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);
  border-radius:var(--radius);padding:10px;margin:6px 0;cursor:pointer;background:var(--muted)}
.opt input{margin-top:3px;flex:none}
.opt.sel{border-color:var(--primary);background:var(--accent)}
/* learn mode: a checked question locks and colours itself in place */
.opt.k{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.opt.x{border-color:var(--danger);box-shadow:inset 0 0 0 1px var(--danger)}
.opt.lock{cursor:default}
.lres{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 0}
.lres .hint{font-size:.76rem;color:var(--muted-fg)}
.lres .qr-pane{flex-basis:100%;padding:6px 0 0}
.mk .verdict{font-weight:700;margin:0 0 4px}
.mk.right .verdict{color:var(--ok)} .mk.wrong .verdict{color:var(--danger)} .mk.saq{border-color:var(--primary)}
.pip.ok{background:var(--ok);border-color:var(--ok)} .pip.bad{background:var(--danger);border-color:var(--danger)}
.qrow .btn{padding:6px 10px;font-size:.8rem}
.qrow .btn.learn{border-color:var(--primary);color:var(--primary)}
.blankrow{display:flex;flex-direction:column;gap:4px;margin:8px 0}
.blankrow label{font-size:.82rem;color:var(--muted-fg)}
select,input[type=text],textarea{font:inherit;color:var(--fg);background:var(--muted);
  border:1px solid var(--border);border-radius:8px;padding:9px;width:100%}
textarea{min-height:120px}
.pips{display:flex;gap:3px;flex-wrap:wrap;margin:10px 0 2px}
.pip{width:14px;height:6px;border-radius:3px;background:var(--muted);border:1px solid var(--border)}
.pip.done{background:var(--primary);border-color:var(--primary)}
.pip.cur{outline:2px solid var(--primary);outline-offset:1px}
/* marking */
.mk{border-left:4px solid var(--border);padding-left:10px;margin:14px 0}
.mk.right{border-color:var(--ok)}.mk.wrong{border-color:var(--danger)}
.mk .you{color:var(--muted-fg);font-size:.9rem}
.mk .keyline{color:var(--ok);font-weight:600}
.mk .marks{font-size:.8rem;color:var(--muted-fg)}
.steps label{display:flex;gap:8px;align-items:flex-start;margin:6px 0;cursor:pointer}
.refq{font-size:.85rem;color:var(--muted-fg);margin:8px 0 2px;padding:8px 10px;background:var(--muted);border-radius:8px}
.refq.slide{padding:6px}
.refq.patton{border-left:3px solid var(--primary)}
.refq i{color:var(--fg)}
.slideimg{max-width:100%;background:#fff;border-radius:6px;display:block;margin:0 0 4px}
.keyrows{margin:6px 0}
.krow{font-size:.85rem;padding:3px 0;border-bottom:1px dashed var(--border)}
.krow b{color:var(--ok);font-weight:600}
.krow.kok{opacity:.55}
.kyou{color:var(--danger);font-size:.78rem}
.kref{font-size:.84rem;color:var(--muted-fg);margin:4px 0 6px 14px;padding:6px 10px;background:var(--muted);border-radius:8px;line-height:1.45}
.kref i{color:var(--fg)}
.kref .refsrc{display:inline}
.refsrc{font-size:.74rem;color:var(--muted-fg);opacity:.8}
.vidrow{font-size:.86rem;margin:6px 0}
.vidrow a{font-weight:600}
.askai{padding:3px 10px;font-size:.76rem;margin-top:6px}
.learnrow{padding:7px 12px;font-size:.84rem;margin-top:6px}
.aiwrap{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;margin:8px 0 4px}
.aitext{flex-basis:100%;width:100%;min-height:150px;font-size:.78rem;margin-top:6px}
.aisplit{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin-top:6px}
.aisplit .askai{margin-top:0}
.vclip{margin:.5rem 0}
.vframe{position:relative;aspect-ratio:16/9;width:100%;max-width:460px;background:#000;border-radius:8px;overflow:hidden;cursor:pointer}
.vframe img,.vframe iframe{width:100%;height:100%;display:block;border:0;object-fit:cover}
.vplay{position:absolute;inset:0;margin:auto;width:54px;height:54px;border-radius:50%;background:rgba(20,20,28,.72);color:#fff;border:2px solid #fff;font-size:1.3rem;cursor:pointer;line-height:1}
.vbadge{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.8);color:#fff;font-size:.72rem;padding:2px 6px;border-radius:4px;pointer-events:none}
.vmeta{font-size:.82rem;margin-top:5px;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.vch{font-weight:600}
.vfull{padding:2px 8px;font-size:.74rem}
.rev-ctl{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:6px 0 10px;font-size:.85rem}
.rev-ctl .wo{display:flex;gap:6px;align-items:center;cursor:pointer;user-select:none}
.systally{display:flex;flex-wrap:wrap}
.systally .tag{display:inline-block;background:var(--muted);padding:2px 9px;border-radius:11px;margin:2px 5px 2px 0;font-size:.74rem}
.systally .tag.ok{color:var(--ok)}
.qr{border:1px solid var(--muted);border-left-width:4px;border-radius:9px;margin:6px 0;background:var(--card)}
.qr.right{border-left-color:var(--ok)} .qr.partial{border-left-color:var(--warn)} .qr.wrong{border-left-color:var(--danger)} .qr.saq{border-left-color:var(--primary)}
.qr-head{display:flex;gap:10px;align-items:flex-start;padding:9px 11px 7px}
.qr-mk{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;padding:2px 8px;border-radius:6px;font-size:.82rem;background:var(--muted)}
.qr.right .qr-mk{background:var(--ok);color:var(--onprimary)} .qr.partial .qr-mk{background:var(--warn);color:var(--onprimary)} .qr.wrong .qr-mk{background:var(--danger);color:#fff}
.qr-stem{font-size:.9rem;line-height:1.35;flex:1}
.qr-acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:0 11px 9px}
.qa{padding:3px 11px;font-size:.77rem;border:1px solid var(--muted);border-radius:14px;background:transparent;color:inherit;cursor:pointer}
.qa:hover{border-color:var(--primary)} .qa.on{background:var(--primary);color:var(--onprimary);border-color:var(--primary)}
.qr-pane{padding:2px 11px 11px}
.qr .src{font-size:.72rem;color:var(--primary);margin-right:auto;opacity:.85}
.qr .you{font-size:.8rem;padding:2px 11px 4px;opacity:.85}
.qr .steps{padding:2px 11px 6px}
.score-hero{font-size:2.2rem;font-weight:800;text-align:center;margin:.3rem 0 0}
.score-sub{text-align:center;color:var(--muted-fg);margin:0 0 10px}
/* chart */
.spark{width:100%;height:84px;display:block}
.hist{font-size:.82rem;color:var(--muted-fg)}
.hist td{padding:2px 8px 2px 0}
/* chain warmup */
.chain{display:flex;flex-direction:column;gap:2px;margin:8px 0}
.bead{background:var(--accent);border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:.9rem}
.bead.blank{border-style:dashed;color:var(--warn);text-align:center}
.verb{color:var(--muted-fg);font-size:.78rem;padding:0 12px}
.note{border:1px solid var(--border);border-left:4px solid var(--warn);border-radius:8px;
  padding:8px 10px;font-size:.84rem;color:var(--muted-fg);margin:10px 0}
.src{font-size:.75rem;color:var(--muted-fg);margin-top:6px}
dialog{background:var(--card);color:var(--fg);border:1px solid var(--border);
  border-radius:var(--radius);max-width:640px;width:calc(100% - 32px);padding:18px}
dialog::backdrop{background:rgb(0 0 0 / .6)}
h3{margin:14px 0 4px;font-size:.95rem}
.footbar{position:fixed;bottom:0;left:0;right:0;background:var(--bg);
  border-top:1px solid var(--border);padding:10px 14px;display:none;gap:8px;z-index:5}
.footbar.on{display:flex}
.footbar .btn{flex:1}
a{color:var(--primary)}
/* ── home: one screen of row cards, each opening its own screen (was one 14.5-screen scroll) ── */
.hero{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:var(--fg);cursor:pointer;
  background:color-mix(in srgb,var(--primary) 14%,var(--card));border:1px solid color-mix(in srgb,var(--primary) 45%,transparent);
  border-radius:12px;padding:12px 14px;margin:2px 0 4px}
.hero small{display:block;font-size:.76rem;color:var(--primary);font-weight:650}
.hero b{display:block;font-size:1rem;line-height:1.35;margin-top:2px}
.hero .go{flex:0 0 auto;margin-left:auto;width:42px;height:42px;border-radius:50%;background:var(--primary);color:var(--onprimary);
  display:flex;align-items:center;justify-content:center;font-size:1rem}
.lsec{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-fg);margin:12px 4px 5px}
.lrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:var(--fg);cursor:pointer;
  background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px 12px;margin:0 0 7px;
  transition:border-color var(--dur) var(--ease)}
.lrow:hover{border-color:color-mix(in srgb,var(--primary) 55%,var(--border))}
.lic{flex:0 0 40px;height:40px;border-radius:10px;background:var(--muted);display:flex;align-items:center;justify-content:center;font-size:1.15rem}
.ltx{flex:1 1 auto;min-width:0}
.ltx b{display:block;font-size:.97rem;font-weight:650}
.ltx small{display:block;font-size:.8rem;color:var(--muted-fg);line-height:1.35;margin-top:1px}
.lch{flex:0 0 auto;color:var(--muted-fg);font-size:1.3rem;line-height:1}
.shead{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.shead h2{margin:0;font-size:1.1rem;flex:1}
.shead .btn{padding:6px 12px;flex:0 0 auto}
.card .lead{margin:0 0 4px;color:var(--muted-fg);font-size:.9rem;line-height:1.5}
/* each screen's full explanation, folded under its one-line lead (self-explaining, but out of the way) */
.how{margin:0 0 6px}
.how>summary{cursor:pointer;font-size:.82rem;font-weight:650;color:var(--primary);list-style:none;display:inline-block;padding:2px 0}
.how>summary::-webkit-details-marker{display:none}
.how>summary::before{content:'ⓘ '}
.how[open]{border-left:2px solid var(--border);padding-left:10px;margin:4px 0 10px}
.how p{font-size:.86rem;color:var(--muted-fg);margin:.4rem 0}
/* ── written answers: her case questions, learned from a short version (ported from hs2-test3's SAQ Trainer) ── */
.sdoor{border-left:4px solid var(--danger)}
.slist{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.srow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;border:1px solid var(--border);border-radius:var(--radius);
  padding:8px 10px;background:var(--muted);cursor:pointer}
.srow b{flex:1 1 160px;font-size:.86rem;font-weight:600}
.srow .m{color:var(--muted-fg);font-size:.74rem;white-space:nowrap}
.sbadge{font-size:.7rem;padding:1px 8px;border-radius:99px;background:var(--accent);color:var(--muted-fg);white-space:nowrap}
.sbadge.lock{background:hsl(158 64% 42% / .2);color:var(--ok);font-weight:650}
.sbadge.go{background:hsl(38 92% 55% / .18);color:var(--warn)}
#sqBack,.qhead .tag{white-space:nowrap;flex:0 0 auto}
.sstages{display:flex;gap:4px;margin:0 0 12px}
.sstage{flex:1;font:inherit;font-size:.74rem;font-weight:600;padding:5px 2px;border-radius:6px;background:var(--muted);
  color:var(--muted-fg);border:1px solid var(--border);cursor:pointer}
.sstage.on{background:var(--primary);color:var(--onprimary);border-color:var(--primary)}
.sask{font-weight:650;margin:0 0 10px;line-height:1.45}
.shook{border:1px dashed var(--primary);border-radius:8px;padding:8px 10px;font-size:.88rem;margin:10px 0;line-height:1.45}
.ssteps{margin:0 0 6px;padding-left:1.5em}
.ssteps li{margin:7px 0;line-height:1.5}
.ssteps b,.scheck b{color:var(--warn);font-weight:700}
.sprog{display:flex;align-items:center;gap:10px;margin:0 0 6px}
.scheck label{display:flex;gap:9px;align-items:flex-start;margin:9px 0;cursor:pointer;line-height:1.45;font-size:.92rem}
.scheck input{margin-top:3px;width:18px;height:18px;flex:0 0 auto;accent-color:var(--ok)}
.sres{font-size:1.7rem;font-weight:800;text-align:center;margin:.2rem 0}
.syou{white-space:pre-wrap;font-size:.86rem;background:var(--muted);border-radius:8px;padding:8px 10px;margin:6px 0 10px}

.sheet h3{margin:0 0 4px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.sgrp{margin:12px 0 0}
.sgq{font-size:.8rem;font-weight:700;color:var(--muted-fg);margin:0 0 2px}
.ssteps.sfacts{margin:0}
.ssteps.sfacts li{margin:4px 0;line-height:1.4}
.sgap{display:block;width:100%;text-align:left;font:inherit;font-size:.9rem;color:var(--muted-fg);background:transparent;
  border:1px dashed var(--primary);border-radius:8px;padding:7px 10px;cursor:pointer;line-height:1.4}
.sgap.open{border-style:solid;color:var(--fg);cursor:default}
.sgap.ok{border:1px solid var(--ok);color:var(--fg);cursor:default}
.sgap.miss{border:1px solid var(--danger);color:var(--fg);cursor:default}

.sgmk .btn{flex:1;padding:7px 10px;font-size:.84rem}

/* a correction line's reason, and the list's sections (her cases, then each module folded) */
.sfix{font-size:.78rem;color:var(--warn);line-height:1.4;margin:2px 0 4px}
.ssec{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-fg);margin:16px 0 4px}
.smod{margin:8px 0 0;border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px}
.smod>summary{cursor:pointer;font-weight:650;font-size:.88rem}
/* the case scenario, folded above a written question; its figure shows under it */
.scase{margin:0 0 8px}
.scase>summary{cursor:pointer;font-size:.82rem;font-weight:650;color:var(--muted-fg);list-style:none}
.scase>summary::-webkit-details-marker{display:none}
.scase>summary::before{content:'▸ '}
.scase[open]>summary::before{content:'▾ '}
</style>

<body>
<header>
  <h1>HS2 · Paper Sim</h1>
  <span class="d" id="countdown"></span>
  <a class="btn ghost" href="#vid" title="The three module video playlists">▶</a>
  <button class="btn ghost" id="themeBtn" title="theme">◐</button>
  <button class="btn ghost" id="helpBtn" title="what is this?">?</button>
</header>
<main id="view"></main>
<div class="footbar" id="footbar"></div>
<dialog id="help"></dialog>

<script>
const DATA = /*@BANK@*/;
/* references: q.refs = [{k:'slide'|'her'|'patton', src, slide|t, ...}] in authority order —
   her slide, her prose, Patton. A bank built with the older single q.ref still renders. */
for(const q of DATA.questions){ if(!q.refs) q.refs = q.ref ? [{k:q.ref.slide?'slide':'her', ...q.ref}] : []; }
/* short versions of the written answers (content/case-shorts.js + module-shorts.js, gated by shorts.mjs, 26 Sep 2026). His rule
   (estate memory "saq-short-answers"): a written answer is learned from a SHORT version, a few words a line, cut from the answer
   the bank carries. So wherever a written question is marked (Learn mode, the mock) you tick its short lines; q.saq.full keeps
   the full answer word for word. A correction line (f.fix: her feedback slips) says so in the tick list too. */
const SHORTS = /*@SHORTS@*/;
for(const q of DATA.questions) if(SHORTS[q.id]){
  q.short = SHORTS[q.id];
  q.saq = {...q.saq, full:q.saq.steps, steps:q.short.groups.flatMap(g=>g.facts.map(f=>f.t.replace(/\*\*/g,'')+(f.fix?` (⚠ corrected: ${f.fix.split('. ')[0]})`:'')))};
}
/* whose full answer it is: hers (quiz feedback, her decks, her slides) unless the source says the tool wrote it */
const toolsAns = q => /^Model answer is the tool/.test(q.saq&&q.saq.src||'');
/* page-capture junk that rode in with two of her Light & Sound answers (a web font, a hidden-style rule): never shown */
const junkStep = s => /@font-face|\.sf-hidden\{/.test(s);
/* the full answer, word for word, folded under a short answer's tick list */
const herFull = q => q.saq&&q.saq.full ? `<details class="hlans"><summary>📄 ${toolsAns(q)?'The full answer (this tool’s, from her decks)':'Her full answer, word for word'}</summary><div class="hlbody">${q.saq.full.filter(s=>!junkStep(s)).map(s=>esc(s)).join(String.fromCharCode(10))}</div></details>` : '';
const REF = {slide:{ic:'📖',lbl:'Her slide'}, her:{ic:'✍',lbl:'Her notes'}, course:{ic:'📄',lbl:'Course file'}, patton:{ic:'📕',lbl:'Patton'}};
/* ── state ─────────────────────────────────────────────────────────── */
/* Its own prefix: every tool on jeremyspm.github.io shares ONE localStorage (it is per origin, not per path), so the final keeps
   its scores, misses, ticks and resume slot apart from the three module sims it imports its questions from. */
const PFX = 'hs2f.';
const LS = k => { try { return JSON.parse(localStorage.getItem(PFX+k)) } catch(e){ return null } };
const SV = (k,v) => { try { localStorage.setItem(PFX+k, JSON.stringify(v)) } catch(e){} };
let S = {
  scores: LS('scores')||[],   // {t, mode, got, tot, label}
  miss:   LS('miss')  ||{},   // qid -> wrong count
  seen:   LS('seen')  ||{},   // qid -> sittings
  mastery:LS('mastery')||{}, // focus topic id -> 1 when he can do it
  n:      LS('n')||12,       // how many a Learn deal hands out: 12 | 25 | 50 | 100 | 'all'
  pick:   LS('pick')||[],    // quiz ids ticked under Pick my rep, in tick order
};
if(![12,25,50,100,'all'].includes(S.n)) S.n = 12;
S.pick = (Array.isArray(S.pick)?S.pick:[]).filter(id=>DATA.quizzes.some(z=>z.id===id));
/* The sitting date is PER VIEWER. He has an extension and sits 25 Sep; the cohort's
   window closes Mon 21 Sep, so a single hard-coded date would mislead whoever it did
   not belong to. Default is his (it is his tool); anyone else taps the countdown and
   sets their own, kept in their own browser. */
const COHORT_CLOSE = '2026-11-05';      // the HS2 exam: Thu 5 Nov 2026, 12:30, on campus (official timetable; her Canvas page still says 5/06)
const DEFAULT_SITTING = '2026-11-05';
const sittingISO = () => LS('testday') || DEFAULT_SITTING;
const TESTDAY = () => new Date(sittingISO() + 'T12:00:00+12:00');
const daysLeft = () => Math.max(0, Math.ceil((TESTDAY() - Date.now())/864e5));
const sittingLabel = () => new Date(sittingISO() + 'T12:00:00+12:00')
  .toLocaleDateString('en-NZ', { day: 'numeric', month: 'short' });
function askSitting(){
  const cur = sittingISO();
  const v = prompt('When do you sit the HS2 exam?  (YYYY-MM-DD)\n\nThe cohort sits it on '
    + COHORT_CLOSE + '. Set your own date if you have a different slot.', cur);
  if(!v) return;
  const t = v.trim();
  if(!/^\d{4}-\d{2}-\d{2}$/.test(t) || isNaN(new Date(t + 'T12:00:00+12:00'))){
    alert('Use the form YYYY-MM-DD, e.g. 2026-11-05.'); return;
  }
  SV('testday', t); paintCountdown();
  if(document.querySelector('#fhead')) home();
}
function paintCountdown(){
  const el = $('#countdown'); if(!el) return;
  el.textContent = `${daysLeft()}d to your sitting · ${sittingLabel()}`;
  el.title = 'Your sitting is ' + sittingISO() + '. The cohort sits the exam on ' + COHORT_CLOSE
           + '. Click to change yours — it is saved in this browser only.';
  el.style.cursor = 'pointer';
  el.onclick = askSitting;
}
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]} return a };
const SYS = {cvs:'Cardiovascular', resp:'Respiratory', lymph:'Lymphatic', ms:'Musculoskeletal', ns:'Nervous', endo:'Endocrine',
  repro:'Reproduction', gen:'Genetics', senses:'Special senses, light & sound', mixed:'Mixed', cases:'Exam cases'};
const MODN = {m1:'Module 1 · heart, lungs, lymph', m2:'Module 2 · bones, nerves, hormones', m3:'Module 3 · repro, genetics, senses', cases:'The exam cases', exam:'Her exam revision deck'};
const MODS = {m1:'Module 1', m2:'Module 2', m3:'Module 3', cases:'Cases', exam:'Her revision deck'};
/* an imported question's figure lives in its own sim ("../hs2-test2/img/…"): a name with a '/' in it is already a path */
const imgU = f => f.includes('/') ? f : 'img/'+f;
const slideU = f => f.includes('/') ? f : 'img/slides/'+f;

/* ── dealing ───────────────────────────────────────────────────────── */
const CLOSED = DATA.questions.filter(q=>!q.saq);
function pickN(pool, n, excl){
  const fresh = pool.filter(q=>!excl.has(q.id));
  /* Least-seen first: rank = times dealt, so nothing repeats an (n+1)th time
     until the whole pool has been dealt n times. Misses jump the queue (-2),
     Math.random() only breaks ties among equally-seen questions. */
  const rank = q => (S.miss[q.id]?-2:0) + (S.seen[q.id]||0) + Math.random();
  return fresh.sort((a,b)=>rank(a)-rank(b)).slice(0,n);
}
function dealStratified(n){
  const out=[], excl=new Set();
  /* shares are DERIVED from the bank — her revealed question distribution —
     never typed. Announced emphasis does not get a vote. */
  const share = {};
  for(const q of CLOSED) share[q.mod]=(share[q.mod]||0)+1/CLOSED.length;
  for(const m of ['m1','m2','m3','cases']){
    const want=Math.round(n*(share[m]||0));
    for(const q of pickN(CLOSED.filter(x=>x.mod===m), want, excl)){ out.push(q); excl.add(q.id); }
  }
  while(out.length<n){
    const q=pickN(CLOSED, 1, excl)[0]; if(!q)break; out.push(q); excl.add(q.id);
  }
  return shuffle(out).slice(0,n);
}
/* How many a Learn deal hands out is HIS call (the chips on the Learn door), saved in this
   browser. 'all' is the whole pool, least-seen first — so a run that stops halfway and is
   dealt again leads with the questions it never reached. A mock test keeps its own size. */
const NOPTS = [12,25,50,100,'all'];
const CAP = () => S.n==='all' ? Infinity : S.n;
const howMany = pool => Math.min(CAP(), pool);
function dealMini(n=12){ return dealStratified(n) }
function dealSys(s,n){ return shuffle(pickN(CLOSED.filter(q=>q.mod===s), n, new Set())) }
/* the ten cases in booklet order: her formative questions on a case first, then its written questions */
const CASEQS = () => DATA.focus.filter(f=>f.tier===0).flatMap(f=>(f.qs||[]).map(id=>DATA.questions.find(q=>q.id===id)).filter(q=>q&&q.mod==='cases'));
function dealFull(){
  /* THE EXAM'S OWN SHAPE (her Assessment Overview): 32 questions, 130 min, 37% of the MARKS written, and the written ones
     come from the starred cases. Her closed quiz items often carry several marks (a 4-pair matching = 4), so eight written
     questions can be anywhere from a quarter to half the marks: written questions are added one case at a time — least-sat
     case first, least-seen question of it — and closed ones dropped, until the written share reaches 37% with 32 questions. */
  const closed = dealStratified(32);
  const byCase = {};
  for(const q of DATA.questions) if(q.mod==='cases'&&q.saq) (byCase[q.quiz]=byCase[q.quiz]||[]).push(q);
  const load = c => byCase[c].reduce((a,q)=>a+(S.seen[q.id]||0),0) + Math.random();
  const order = Object.keys(byCase).map(c=>[c,load(c)]).sort((a,b)=>a[1]-b[1]).map(x=>x[0]);
  const queue = order.map(c=>pickN(byCase[c], byCase[c].length, new Set()));      /* each case's questions, least-seen first */
  const written = [];
  const marks = a => a.reduce((t,q)=>t+(q.pts||1),0);
  for(let r=0; written.length<16; r++){
    const next = queue[r % queue.length].shift(); if(!next){ if(queue.every(x=>!x.length)) break; continue; }
    written.push(next);
    const w = marks(written), c = marks(closed.slice(0, 32-written.length));
    if(w/(w+c)>=0.37) break;      /* stop at the exam's share; the least-sat rotation carries the other cases into the next sitting */
  }
  return closed.slice(0, 32-written.length).concat(written);
}
/* the misses pile, worst first: once four or more have been missed twice, only those */
function missPool(){
  let ids = Object.keys(S.miss).filter(id=>S.miss[id]>=2);
  if(ids.length<4) ids = Object.keys(S.miss);
  return CLOSED.filter(q=>ids.includes(q.id));
}
function dealMisses(n=12){ return shuffle(missPool()).slice(0,n) }
/* the ticked quizzes, whole (written questions included), in the order the list shows
   them — one run, no cap: you chose the quizzes, you get their questions */
function dealPick(){
  const on = new Set(S.pick);
  return DATA.quizzes.filter(z=>on.has(z.id)).flatMap(z=>DATA.questions.filter(q=>q.quiz===z.id));
}

/* ── focus checklist ───────────────────────────────────────────────────
   Her focus post names topics in one or two words. DATA.focus says how far
   each one goes and how heavily her own bank drills it, so a tick is a real
   claim rather than a shrug. Ticks are per-browser (localStorage). */
const FTIER = {
  0:{n:'The exam is built on these — her words', c:'var(--ok)',
     w:'Her Assessment Overview: the exam “will be based on the starred *Case studies in your Case Study Booklet A”, and her booklet page names ten; below them sits the exam revision deck she made for it. Each row deals that case’s written questions against HER model answer, her formative-test questions on it, and the module questions it leans on; a starred question she has not answered yet is listed, not dealt. When her EXAM CASE STUDY HELPLINE opens (Mon 19 Oct), whatever she names there joins this band.'},
  1:{n:'On a case topic', c:'var(--danger)', w:'Module rows one of her ten cases stands on — a starred question or her model answer is about it (each row says which case). Every question on her exam revision deck sits on one of these, so the closed part of the paper most likely comes from here too.'},
  2:{n:'Off the cases, but big in her quizzes', c:'var(--warn)', w:'No case needs these, but her module quizzes drilled them hard (30+ marks). Worth a pass once tier 1 is solid.'},
  3:{n:'Only if there is time', c:'var(--muted-fg)', w:'Off the cases and thin in her quizzes. They were weekly practice for the module tests; the exam is 32 questions on ten cases.'},
};
const FLAGN = {D:'her diagrams row', P:'her processes row', R:'her reasoning row', T:'her terminology row', H:'named on her Module 3 help board', S:'starred exam case', X:'she made it for the exam'};

function focusStats(){
  const F = DATA.focus, done = F.filter(f=>S.mastery[f.id]);
  return { n:F.length, d:done.length,
           pts:F.reduce((a,b)=>a+b.pts,0), dpts:done.reduce((a,b)=>a+b.pts,0) };
}
function focusHead(){
  const st = focusStats(), pc = st.pts ? Math.round(st.dpts/st.pts*100) : 0;
  return `<b>${st.d} of ${st.n} topics</b>
    <span class="fbar"><i style="width:${pc}%"></i></span>
    <span class="hist">${st.dpts} of ${st.pts} marks of her bank covered</span>`;
}
function focusCard(){
  if(!DATA.focus.length) return '';
  const rows = t => DATA.focus.filter(f=>f.tier===t).map(f=>{
    const on = !!S.mastery[f.id], chips = [];
    (f.flag||'').split(' ').filter(Boolean).forEach(x=>{
      if(x==='tape') chips.push('<span class="fchip tape">🎤 she said it in class</span>');
      else if(FLAGN[x]) chips.push(`<span class="fchip her">📌 ${FLAGN[x]}</span>`);
    });
    if(f.hl)  chips.push('<span class="fchip hl">🆘 on her helpline</span>');
    if(f.rev) chips.push(`<span class="fchip rev">🗓 revision ${esc(f.rev)}</span>`);
    if(f.kh)  chips.push(`<span class="fchip kh">🎮 ${f.kh} in her Kahoots</span>`);
    if(f.saq) chips.push(`<span class="fchip saq">✍️ ${f.saq} written / dropdown</span>`);
    if(f.cases&&f.cases.length) chips.push(`<span class="fchip her">📎 feeds case ${f.cases.map(c=>c.slice(1)).join(', ')}</span>`);
    return `<div class="frow${on?' on':''}" style="--tc:${FTIER[f.tier].c}" data-fid="${f.id}">
      <input type="checkbox" class="fchk" ${on?'checked':''} aria-label="I can do this: ${esc(f.t)}">
      <details class="fbody"><summary>
        <span class="ft">${esc(f.t)}</span>
        <span class="fmeta"><span class="fchip sys">${MODS[f.mod]||''} · ${SYS[f.sys]}</span><span class="fchip">${f.n} questions</span><span class="fchip">${f.pts} marks</span><span class="fchip">${f.qz} quizzes</span>${chips.join('')}</span>
      </summary>
      <div class="fdet">
        <p><b>Done when you can:</b> ${esc(f.done)}</p>
        <p><b>How she asks it:</b> ${esc(f.ask)}</p>
        ${f.said ? `<p><b>Her words, HELP WITH MODULE 3 TOPICS board:</b> “${esc(f.said)}”</p>` : ''}
        ${f.held&&f.held.length ? `<p><b>Starred, not dealt yet</b> — her answer is not readable yet:${f.held.map(h=>'<br>• '+esc(h)).join('')}</p>` : ''}
        ${f.was0 ? `<p class="fcap">In ${esc(f.was0)} this row sat on top (her words about THAT module’s test); here it ranks on marks like every module row.</p>` : ''}
        ${f.hl ? `<p><b>Her helpline section:</b> “${esc(f.hl)}” — she posts <a href="${esc(f.hlUrl)}" target="_blank" rel="noopener">her own worked answers</a> for it.</p>` : ''}
        ${f.cap ? `<p class="fcap"><b>Where it ends:</b> ${esc(f.cap)}</p>` : ''}
        ${herAnswer(f.id)}
        ${f.qs&&f.qs.length?`<div class="aiwrap"><button class="btn primary learnrow" data-learnf="${f.id}">📖 Learn her ${f.qs.length} question${f.qs.length>1?'s':''} on this</button><span class="refsrc">only her questions on this topic, marked one at a time with her answer, slide and video in place — one-tap questions first, written ones last</span></div>`:''}
        <div class="aiwrap"><button class="btn ghost askai" data-askf="${f.id}">${AI_LBL}</button><span class="refsrc">copies a prompt for Gemini (or any AI) — her level, her wording and her “where it ends” line go with it</span></div>
        <div class="refsrc">Focus Points doc: ${esc(f.crit)}</div>
      </div></details></div>`;
  }).join('');
  const tier = t => `<div class="ftier" style="color:${FTIER[t].c}">${FTIER[t].n}
      <span class="fnum">· ${DATA.focus.filter(f=>f.tier===t).length} topics</span></div>
    <div class="fwhy">${FTIER[t].w}</div>${rows(t)}`;
  return `<div class="card" style="border-left:4px solid var(--warn)">
      <div>
        <div class="fhead" id="fhead">${focusHead()}</div>
        <p class="lead">Her ten starred cases on top — the exam is built on them — then every row of the three module checklists, ranked on marks. Tick a row when you can do it cold.</p>
        <details class="how"><summary>How this list was made</summary><p class="fwhy">The ten rows on top are HER ten starred cases — the exam is built on them. Below them, every row of the three module checklists (each one of her own numbered criteria), ranked again on its marks in her quizzes. <b>Questions</b> and <b>marks</b> are counted by the build, never by a person. <b>done / how she asks it / where it stops</b> are this tool’s reading; the questions, her model answers and her case scenarios are hers. The best available read on her emphasis, not a leaked paper.</p></details>
        ${tier(0)}${tier(1)}${tier(2)}${tier(3)}
        <div class="refsrc" style="margin-top:10px">Sources: her Assessment Overview and CASE STUDY BOOKLET A page · Case Study Workbook 2026 S2 (scenarios, starred questions, figures) · her 2024 case model-answer decks, her NS1 deck and NS2 learning page, her Fertility quiz · her Case Study Formative Test Modules 1–2 · her Continuous Tests and Exam Focus Points criteria doc and the three module sims’ checklists. Ticks are saved in this browser only.</div>
      </div>
  </div>`;
}
/* her own worked answer for this topic, verbatim from the helpline answers board.
   Her CAPITALISED terms are the mark-earning words — left exactly as she wrote them. */
function herAnswer(id){
  const h = (DATA.helpline||{})[id];
  if(!h) return '';
  const body = h.parts.map(p=>`<div class="hlh">${esc(p.h)}</div>${esc(p.t)}`).join(String.fromCharCode(10));
  return `<details class="hlans"><summary>✅ Her own worked answer — open it</summary>
    <div class="hlbody">${body}
<span class="refsrc">Verbatim from her ${h.from?esc(h.from)+' board':'MODULE 2 HELPLINE: LET US REFLECT (answers) board. The words she put in CAPITALS are the ones carrying the marks'}. <a href="${esc(h.url)}" target="_blank" rel="noopener">Open it on Canvas</a> for her figures.</span></div></details>`;
}

function bindFocus(){
  document.querySelectorAll('.frow').forEach(r=>{
    const cb = r.querySelector('.fchk');
    if(!cb) return;
    cb.onchange = () => {
      if(cb.checked) S.mastery[r.dataset.fid] = 1; else delete S.mastery[r.dataset.fid];
      SV('mastery', S.mastery);
      r.classList.toggle('on', cb.checked);
      const h = $('#fhead'); if(h) h.innerHTML = focusHead();
      const sm = $('#fsum'); if(sm){ const st=focusStats(); sm.textContent = st.d+'/'+st.n }
    };
  });
}

/* ── home ──────────────────────────────────────────────────────────── */
/* ── decide for me ────────────────────────────────────────────────────
   The whole triage in one button. The exam is 32 questions on her ten starred cases; the 1,300 module questions were weekly
   practice. So: her own exam questions first (A), least-seen and misses first; once every one has been seen, the module
   questions on the case topics (B) join. Nothing to choose, nothing to plan. */
const CORE_A = () => DATA.questions.filter(q=>DATA.core.a.includes(q.id));
const CORE_B = () => DATA.questions.filter(q=>DATA.core.b.includes(q.id));
function dealCore(n=15){
  const A = CORE_A(), allSeen = A.every(q=>S.seen[q.id]);
  return pickN(allSeen ? A.concat(CORE_B()) : A, n, new Set());
}
function coreCard(){
  const A = CORE_A(), B = CORE_B();
  const seenA = A.filter(q=>S.seen[q.id]).length, missA = A.filter(q=>S.miss[q.id]).length;
  const seenB = B.filter(q=>S.seen[q.id]).length;
  const pA = Math.round(100*seenA/Math.max(1,A.length)), pB = Math.round(100*seenB/Math.max(1,B.length));
  return `<div class="card door" style="border-left:4px solid var(--ok)">
    <p>You do <b>not</b> have to do ${DATA.stats.n} questions. The exam is 32 questions on her ten starred cases. <b>${A.length}</b> questions here are hers, written for it — the cases, her formative test, her revision deck. That is the job. Behind them sit <b>${B.length}</b> module questions on the same topics, for once the ${A.length} are done. Everything else is optional.</p>
    <button class="btn primary wide" data-go="core" data-learn="1">▶ Today’s 15 — ${seenA<A.length?'from her exam questions':'her exam questions + the case topics'}</button>

function start(mode,learn=false){

function shuffleStable(seed,arr){
  let h=0;for(const c of String(seed))h=(h*31+c.charCodeAt(0))>>>0;
  return arr.map((v,i)=>({v,k:(h=(h*1103515245+12345)>>>0)})).sort((a,b)=>a.k-b.k).map(x=>x.v);
}
function saveAns(){
  const q=SIT.deck[SIT.i];
  if(q.type==='essay'){const t=document.querySelector('[data-essay]');if(t&&t.value.trim())SIT.ans[q.id]={text:t.value};return}
  if(q.type==='match'||q.type==='cloze'){
    const pick={};let any=false;
    document.querySelectorAll('[data-i]').forEach(el=>{if(el.value){pick[el.dataset.i]=el.value;any=true}});
    if(any)SIT.ans[q.id]={pick};return}
  const sel=[...document.querySelectorAll('.opt input:checked')].map(i=>+i.value);
  if(sel.length)SIT.ans[q.id]={sel};
}
/* ── learn mode ────────────────────────────────────────────────────────
   The same deck and the same marking, but per question: Check marks it in place and
   the answer, her slide and the matched video sit right under it — the results
   accordion brought forward to the moment you still care. Slide and video can be
   opened BEFORE answering; that counts as a peek, and a right answer after a peek
   does not clear a miss. Check with nothing picked = "show me" = a miss. Learn
   sittings feed the misses pile and the least-seen dealer, never the score chart. */
function learnChipsHTML(q){
  const chips=[];
  if(q.vid)chips.push(`<button class="qa" data-act="vid">▶ Video · from ${mmss(Number.isInteger(q.vid.at)?q.vid.at:0)}</button>`);
  for(const r of q.refs)chips.push(`<button class="qa" data-act="${r.k}">${REF[r.k].ic} ${REF[r.k].lbl}${r.k==='patton'?' p. '+r.pp:''}</button>`);
  if(hasHer(q))chips.push('<button class="qa" data-act="hl">✅ Her worked answer</button>');
  const hint=chips.length?(SIT.chk[q.id]?'':'<span class="hint">open before or after you answer</span>')
    :(DATA.questions.some(x=>x.vid||(x.refs&&x.refs.length))
      ?'<span class="hint">nothing of hers or Patton’s states this one outright — the answer shows on Check</span>'
      :'<span class="hint">her slides and the videos have not been matched to this module yet — the answer shows on Check</span>');
  return `<div class="lres" data-qid="${q.id}">${chips.join('')}${hint}<div class="qr-pane" hidden></div></div>`;
}
/* resources open by themselves for: written questions, skipped ones, anything not fully right */
const learnOpen=(q,chk)=>!chk.r||!SIT.ans[q.id]||chk.r.got<chk.r.tot;
function learnCheck(){

/* ── marking ───────────────────────────────────────────────────────── */
function markQ(q,a){
  if(q.type==='essay')return null; // self-marked
  if(!a)return{got:0,tot:q.pts,detail:'no answer'};
  if(q.type==='mcq'||q.type==='tf'||q.type==='multi'){
    const chosen=(a.sel||[]).map(i=>q.opts[i]);
    const right=chosen.length===q.key.length&&q.key.every(k=>chosen.includes(k));
    return{got:right?q.pts:0,tot:q.pts,you:chosen.map(o=>optLabel(q,o)).join(' · ')}}
  if(q.type==='match'){
    let got=0;q.pairs.forEach((p,i)=>{if((a.pick||{})[i]===p.right)got++});
    return{got:got*q.pts/q.pairs.length,tot:q.pts,you:q.pairs.map((p,i)=>(a.pick||{})[i]||'—').join(' · ')}}
  if(q.type==='cloze'){
    let got=0;
    q.blanks.forEach((b,i)=>{if(blankOK(q,b,(a.pick||{})[i]))got++});
    return{got:got*q.pts/q.blanks.length,tot:q.pts,you:q.blanks.map((b,i)=>(a.pick||{})[i]||'—').join(' · ')}}
}
/* dropdown: only her marked option is right. Typed: every accepted spelling is. */
function blankOK(q,b,v){

  const nrm=s=>String(s||'').toLowerCase().replace(/[’‘`´]/g,"'").replace(/[“”]/g,'"').replace(/\s+/g,' ').trim().replace(/[.]+$/,'');
  const x=nrm(v);if(!x)return false;
  const also=(b.also||[]).some(o=>nrm(o)===x);
  return q.bk==='dd' ? (x===nrm(b.correct)||also) : (b.options.some(o=>nrm(o)===x)||also);
}
function blankLabel(b,i){return b.ctx?`${b.ctx} ___`:(b.label&&!/^Answer \d+:?$/.test(b.label)?b.label.replace(/:$/,''):`Blank ${i+1}`)}

  SV('miss',S.miss);SV('seen',S.seen);

  of her slides, learning-page paragraphs, Anatomy Monday answers, the lab workbook, the discussion-board and
  helpline answers she posted, the other lecture files posted in the course
  (shown as 📄 Course file, never as hers) and the whole of Patton was shortlisted by keyword, read by a model
  that had to quote the exact words that state the answer, that quote was re-found in the source by a script,
  and a second pass tried to knock each match down. For a matching question with many pairs, a table that
  states at least half of them counts.
  ${DATA.stats.withRef} of the ${DATA.stats.n} questions carry at least one — ${DATA.stats.withHer} from her own
  material, ${DATA.stats.withPatton} with a Patton passage (${DATA.stats.pattonOnly} have only Patton). A question with
  nothing is a question nothing states outright, and no reference beats a wrong one. Patton passages are short
  excerpts (a sentence or two, never more than 70 words) from <i>Patton &amp; Thibodeau, Anatomy &amp; Physiology,
  9th ed.</i> (Elsevier, 2016), quoted for study with the page named; the course’s ClinicalKey copy is the 2019
  edition, so figure numbers may differ. Where Patton and Hannetjie disagree, she wins.</p>
  <h3>Ask an AI — the 🤖 buttons</h3>
  <p>Under every marked question, and inside every row of the focus list, <b>${AI_LBL}</b> copies a
  ready-made prompt to paste into Gemini (or any AI chat). It asks the AI to <b>show it first</b> (a labelled
  sketch, a real image if it can, and what to search for a proper diagram), then one everyday analogy mapped back to the
  real terms, in <b>her</b> words — and to <b>stop there</b> until you type “ready”. Only then does it run a five-question
  blind quiz with instant feedback, easiest question first. It carries her
  key, her notes and her “where it ends” line, so the AI teaches to her paper and stops where she stops.
  If the question has a figure, or her slide is its reference, the copy carries that too, as one picture: paste
  once and the prompt and the picture both land. If your AI keeps only one of them, two small buttons appear
  under the copied button to re-copy just the text or just the figure. This page sends nothing anywhere; you
  paste it yourself. An AI’s quiz checks that the analogy landed. Only her questions here check that it would
  earn marks — come back and sit them.</p>
  <h3>What’s held out</h3>
  <p>${DATA.held.length} questions are held: starred case questions whose answer she has not posted where it can be read
  (case 14’s answer is in her colour-blindness quiz and case 15’s on its board, both hidden on Canvas today), and
  any capture that did not survive. Her EXAM CASE STUDY HELPLINE opens Mon 19 Oct; it joins this tool when it does.</p>
  <h3>Your data</h3>
  <p>Scores and misses live in this browser only. Nothing is sent anywhere. Clearing site data wipes them.</p>
  <h3>For whoever maintains this</h3>
  <p>Built by <code>build.mjs</code> from its own captures (<code>hs2-anki/final</code>), the three module sims’ built pages,
  and <code>content/cases.js</code>. Rebuild after any module sim changes: <code>python host-figs.py &amp;&amp; node build.mjs</code>. Bank built ${DATA.built}. Multi-answer questions mark all-or-nothing;
  matching and dropdowns mark per part.</p>

document.addEventListener('click',e=>{
  const vf=e.target.closest('.vfull'); if(vf){const c=vf.closest('.vclip');loadVid(c,+c.dataset.at,null);return}
  const fr=e.target.closest('.vframe'); if(fr&&!fr.querySelector('iframe')){const c=fr.closest('.vclip');loadVid(c,+c.dataset.at,+c.dataset.end);return}
  const qa=e.target.closest('.qa'); if(qa){const row=qa.closest('.qr,.lres'),pane=row.querySelector('.qr-pane'),act=qa.dataset.act,open=pane.dataset.act===act&&!pane.hidden;row.querySelectorAll('.qa').forEach(b=>b.classList.toggle('on',b===qa&&!open));if(open){pane.hidden=true;pane.dataset.act='';return}
    const q=SIT.deck.find(x=>x.id===row.dataset.qid);
    /* opening a resource on an unchecked learn-mode question is a peek */
    if(row.classList.contains('lres')&&!SIT.chk[q.id]){SIT.peek[q.id]=true;saveRun()}
    pane.innerHTML=paneHTML(q,act);pane.hidden=false;pane.dataset.act=act;return}
  const lf=e.target.closest('[data-learnf]'); if(lf){start('topic:'+lf.dataset.learnf,true);window.scrollTo(0,0);return}
  const ask=e.target.closest('[data-ask],[data-askf]');
  if(ask){
    if(ask.dataset.ask){const q=SIT.deck.find(x=>x.id===ask.dataset.ask);copyPrompt(ask,w=>aiQuestionPrompt(q,w),aiFigures(q).length?aiFigureBlob(q):null)}
    else copyPrompt(ask,aiTopicPrompt(DATA.focus.find(f=>f.id===ask.dataset.askf)),null);
    return}
  const sp=e.target.closest('[data-aitext],[data-aifig]'); if(sp){aiSplitCopy(sp);return}
  if(e.target.id==='shareBtn'){
  const l=S.scores[S.scores.length-1];
  const line=`HS2 Paper Sim — ${l.got}/${l.tot} (${Math.round(100*l.got/l.tot)}%) · ${l.label} · ${daysLeft()}d to my sitting`;
  navigator.clipboard&&navigator.clipboard.writeText(line);
  e.target.textContent='Copied ✓';setTimeout(()=>e.target.textContent='Copy score line',1500)}});
home();
